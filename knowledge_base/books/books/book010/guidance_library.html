规则冲突、输出不稳） | 先模糊验证，性能瓶颈再上网络 | A-06 |\n| 坐标变换 | 写成独立函数（`euler2dcm()`）；三维**分解到两个正交平面**分别用二维方程 | 三维不要硬推 | A-03 |\n| 融合架构 | **第一次做融合先从串行入手**（最稳） | 并行响应快但融合决策难；混合性能最优但验证复杂 | A-06 |\n\n## 9. 协同制导\n\n| 项目 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 一致性陷阱 | 一致性只保证\"一致\"，不保证\"一致到正确值\" | 所有弹预计到达时间都偏大 → 收敛后仍偏大，须引入参考节点/外部输入 | B-06 |\n| 期望攻击时间 | 必须在 **[最小可达时间, 最大可达时间]** 区间内取值 | 否则赶不上或需绕大圈超出机动范围 | B-06 |\n| 任务分配 | 加\"覆盖度\"约束防\"就近分配\"局部最优；结果频繁切换时加\"切换代价\"惩罚 | 目标分配与航迹规划是**迭代关系**而非串行 | B-06 |\n| 航迹安全裕度 | 设**最大绕飞系数**，超限重新分配目标 | 时间错开但风速扰动 → 交叉点险撞 | B-06 |\n| 人工势场局部极小 | 弹间距离在某范围波动超 **3 s** → 给一枚加随机方向短时推力 | 否则两弹僵持不动 | B-06 |\n\n---\n\n## 附：参数标定基准工况（供复现）\n\n本表第 5、6 节的仿真标定数值来自 `verify_engagement.py`（v3），基准工况：\n\n```\nR0 = 6000 m,  H0 = 500 m          Vm = 700 m/s,  Vt = 300 m/s\n目标 t = 5 s 起拉 9 g（t_go ≈ 1 s） 导弹过载限幅 25 g\n初速按碰撞三角解析设定             RK4 定步长 dt = 2 ms\n导引头：测角噪声 σ_λ + 一阶滤波微分  舵机一阶延迟解析离散解\n```\n\n所有数值均可用 `python3 verify_engagement.py` 一键复现（约 35~51 s）。\n", "size": 10212}, {"path": "assets/05_checklist.md", "kind": "md", "text": "# 数据资产 05 — 设计与仿真检查清单\n\n> 把 30 张卡的【A++ - 经验】段反写成**可勾选的检查项**，覆盖从建模到验收的完整链路。\n> 用法：每个阶段结束前逐条过一遍；任一项 ❌ 不得进入下一阶段。\n> 标注 ⚠️ 的是\"作者明确踩过的坑\"，属高优先级。\n\n---\n\n## 阶段 1：需求与建模\n\n- [ ] ⚠️ **执行机构延迟已进模型**再开始调参（`B-02`：LQR 仿真完美、上硬件就抖，根因是延迟未建模）\n- [ ] ⚠️ **过载限幅保留 20%~30% 裕度**（`A-04`：按 80% 设计，靶试时需求冲到 85%）\n- [ ] 明确是否带不等式约束：只要有界就必须用 PMP，变分法解不了（`B-01`）\n- [ ] 终端约束数量最小化——每加一个都可能丢掉解析解（`B-01`）\n- [ ] 三维问题**分解到两个正交平面**，不要硬推三维方程（`A-03`）\n- [ ] 坐标变换写成独立函数（`euler2dcm()` / `dcm_transform()`），不散落在主程序（`A-03`）\n- [ ] PP/TPN 的**指令方向**已显式标注（三本书存在命名矛盾，以方向而非缩写为准）（`A-01`）\n\n## 阶段 2：制导律设计\n\n- [ ] $N$ 按**回路延迟**选型：0 ms→3.5~4.0；50 ms→3.0~3.5；100 ms→2.8~3.2；200 ms→2.5~3.0（`A-02`）\n- [ ] PP N 与 TPN 的 $N$ 未混用（PPN 需 6~10，TPN 3~5）（`A-01`）\n- [ ] $N$ 已限幅在 $[3,10]$；$t_{go}$ 很大时增益负值已强制置 3（`B-02`）\n- [ ] 若用变导航比：时间常数 0.2~0.5 s，**无阶跃切换**，自适应增益 $K$ 不过大（`A-02`）\n- [ ] 若用 APN：估计误差 <30% 才启用，>50% 退化为 PN；估计延迟 <0.2 s（`A-05`, `B-03`）\n- [ ] 若用 APN：**有置信度门限与退化路径**（不加门限是常见翻车点）（`A-05`）\n- [ ] 目标高频机动（~2 Hz）场景已确认 APN 是否反而更差（`A-05`）\n- [ ] 若带终端角约束：最优 $N$ 已按终端角重新标定（`C` 域）\n\n## 阶段 3：状态估计\n\n- [ ] ⚠️ **$\\dot\\lambda$ 没有用直接差分**——已滤波或卡尔曼估计（`A-01`：差分使指令\"抖得像筛子\"）\n- [ ] $\\dot\\lambda$ 滤波器时间常数已扫描（本工况最优 ≈20 ms，不是越小越好）（仿真标定）\n- [ ] 导引头模型用**测角噪声 + 滤波微分**，而非在 $\\dot\\lambda$ 上直接叠噪声（后者会得出反向结论）（仿真标定）\n- [ ] 目标机动模型已按机动强度选型（CV/CA → Singer → 当前统计 → IMM）（`B-03`）\n- [ ] Singer $\\alpha$ 按目标类型取值：客机 0.1~0.5 / 战斗机 0.5~2.0 / 规避导弹 2.0~10.0（`B-03`）\n- [ ] 卡尔曼调参顺序 **先 R → 后 Q → 再 $P_0$**，$P_0\\approx10R$（`A-05`）\n- [ ] 机动检测阈值不过严（建议 99.5%），未导致滤波器频繁重置（`B-03`）\n- [ ] 若用 IMM：模型集覆盖实际机动模式，且转移概率已标定（`B-03`）\n\n## 阶段 4：最优控制（LQR / OGL）\n\n- [ ] $Q,R$ 初值按 **Bryson 规则**设定，量级可比（`B-02`）\n- [ ] $Q_{22}\\approx10\\,Q_{11}$（角速率权重大于角度权重）（`B-02`）\n- [ ] $R$ **不是零矩阵**（$R$ 正定是控制有界的关键）（`B-02`）\n- [ ] 有限时域用**瞬态解**（Riccati 从 $t_f$ 反向积分），非稳态解（`B-02`）\n- [ ] $P$ 矩阵特征值全正（不正定 → 反馈律发散）（`B-02`）\n- [ ] $S$ 在 $10\\sim100R$，**未盲目取大**（过大使末端控制量剧烈抖动）（`B-02`）\n- [ ] $t_{go}$ 已限幅 $[0.1,10]$ s + 一阶低通（$\\tau\\approx0.05$ s）（`B-02`）\n- [ ] \"冻结系数\"近似已通过仿真验证（`B-02`）\n- [ ] 在线算力评估过：不够则离线增益表 + 在线插值（`B-02`）\n\n## 阶段 5：仿真实现\n\n- [ ] **LOS 角速率符号正确**：$\\dot\\lambda = (r_y V_{rel,x} - r_x V_{rel,y})/r^2$（符号反 → 导弹被推开）\n- [ ] **初速按碰撞三角设定**（否则理想工况也有 0.5 m 级假脱靶）\n- [ ] 有 `miss_event` 终止条件（否则 $N=2$ 会爆步数）\n- [ ] **目标机动已进入目标运动学**（常见 bug：机动只喂给 APN 补偿项，目标仍在直飞）\n- [ ] 框架角按 $|\\lambda-\\gamma_M|$ 定义，且**只在 $r>150$ m 的制导段统计**（末端尖峰无物理意义）\n- [ ] 舵机延迟用解析离散解 $a(t+dt)=a_{cmd}+(a(t)-a_{cmd})e^{-dt/\\tau}$\n- [ ] **场景有鉴别力**：已确认\"改变参数时指标会动\"（否则所有工况都是 0.000 m 的假成功）\n- [ ] 噪声用 AR(1) 有色噪声（$\\phi=e^{-dt/\\tau}$），统计特性与 $dt$ 无关\n- [ ] 数值变量已归一化 / 缩放（位置与协态量级悬殊时必做）（`B-04`）\n\n## 阶段 6：蒙特卡洛与验收\n\n- [ ] 蒙特卡洛 **≥500~1000 次**，覆盖边界工况（`B-05`）\n- [ ] 同时报告 **均值 / RMS / P95 / CEP**，不只看均值\n- [ ] 脱靶量 <1 m 优秀 / 1~3 m 良好 / 3~5 m 及格（`B-05`）\n- [ ] 鲁棒性 $\\sigma/\\mu$ <0.3 优秀 / 0.3~0.5 良好 / >0.5 需改进（`B-05`）\n- [ ] 带干扰脱靶均值 ≤ 理想值 2 倍；>3 倍必须回炉（`B-05`）\n- [ ] **过载未超限**（脱靶达标但过载超限 = 方案不可行）\n- [ ] 框架角未超视场、末段未失锁\n- [ ] 延迟扫描已做（判据 $N\\tau/t_{go}\\to1$ 的失稳门槛已定位）\n\n## 阶段 7：工程落地\n\n- [ ] ⚠️ **\"仿真完美、实物抖动\"类问题已排查**：过载裕度 / $S$ 过大 / 延迟未建模（三项高频根因）\n- [ ] 定点化采用**混合精度**：大范围量浮点，姿态角/制导系数 Q15（`B-05`）\n- [ ] 融合架构**首次从串行入手**（`A-06`）\n- [ ] 若用模糊：规则表 ≤5×5，前期先模糊验证、后期再上网络（`A-06`）\n- [ ] 若用 MPC：预测时域 10~20 步、硬约束加松弛、算力已实测（`A-06`）\n- [ ] 若协同：通信时延 ≤控制周期 1/5；一致性有参考节点拉到正确值（`B-06`）\n- [ ] 任务分配含\"覆盖度\"约束 + \"切换代价\"惩罚（`B-06`）\n- [ ] 半实物（HIL）验证已做——仿真扫参只是中间步（`A-02` 三步定 N 的第三步）\n\n---\n\n## 速查：仿真结论与教科书矛盾时的三步诊断\n\n1. **独立复算**——另写一份最简实现（如显式欧拉）对拍，确认量级无误，排除代码错。\n2. **查场景鉴别力**——若所有工况结果恒等（如脱靶全为 0.000 m），是场景太容易，不是代码问题。\n3. **查模型简化**——若趋势与教科书相反，先怀疑被省略的环节（如\"N 放大噪声\"的真正来源是角度噪声经微分变蓝谱；直接在 $\\dot\\lambda$ 上叠平谱噪声会得出相反结论）。\n\n> 本清单第 5、6 阶段的加粗项，均来自 book010 仿真脚本 v3 的实测教训（原缺陷：理想工况假脱靶 0.51 m、框架角 175°、目标未真正机动）。\n", "size": 6763}, {"path": "assets/data/formulas.csv", "kind": "md", "text": "| fid | domain | domain_name | card | card_title | idx | latex |\n|---|---|---|---|---|---|---|\n| F-A-01-01 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 1 | a_m = N \\cdot V_c \\cdot \\dot\\lambda |\n| F-A-01-02 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 2 | \\eta = \\theta_m - \\lambda |\n| F-A-01-03 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 3 | \\dot\\lambda = \\frac{\\mathbf{R} \\times \\mathbf{V}_{rel}}{\\|\\mathbf{R}\\|^2},\\qquad \\dot\\lambda = \\frac{V_t\\sin\\theta_t - V_m\\sin\\theta_m}{R} |\n| F-A-02-01 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 1 | \\dot V = (2-N)\\frac{V_c}{R}\\dot\\lambda^2 + \\frac{\\dot\\lambda \\, a_t}{R} |\n| F-A-02-02 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 2 | a_m^* = \\frac{3}{t_{go}^2}y + \\frac{3}{t_{go}}v_y \\;\\xrightarrow{\\;y\\approx0\\;}\\; a_m^* \\approx \\frac{3}{t_{go}}v_y = 3V_c\\dot\\lambda \\;\\Rightarrow\\; N_{opt}=3 |\n| F-A-02-03 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 3 | N(R) = N_0 + (N_f-N_0)\\left(1-\\frac{R}{R_0}\\right) |\n| F-A-02-04 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 4 | N(\\dot\\lambda) = N_{min} + (N_{max}-N_{min})\\tanh\\left(k\\|\\dot\\lambda\\|\\right),\\quad k=10\\sim20 |\n| F-A-02-05 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取 目标做大机动时导弹过载饱和、脱靶量很大，换成 TPN 并加限幅后明显改善。B3 第4章补充：PPN 在近距格斗弹项目里遇到目标 7g 转弯直接跟丢，**PPN 更适合迎头攻击或目标机动不大的场景**。 |\n| H002 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 2 | PPN 和 TPN 不能随意互换 | **PPN 和 TPN 不能随意互换**。有项目直接把 TPN 公式套到大气层内导弹上，仿真发现导弹根本转不过弯——因为 TPN 的加速度方向与速度方向不一致，实际产生的过载与指令不匹配。 |\n| H003 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 3 | TPN 与 PPN 的导航比 $N$ 物理意义不同 | **TPN 与 PPN 的导航比 $N$ 物理意义不同**：TPN 的 $N$ 通常取 $3\\sim5$，而 PPN 的 $N$ 可能需要取到 $6\\sim10$ 才能达到类似效果。作者曾直接拿 TPN 理论结果套 PPN 工程实现，脱靶量大了好几倍。 |\n| H004 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 4 | 符号/命名混用警告 | **符号/命名混用警告**：三本书中 PPN/TPN 的\"指令垂直于谁\"存在一处表述不一致（B4 第4章正文与第5章表格矛盾）。建议建模时以\"指令方向\"而非\"缩写名\"为准，并在模型里显式标注。 |\n| H005 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 5 | $\\dot\\lambda$ 绝不能直接差分 | **$\\dot\\lambda$ 绝不能直接差分**。作者用差分取 $\\dot\\lambda$，噪声放大好几倍、指令抖得像筛子，改用卡尔曼滤波估计后立竿见影。 |\n| H006 | A | 比例导引 PN | A-01 | 比例导引基本原理与纯/真比例导引（PPN vs TPN） | 6 | 初选 $N=4$ | **初选 $N=4$**（作者个人习惯）：$N=3$ 弹道太弯、末端易大过载；$N=5$ 初始段过载太大、对舵机要求高；$N=4$ 折中，弹道平直且过载分布均匀。 |\n| H007 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 1 | \"我一般从 N=3 开始试。如果弹道过载太大，就降到 N=2.5；如果脱靶量… | 作者的调参口诀与数据：  **\"我一般从 N=3 开始试。如果弹道过载太大，就降到 N=2.5；如果脱靶量偏大，就升到 N=4。没有绝对最优值，得根据具体场景调。\"**（B1 第3章） |\n| H008 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 2 | 边际效应递减的实测数据 | **边际效应递减的实测数据**（B3 第3章）：$N=2$→脱靶 8.5 m/过载 3.2 g；$N=3$→3.1 m/5.8 g；$N=4$→1.2 m/9.6 g；$N=5$→0.8 m/14.3 g。从 4 升到 5，脱靶量几乎没改善，过载需求却翻了一倍多。 |\n| H009 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 3 | 按弹种选 | **按弹种选**（B2 第14章）：空空格斗 $3.5\\sim4.5$；地空中远程 $3.0\\sim4.0$；反坦克 $2.5\\sim3.5$（作者把 $N$ 从 3.5 降到 3.0，脱靶量反而从 0.8 m 降到 0.3 m）；高超声速 $2.0\\sim3.0$。 |\n| H010 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 4 | 按回路延迟选 | **按回路延迟选**（B2 第14章）：延迟 0 ms→理论最优 3.0/推荐 3.5~4.0；50 ms→2.8/3.0~3.5；100 ms→2.5/2.8~3.2；200 ms→2.2/2.5~3.0。**延迟越大，$N$ 必须往小调**。不确定延迟就取 $N=3.0$ 这个\"万金油\"。 |\n| H011 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 5 | 避坑：N 与硬件能力必须匹配 | **避坑：N 与硬件能力必须匹配**。作者为追求快速响应把 $N$ 设到 5.5，叠加约 80 ms 舵机延迟后末端出现明显过载振荡，脱靶量比 $N=4.0$ 时**大了 3 倍**。 |\n| H012 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 6 | 避坑：变导航比不要阶跃切换 | **避坑：变导航比不要阶跃切换**。阶跃会让指令加速度跳变、弹体剧烈抖动，必须连续变化；自适应律增益 $K$ 设太大会让系统震荡、脱靶量反而更差。变增益的时间常数一般取 0.2~0.5 s。 |\n| H013 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 7 | 三步定 $N$ | **三步定 $N$**（B2 第14章）：理论计算定范围 → 仿真扫选定初值 → 半实物验证定终值。作者习惯先取 $N=3.5$，用蒙特卡洛扫 $2.5\\sim5.0$ 看脱靶量趋势。 |\n| H014 | A | 比例导引 PN | A-02 | 导航比 N 的影响规律与选取准则 | 8 | 避坑：只做线性化分析就定参数会翻车 | **避坑：只做线性化分析就定参数会翻车**。作者曾只做线性化就匆匆定参，外场试验时目标一个大过载机动直接脱靶，后来补了 200 次蒙特卡洛才调好。 |\n| H015 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 1 | 所有测量值先转到惯性系，再做制导律计算 | 作者列的避坑清单（三本书高度一致，说明是高频翻车点）：  **所有测量值先转到惯性系，再做制导律计算**。作者曾直接用导引头输出的视线角速率做制导律计算、没做坐标系转换，结果导弹转弯时指令完全反了。这个习惯\"救了我好几次\"。 |\n| H016 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 2 | 导引头输出的是视线系角速度，飞控要的是弹体系角速度 | **导引头输出的是视线系角速度，飞控要的是弹体系角速度**。作者在某项目直接把导引头角速度当指令用，导弹末端剧烈振荡差点脱靶——\"差一个变换，结果天差地别\"。 |\n| H017 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 3 | 旋转顺序必须写清楚 | **旋转顺序必须写清楚**。不同领域约定不同（航空航天常用 3-2-1，有些教材用 1-2-3），做之前先画草图标注顺序。作者第一次写 6DOF 仿真就栽在坐标变换上，弹道直接往反方向跑。 |\n| H018 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 4 | 俯仰 90° 时欧拉角奇异 | **俯仰 90° 时欧拉角奇异**。作者某项目因欧拉角在大角度机动时奇异导致仿真崩溃，\"从那以后，我但凡涉及大角度机动，一律用四元数\"。 |\n| H019 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 5 | 角度单位 | **角度单位**：作者曾在仿真里把度当弧度算，弹道飞到天上去了。numpy 三角函数默认弧度。 |\n| H020 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 6 | $V_c = -\\dot R$ 的符号 | **$V_c = -\\dot R$ 的符号**：作者做末制导仿真时把 $V_c$ 符号搞反，排查三天。\"我建议你写代码时专门加个注释，不然半年后自己都忘了\"。 |\n| H021 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 7 | 视线角速率不能直接用差分，必须平滑滤波 | **视线角速率不能直接用差分，必须平滑滤波**。作者曾因视线角速率滤波参数设错导致脱靶量总是偏大。 |\n| H022 | A | 比例导引 PN | A-03 | 相对运动学与坐标系建模 | 8 | 工程化建议 | **工程化建议**：把坐标变换写成独立函数（如 `euler2dcm()`、`dcm_transform()`），主程序只调用；三维情况不要硬推，把三维运动**分解到两个正交平面**、每平面单独用二维方程处理，简单可靠。 |\n| H023 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 1 | 不要迷信 ZEM 的绝对值，看趋势 | **不要迷信 ZEM 的绝对值，看趋势**。ZEM 持续减小说明制导律在工作；突然增大就要警惕目标机动或传感器故障。作者对 ZEM 波动大的处理是加截止频率约 5 Hz 的低通滤波器。 |\n| H024 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 2 | 末端四约束要联合优化，不要单独处理 | **末端四约束要联合优化，不要单独处理**：段划分（过渡/调整/攻击）、过载约束、视场角约束、能量管理。过载约束会影响能量管理，视场角约束会影响段划分。 |\n| H025 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 3 | 限幅要\"双限\" | **限幅要\"双限\"**——幅值限 + 速率限。作者只做幅值限没做速率限，末端大机动时指令变化太快、舵机响应不过来，脱靶量直接翻倍。 |\n| H026 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 4 | 限幅保留 20% 裕度 | **限幅保留 20% 裕度**（作者甚至建议留 30%）。某项目按 80% 可用过载设计，靶试时目标突然大机动，过载需求瞬间冲到 85%。\"千万不要在末端把过载用到极限\"。 |\n| H027 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 5 | 抗饱和三层次 | **抗饱和三层次**：① 指令限幅（软限幅 $u_{sat}=u_{max}\\tanh(u/u_{max})$ 优于硬限幅；动态限幅作者最推荐）→ ② 抗饱和制导律（条件积分法简单可靠；反计算法更平滑，$K_{aw}=1/K_i$）→ ③ 动态补偿（某飞行试验中饱和次数减少 60%，脱靶量 5 m→1.2 m）。 |\n| H028 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 6 | 有色噪声不能用高斯白噪声建模 | **有色噪声不能用高斯白噪声建模**。作者某项目仿真精度很好、实际打靶脱靶量很大，查出是导引头噪声建错——仿真用高斯白噪声，实际是有色噪声、低频分量很大。建议用一阶马尔可夫过程建模。\"从那以后，我坚持用实测噪声数据建模\"。 |\n| H029 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 7 | 蒙特卡洛：至少 1000 次，先跑 500 次看趋势；关键是看 95% 分位… | **蒙特卡洛：至少 1000 次，先跑 500 次看趋势；关键是看 95% 分位数而不是均值**。作者接手的项目里，前任只报告平均脱靶量 3.2 m，实弹测试有一发脱靶 28 m，重做分析发现 95% 分位数达 22 m。 |\n| H030 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 8 | 仿真步长 | **仿真步长**：末端用变步长（RK45）积分器。作者用固定步长 0.01 s 算出脱靶 0.8 m，换变步长后实际只有 0.3 m，差近三倍。仿真时间要**多算 0.5~1 s**，因为脱靶量最小值往往出现在理论交会点之后一点。 |\n| H031 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 9 | 综合案例结论 | **综合案例结论**（B3 第30章，3 马赫俯冲目标拦截）：方案 A($N$=3, 常数 $K$=1.0)→1.24 m/18.5 g；B($N$=4.2, $K$=1.2)→0.67 m/22.1 g；C($N$=4.2, 分段增益)→0.31 m/23.8 g；D($N$=5, 分段+限幅)→0.28 m/25.0 g。**工程上选 C 而非 D**，因为 D 的过载已顶到 25 g 极限、要留余量。分段增益的切换点**用剩余飞行时间而非固定距离**。 |\n| H032 | A | 比例导引 PN | A-04 | 脱靶量分析与精度优化技巧 | 10 | 避坑：加末端修正项前一定要做频域分析 | **避坑：加末端修正项前一定要做频域分析**。作者在方案 D 上叠加末端修正项，脱靶量反而变大——修正项与比例导引项时间常数不匹配，产生了耦合振荡。 |\n| H033 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 1 | APN 的性能上限取决于目标加速度估计精度 | **APN 的性能上限取决于目标加速度估计精度**。某近程防空弹实测：PPN 脱靶 2.8 m → APN 1.2 m（提升 57%），最大需用过载 18 g→14 g，拦截概率 78%→91%，指令震荡 ±3.5 g→±1.8 g。但故意把滤波器调偏后，脱靶量直接飙到 4 m 以上——\"补偿项给错了方向，相当于帮倒忙\"。 |\n| H034 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 2 | 收敛性对估计误差极敏感 | **收敛性对估计误差极敏感**：作者仿真中估计误差超过 **50%~60%** 时，APNG 的脱靶量反而比 PNG 还大。工程上必须加**置信度门限**——估计值低于阈值时退化为 PN。 |\n| H035 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 3 | $N'$ 要比 PNG 更保守 | **$N'$ 要比 PNG 更保守**（B2 第7章）：常规机动目标 $3\\sim4$；高机动目标降到 $2.5\\sim3$（避免过补偿）；有测量噪声时不超过 4。**APNG 不是 $N'$ 越大越好**。 |\n| H036 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 4 | 避坑：$N'$ 与估计延迟的耦合 | **避坑：$N'$ 与估计延迟的耦合**。作者把 $N'$ 设成 5、目标加速度估计又有延迟，导弹末端疯狂抖动；降到 3.2 并给估计加低通滤波后解决。 |\n| H037 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 5 | 估计延迟 > 0.1 s 补偿效果急剧下降 | **估计延迟 > 0.1 s 补偿效果急剧下降**。作者吃过亏——估计延迟 0.2 s，补偿后脱靶量比不补偿还大，后来加了 Smith 预估器。对策：加超前校正网络，或用预测值。 |\n| H038 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 6 | 滤波器选型的工程折中 | **滤波器选型的工程折中**（B3 第4/5章）：滤波器估计准但延迟大；目标机动频率高时改用**运动模型假设法**（如假设匀速圆周运动直接算），虽然粗糙但响应快。作者某项目滤波器延迟导致过冲，换模型假设法后脱靶量 8 m→1.5 m。 |\n| H039 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 7 | 目标机动模型选错，后面全白费 | **目标机动模型选错，后面全白费**（B3 第5章 / B4 第13章）：用 Singer 模型跟踪 9G 转弯的战斗机会滤波发散，必须换\"当前\"统计模型；某半实物仿真从一阶马尔可夫换成 Singer，脱靶量 十几米→3 米以内。算力允许优先上 IMM。 |\n| H040 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 8 | Q 矩阵调参坑 | **Q 矩阵调参坑**：作者把 Q 对角元设成 0.01，目标一拉机动估计值滞后 0.3 秒；后来自适应 Q 才解决。调参顺序建议\"**先 R 后 Q 再 P₀**\"，$P_0$ 设成 R 的约 10 倍。 |\n| H041 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 9 | 补偿项不是越多越好 | **补偿项不是越多越好**：估计不准的补偿不如不加。作者建议做\"**开关对比**\"——同场景开/关补偿各跑一次，差异大就加、差异小就别加。 |\n| H042 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 10 | APNG 的适用边界 | **APNG 的适用边界**：目标做**高频机动**（正弦 2 Hz）时 APNG 脱靶量反而比 PNG 大；APNG 对测量噪声比 PNG 更敏感。作者建议路径：目标机动性弱→直接用 PNG；机动强且估计可靠→APNG；信息不可靠→自适应 APNG 或切换制导律。**别一上来就上 APNG，容易翻车**。 |\n| H043 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 11 | AUGPNG 调试技巧 | **AUGPNG 调试技巧**：先在仿真中把 $a_M$ 设为零，验证能否退化成 APNG，一致说明实现没问题，再逐步加入真实 $a_M$。$a_M$ 由 INS 估算，噪声大需低通滤波，但滤波引入延迟，需权衡。 |\n| H044 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 12 | 增广 APN 的末端处理 | **增广 APN 的末端处理**：$a_{cmd}=NV_c\\dot\\lambda + \\frac{N}{2}a_T f(t_{go})$，作者习惯在末制导最后 0.5 s 把 $f(t_{go})$ 设成 0——此时舵面效率下降，给再大指令也执行不了，反而引起振荡。 |\n| H045 | A | 比例导引 PN | A-05 | 扩展/增广比例导引（APN/AUGPNG）与机动目标 | 13 | 组合使用 | **组合使用**：作者经常把 APN 与 BPN 组合——先用偏置项控制弹道形状（某项目实现 68° 擦地角，指标 70°），再用 APN 补偿目标机动，\"效果出奇的好\"。 |\n| H046 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 1 | 融合的实测收益 | **融合的实测收益**（B4 第15章，5g 机动）：纯 PN 平均 3.2 m/最大 8.7 m；纯预测 1.8 m/4.5 m；**融合 0.6 m/1.2 m**。末端最大过载需求 12 g→7.5 g，**降低近 40%**。硬件在环中故意设置未建模机动模式：纯预测 12 m，融合仅 2.3 m。 |\n| H047 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 2 | 架构选型三问 | **架构选型三问**（B4 第16章）：目标机动性强不强？算力够不够？任务分不分阶段？串行（误差累积、单点失效、但最稳）/ 并行（响应快、互为备份、但融合决策难）/ 混合（性能最优、但设计与验证复杂度高）。作者建议：**第一次做融合先从串行入手**。 |\n| H048 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 3 | 并行融合必踩的坑 | **并行融合必踩的坑**：两个模块更新频率不一致会导致加权后指令高频抖动，必须**强制两模块同步采样**。 |\n| H049 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 4 | 切换融合三状态 | **切换融合三状态** PN_ONLY / TRANSITION / PG_ONLY。阈值必须加**滞回**：$t_{go}$ 进入 3~5 s、退出 4~6 s（退出比进入大 1~2 s）；$\\hat a_T$ 进入 3~5 g、退出 2~4 g（退出比进入小 1~2 g）。不加滞回会来回震荡。 |\n| H050 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 5 | 过渡区时长别太短 | **过渡区时长别太短**：作者设 0.5 s 时指令跳变依然很大，改成 **1.5 s** 后效果好很多，具体值按导弹响应带宽定。三种平滑手段：加权融合法（主策略）+ 一阶低通滤波（$\\alpha=0.1\\sim0.3$，辅助）+ 三次样条/S 曲线软切换。 |\n| H051 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 6 | 模糊 vs 神经网络权重分配 | **模糊 vs 神经网络权重分配**：作者建议**前期先用模糊逻辑快速验证，后期性能瓶颈明显再换神经网络**，\"别一上来就上网络，调参能调到你怀疑人生\"。模糊规则表别贪多，**5×5 足够**（试过 9×9 反而规则冲突、输出不稳定）。神经网络：1~2 隐藏层、每层 8~16 神经元、ReLU，输出 sigmoid 输出 $w_{pred}$；坑是**训练数据不平衡**——仿真里 90% 匀速直线，网络学出来几乎永远输出 0.1。 |\n| H052 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 7 | 权重必须加低通或限制变化率 | **权重必须加低通或限制变化率**：作者遇到 $w_{pred}$ 从 0.8 瞬间跳到 0.2，制导指令跟着剧烈抖动。 |\n| H053 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 8 | MPC 框架实测 | **MPC 框架实测**（目标 5g 蛇形、初速 2 马赫）：纯 PN 脱靶 2.3 m / 最大过载 12.5 g（超限）/ 计算 0.1 ms；MPC 统一框架 0.8 m / 8.0 g（满足约束）/ 能耗 -15% / 计算 3.2 ms。工程要点：预测时域取 **10~20 步**；先调 Q 再调 R；硬约束要加松弛变量（作者曾把约束设太硬导致求解器经常找不到可行解）；用**热启动**（上一解时域平移作初猜）后通常 3~5 次迭代收敛。 |\n| H054 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 9 | 6DOF 仿真 | **6DOF 仿真**：步长先取 **0.001 s**；必须用 **RK4**（欧拉法在转动方程有陀螺项时容易发散）；**$\\boldsymbol\\omega\\times(\\mathbf{I}\\boldsymbol\\omega)$ 陀螺耦合项不能忽略**——作者因忽略它导致滚转通道发散；气动数据拿到后**先画曲线看趋势**（曾发现攻角 30° 以上升力系数跳变是风洞支架干扰）。 |\n| H055 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 10 | 工程实现三条路的选型 | **工程实现三条路的选型**：控制周期 <10 μs → FPGA（作者用 Artix-7 把 5 μs 周期跑通，18 位定点 Q10、三级流水）；10~100 μs → DSP（TMS320F28335，50 μs 周期，Q15/Q31，**导引律计算必须放最高优先级中断**——作者曾把通信中断优先级设高导致弹道发散）；>1 ms 且需多任务 → 嵌入式（STM32H743 + FreeRTOS，1 ms 任务，**禁止动态内存分配**）。滤波器设计比导引律本身更关键，作者一般用二阶巴特沃斯、截止频率取导引带宽的 3~5 倍；FPGA 必须做 `create_clock` 时序约束。 |\n| H056 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 11 | HIL 三层架构 | **HIL 三层架构**（实时仿真层 / 接口层 / 监控层）：**仿真步长至少是控制周期的 1/5**（控制周期 1 ms → 仿真步长 ≤0.2 ms）。作者因仿真层与接口层延迟没处理好、指令晚一个采样周期到达，脱靶量从 0.5 m 飙到 3 m。 |\n| H057 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 12 | 验证顺序不能跳 | **验证顺序不能跳**：数学仿真 → 软件在环 → 半实物 → 飞行试验。作者曾因赶进度跳过半实物直接上靶试，制导指令在弹载计算机上延迟 20 ms 导致脱靶——\"仿真可以骗人，但实物不会\"。 |\n| H058 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 13 | 工程化四类挑战要分层防护 | **工程化四类挑战要分层防护**（B4 第27章）：底层做滤波与信号处理（噪声/丢帧）；中层让制导律本身鲁棒（参数变化/饱和）；上层做模式管理与故障诊断。丢帧处理：外推预测 / 保持上次值 / 多源融合；作者习惯加\"丢帧计数器\"，连续丢 3 帧就切换制导模式。 |\n| H059 | A | 比例导引 PN | A-06 | 比例导引与预测制导融合、弹道仿真与工程实现 | 14 | 避坑：不要为了炫技选混合架构 | **避坑：不要为了炫技选混合架构**。作者见过一个项目串行就能满足指标，非要上混合，结果开发周期翻倍还出不少 bug——\"简单就是美\"。 |\n| H060 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 1 | 变分法处理不了不等式约束 | **变分法处理不了不等式约束**（C3 第1章）。作者用变分法直接解一个带饱和约束的制导问题，\"仿真时控制量一直超出限幅\"。**只要控制有界，就必须上庞特里亚金**。 |\n| H061 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 2 | \"性能指标是设计者的价值观\" | **\"性能指标是设计者的价值观\"**（C2 第5章）。作者做某型空地弹末制导时只优化脱靶量，\"指令曲线像锯齿一样，舵机根本跟不上\"，在指标里**加一项控制能量惩罚**后才平滑。 |\n| H062 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 3 | 权重从 1:1 起调 | **权重从 1:1 起调**（C1 第4章）。作者曾把控制能量权重设得太高，导弹全程\"舍不得\"机动、脱靶量很大，**调低一个数量级后效果立竿见影**。 |\n| H063 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 4 | 别忽略 $L$ 是否显含 $t$ | **别忽略 $L$ 是否显含 $t$**（C1 第2章）。作者做轨迹优化直接套欧拉-拉格朗日方程结果轨迹全错，排查半天才发现这点。若 $L$ 不显含 $t$，存在**首次积分（能量积分）**，用起来更方便。 |\n| H064 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 5 | 横截条件不要死记硬背 | **横截条件不要死记硬背**（C1 第2章），一定要从变分原理现推，\"我见过太多人把横截条件用错，算出来的'最优解'根本不对\"。它还是处理**软约束**的利器——作者做再入制导时终点要求落在某高度范围而非精确高度值，就用横截条件处理。 |\n| H065 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 6 | 工程上作者很少直接解欧拉-拉格朗日方程 | **工程上作者很少直接解欧拉-拉格朗日方程**，而是\"**先写出哈密顿函数，再用极小值原理推最优控制律**\"——思路清晰且易处理控制约束。写代码时**务必先写 $H$ 再写协态方程**，很多人搞反顺序导致符号错误、仿真发散（C3 第1章）。 |\n| H066 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 7 | 建模四问 checklist | **建模四问 checklist**（C1 第4章）：系统怎么动？什么算好？终点要什么？路上不能碰什么？作者强调\"建模花的时间往往比求解还多\"，并吃过亏——相对运动方程简化太狠，二维仿真弹道很美，一上六自由度就崩。 |\n| H067 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 8 | 过程约束不是摆设 | **过程约束不是摆设**（C1 第4章）。作者忽略导引头视场角约束 $\\|λ-θ_M\\| \\le \\beta_{max}$，仿真出的最优弹道末端要大角度转弯，\"导引头直接丢失目标\"。 |\n| H068 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 9 | 终端约束越多越难求 | **终端约束越多越难求**（C1 第4章）。\"有时候你加一个终端角度约束，可能就找不到解析解了，只能上数值方法\"，建议从零脱靶量起步逐步加约束。 |\n| H069 | B | 最优制导 | B-01 | 最优制导的数学基础 — 变分法、极小值原理与性能指标设计 | 10 | 入门路径建议 PMP 优先 | **入门路径建议 PMP 优先**（C3 第1章）：\"变分法太理想化，HJB 又太难算，PMP 是性价比最高的。\"作者自己的流程是：用动态规划理解问题结构 → 用 PMP 写必要条件 → 用数值方法求解。 |\n| H070 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 1 | $R$ 绝不能设成零矩阵 | **$R$ 绝不能设成零矩阵**（C1 第3章）。有人这么干，\"控制量疯狂震荡，系统根本稳不住\"——因为 $R$ 正定是控制有界的关键，\"如果控制不要钱，最优解就是瞬间把状态拉到零\"。 |\n| H071 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 2 | 慎用稳态解 | **慎用稳态解**（C1 第3章）。作者直接用了稳态解，\"系统在初始阶段震荡得很厉害\"——稳态解只保证无限时间最优，对瞬态有要求就得用瞬态解或加预补偿。 |\n| H072 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 3 | Bryson 规则做初值 | **Bryson 规则做初值**（C1 第3章 / C2 第6章）：保证各状态与控制量在量级上可比，避免数值问题。作者另一处的经验是\"$Q$ 的对角元取状态量最大允许偏差的倒数平方，$R$ 取控制量最大允许值的倒数平方\"。 |\n| H073 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 4 | $Q_{22}$（角速率权重）比 $Q_{11}$（角度权重）大一个数量级 | **$Q_{22}$（角速率权重）比 $Q_{11}$（角度权重）大一个数量级**（C1 第6章 / C4 第4章）。因为脱靶量主要由角速率决定。C1 第6章作者\"试过反着设，结果弹道抖得像蛇一样\"。C4 第4章实测配置 $Q=\\mathrm{diag}([1,100])$、$R=10$ → 脱靶 <0.5 m、最大过载 <8 g。 |\n| H074 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 5 | Riccati 必须反向积分 | **Riccati 必须反向积分**（C1 第6章）：\"别用正向积分，从终端时刻往初始时刻推，数值稳定性好很多。\" |\n| H075 | B | 最优制导 | B-02 | LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取 | 6 | $P$ 矩阵特征值必须全正 | **$P$ 间一致性与任务分配 | 21 | 能量最优追求的是\"均衡\"而非\"最小化\" | **能量最优追求的是\"均衡\"而非\"最小化\"**（C4 第25章）。作者一开始用\"总燃料最小\"作目标，\"有一枚导弹为了省油飞了个大圆弧，到达时间严重滞后\"。改用 $\\min\\max J_i$ 后，六弹仿真**燃料消耗方差从 0.15 降到 0.03**；四弹仿真到达时间差 <0.4 s、燃料消耗最大差仅 0.8 kg。三个坑：忽略气动参数随高度变化（用地面数据做高空段，燃料预测偏差 15%）；**过度追求均衡导致整体到达延迟 8 秒**（\"均衡是手段，不是目的\"）；**末端要留 5%~10% 燃料余量**。 |\n| H153 | B | 最优制导 | B-06 | 多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配 | 22 | 机动目标协同时，仿真里的目标机动上限要提高 30% | **机动目标协同时，仿真里的目标机动上限要提高 30%**（C4 第16章）；机动场景必须覆盖匀速直线/匀速转弯/蛇形/突然跃起四种。 |\n| H154 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 1 | 视场约束必须当硬约束，没有商量余地 | **视场约束必须当硬约束，没有商量余地**（C1 第1章）。作者见过一个项目把它当软约束，外场试验时导弹末端因视场超限导致制导指令反转，直接飞向相反方向。 |\n| H155 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 2 | 画「视场裕度—时间」曲线 | **画「视场裕度—时间」曲线**（作者的个人习惯）：末端裕度低于 **3°** 就重新审视制导律参数或导引头安装方案，\"这个习惯帮我避免了好几次设计返工\"。 |\n| H156 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 3 | 仿真里的视场角要缩小 10%~15% | **仿真里的视场角要缩小 10%~15%**（C1 第25章）：标称 ±30° 的导引头，仿真里只用 ±26°。因为探测器边缘像元信噪比低、光学边缘畸变、信号处理有延迟，\"仿真里在视场内的目标，实际可能已经无法稳定跟踪\"。 |\n| H157 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 4 | 留 3°~5° 的安装/遮挡余量 | **留 3°~5° 的安装/遮挡余量**（C1 第25章）。作者一次外场试验丢失目标，查了半天是弹体结构（头罩、天线、支架）在某些姿态角下遮挡了视场。对策：做三维 CAD 逐角度检查遮挡 + 半实物仿真加入遮挡模型。 |\n| H158 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 5 | 视场安全裕度留给弹体扰动 | **视场安全裕度留给弹体扰动**（C1 第25章）：视场 ±30° 但制导律只用到 ±25°，剩下 5° 留给弹体振动、气动弹性、推力偏心——导引头稳定平台的隔离度不是 100%。 |\n| H159 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 6 | 锥体判断要归一化 | **锥体判断要归一化**：把目标位置转到导引头系再归一到单位球面，\"当目标很近时 $\\\\|\\mathbf{t}\\\\|$ 很小，不等式两边都接近 0，容易产生误判\"。 |\n| H160 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 7 | 阈值别用 $\\cos\\theta_{FOV}$，用 $\\cos(\\theta… | **阈值别用 $\\cos\\theta_{FOV}$，用 $\\cos(\\theta_{FOV}+2^\\circ)$**；代码里的 `SAFE_MARGIN` 作者取 **0.035 rad（约 2°）**，\"太小没效果，太大又太保守\"。 |\n| H161 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 8 | 半实物仿真加时间滞后项 0.05~0.1 s | **半实物仿真加时间滞后项 0.05~0.1 s**（C1 第4章）：伺服系统有响应延迟，目标进了视场也得等框架转过来才能锁定。 |\n| H162 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 9 | 标称 FOV ≠ 有效 FOV | **标称 FOV ≠ 有效 FOV**（C1 第2章）：某型导引头为追大视场把光学设计做得很激进，外场背景辐射太强、目标淹没在噪声里，最后不得不把视场收窄 5°。 |\n| H163 | C | 终端制导 | C-01 | 导引头建模与视场/框架角约束 | 10 | 先估目标最大机动产生的视线角速率，再留 1.5~2 倍余量 | **先估目标最大机动产生的视线角速率，再留 1.5~2 倍余量**（C1 第25章）。作者因没算这个余量，半实物仿真时目标一做大机动就丢，加 **30%** 余量后解决。 |\n| H164 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 1 | $K_{bias}$ 不要超过导航比 $N$ 的 1/3 | **$K_{bias}$ 不要超过导航比 $N$ 的 1/3**（C1 第6章，\"偏置增益不要超过导航比 N 的 1/3，否则容易引起弹道发散\"）。作者曾设得太大导致弹道明显振荡。 |\n| H165 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 2 | 偏置项退出时机 | **偏置项退出时机**：$t_{go}<1$ s 时线性衰减到零，既保末端视场又不影响命中精度。另：一定要对 $a_{bias}$ 做限幅，否则大偏差时指令过载过大。 |\n| H166 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 3 | BPN 是「被动」修正，只适用于框架角缓慢偏离 | **BPN 是「被动」修正，只适用于框架角缓慢偏离**。目标末端突然反向机动时偏置项反应跟不上，框架角仍会超限——\"这时候就需要更高级的方法\"。 |\n| H167 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 4 | 调参小技巧 | **调参小技巧**：先把 $K_{bias}$ 设为零跑一遍纯 PN，看框架角超限多少，再逐步加 $K_{bias}$ 直到满足要求，\"这样调试效率很高，我一直在用\"。有框架角速率反馈时结合使用，某项目框架角峰值又降了约 5°。 |\n| H168 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 5 | 李雅普诺夫增益 $k$ 取 0.5~2 | **李雅普诺夫增益 $k$ 取 0.5~2**（C1 第10章）。作者把 $k$ 设到 10，\"导弹像发了疯一样左右摆动，导引头视场反而更差\"，降到 **1.5** 解决。另外初始视线角别贴边界，留 **3°~5°** 安全余量——$\\lambda_0=29.9^\\circ$ 时 $V$ 极大、控制量直接饱和。 |\n| H169 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 6 | MPC 硬约束改软约束 + 松弛变量 | **MPC 硬约束改软约束 + 松弛变量**（C1 第8章）：作者早期直接把约束加在状态上，\"MPC 求解时经常无解——约束太硬了，优化器直接罢工\"。 |\n| H170 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 7 | MPC 实时性 | **MPC 实时性**：能用 2 阶就别用 4 阶；预测步数 **N=5~10**；用热启动（上时刻解作初值）。某型导弹上把 QP 求解器换成自定义梯度下降法，**计算时间 15 ms → 3 ms**。$Q$ 从 `diag([10,10,1,1])` 起步，采样 5 ms。 |\n| H171 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 8 | 虚拟目标切换必须加滞回 + 最小驻留时间 | **虚拟目标切换必须加滞回 + 最小驻留时间**（C1 第9章）：作者因切换太频繁导致导弹来回摆动脱靶，加了「进入门限≠退出门限」和「每次切换后至少保持 **0.5 s**」。 |\n| H172 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 9 | 切换制导律串一阶低通，时间常数 0.1~0.3 s | **切换制导律串一阶低通，时间常数 0.1~0.3 s**，防指令突变引起弹体抖动。 |\n| H173 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 10 | 视场预测窗口 0.5~1 s | **视场预测窗口 0.5~1 s**（C1 第13章）。作者设到 3 s，\"目标机动方向都变了，预测完全不准\"。补偿系数**不要超过 0.7**，留余量给不确定性；先给 50% 预测偏移量再微调。 |\n| H174 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 11 | 预测模型必须包含导引头伺服特性 | **预测模型必须包含导引头伺服特性**（C1 第7章）：作者 MPC 预测模型里忽略框架动态，\"仿真时预测的视场角总是偏小\"，加一阶惯性环节后才吻合。 |\n| H175 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 12 | 视场分区控制 | **视场分区控制**（C1 第7章，作者在某型导弹的做法）：把 ±30° 分为安全区 0~20°、警戒区 20°~25°、危险区 25°~30°，不同区用不同策略。 |\n| H176 | C | 终端制导 | C-02 | 视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标） | 13 | 方案阶段 N 选 4 以上 | **方案阶段 N 选 4 以上**（C1 第5章）：\"N=3 虽然脱靶量可能更小，但视场丢失风险显著增加\"。采用变导航比（按框架角动态调整 N）后，某型号**视场丢失率从 15% 降到 2% 以下**——这是作者最推荐的措施。 |\n| H177 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 1 | 攻角限制在失速点的 80% 左右 | **攻角限制在失速点的 80% 左右**（C2 第4章）。作者吃过亏：\"某次试验中攻角指令给大了 5 度，导弹直接失速翻滚，最后自毁了\"。某型导弹试验攻角 28° 时弹翼根部出现裂纹，从此把最大攻角限到 **22°**（留 6° 裕度）。 |\n| H178 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 2 | 舵机在最大攻角下至少留 30% 力矩余量 | **舵机在最大攻角下至少留 30% 力矩余量**（C2 第4章）。作者调试某型弹时发现攻角到 15° 后舵面响应变慢，查出是舵机力矩不够，换了更大功率舵机。 |\n| H179 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 3 | 软约束比硬约束鲁棒 | **软约束比硬约束鲁棒**（C2 第9章）：\"我曾经试过硬约束，结果遇到测量噪声时，控制量直接发散——那叫一个惨\"。用终端代价 $S$ 惩罚而非终端等式约束。 |\n| H180 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 4 | $S(3,3)$ 不能贪大 | **$S(3,3)$ 不能贪大**（C2 第9章）：作者为追求末端攻角精度把 $S(3,3)$ 设得特别大，\"仿真时发现导弹在末端突然拉出一个大过载，结构都受不了\"。**加权矩阵选取要综合考虑平台机动能力**。 |\n| H181 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 5 | 调参顺序：先调 $R$ 保证控制量不饱和，再调 $S$ 和 $Q$ | **调参顺序：先调 $R$ 保证控制量不饱和，再调 $S$ 和 $Q$**。Riccati 反向积分步长 **0.01 s** 就够，用四阶龙格-库塔。 |\n| H182 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 6 | 滑模参数经验值 | **滑模参数经验值**（C2 第11章）：$\\lambda=0.1\\sim0.5$（太大响应慢、太小超调大）；$k_1=5\\sim20$（受舵机带宽限制，\"别贪快\"）；$k_2$ = **干扰上界的 1.2~1.5 倍**。作者曾把 $k_2$ 设得偏小，遇强风干扰攻角直接冲到 28°（限幅 25°），后加自适应增益才解决。 |\n| H183 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 7 | 抖振抑制 | **抖振抑制**：边界层厚度 $\\Phi=0.01\\sim0.05$，配合扩张状态观测器效果最好（C2 第10章）。趋近律参数 $\\varepsilon=0.1\\sim0.5$、$k=5\\sim20$；作者把 $\\varepsilon$ 设到 2.0，\"实物实验时舵机高频振荡，差点把机械结构震散\"，降到 **0.3** 才解决。 |\n| H184 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 8 | 李雅普诺夫只保证 $s\\to0$，不保证瞬态不超限 | **李雅普诺夫只保证 $s\\to0$，不保证瞬态不超限**（C2 第11章）：\"仿真时稳态没问题，但实际飞行中攻角在到达滑模面前已经超了\"。对策：加\"到达阶段\"约束或用积分滑模。 |\n| H185 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 9 | 自适应实测 | **自适应实测**（C2 第13章，马赫 2.5、10 km、气动参数 +20% 摄动、攻角约束 ±20°）：  \\| 指标 \\| 传统 PID 制导 \\| 自适应攻角约束制导 \\| \\|---\\|---\\|---\\| \\| 脱靶量 \\| 3.2 m \\| 0.8 m \\| \\| 最大攻角 \\| 24.5°（超限） \\| 19.8°（满足） \\| \\| 参数估计收敛时间 \\| — \\| 1.2 s \\| |\n| H186 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 10 | 势函数末段要衰减 | **势函数末段要衰减**（C2 第13章）：剩余时间小于 1 s 时逐渐减弱势函数，\"让制导律专注于命中精度\"。势函数加太强会影响终端精度。 |\n| H187 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 11 | 自适应调参 | **自适应调参**：$\\Gamma$ 从 **0.1** 起逐步增大（设太大会高频振荡）；估计值参数投影限制在名义值 **±50%**；遗忘因子时间常数 **0.5~1 s**；估计器加死区，阈值取传感器噪声标准差的 **2~3 倍**；参数初值取名义值的 80%~120%。 |\n| H188 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 12 | LMI 无解先别急着改参数 | **LMI 无解先别急着改参数**（C2 第15章）：\"我曾经把 $\\alpha_{max}$ 设成 5°，结果 LMI 怎么都解不出来。放宽到 10°，立马有解\"。另：求解后逐行检查 LMI 维度是否匹配——作者漏写一行攻角约束，仿真跑出来攻角超限。 |\n| H189 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 13 | 攻角约束不是越紧越好 | **攻角约束不是越紧越好**（C2 第23章）：作者把约束设到 ±5°，满足率只有 **60%**；放宽到 ±8°，满足率升到 **98%**，脱靶量反而更小——\"太紧的约束会导致制导指令剧烈变化，反而影响精度\"。要求满足率 **≥95%**。 |\n| H190 | C | 终端制导 | C-03 | 末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒） | 14 | 三维解耦不是万能的 | **三维解耦不是万能的**（C2 第20章）：陀螺噪声偏大时解耦后的制导律反而发散，作者加了低通滤波才解决。 |\n| H191 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 1 | 加「能量健康度」指标 | **加「能量健康度」指标**（C3 第3章）：把能量高度在走廊中的位置归一化到 0~1，>0.8 安全、0.5~0.8 预警、<0.5 触发紧急控制。\"这个指标简单直观，调试时特别好用\"。作者一次仿真中健康度一直在 0.6 附近上不去，查出来是**气动模型少算了一个阻力项**——\"先别急着调控制参数，回头检查模型\"。 |\n| H192 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 2 | 可行域分析必须是动态的，要预测未来 3~5 s | **可行域分析必须是动态的，要预测未来 3~5 s**（C3 第3章）。作者只检查当前时刻能量在走廊内，结果末端突然掉出走廊来不及补救。执行节奏：**每 0.1 s 算一次能量高度，每 0.5 s 做一次可行域判断**。 |\n| H193 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 3 | 能量管理要提前 5~10 s 介入 | **能量管理要提前 5~10 s 介入**（C3 第5章）：\"等到最后 2 秒再调，往往来不及\"。 |\n| H194 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 4 | 分段点 3~5 个就够 | **分段点 3~5 个就够**（C3 第4章）：\"设得太少轨迹不平滑，设得太多容易过拟合\"。剖面预留 **5%~10%** 余量；必须保证 $E_{h,ref}-h_{ref}$ 始终大于安全阈值，否则反算出的速度会小于失速速度。 |\n| H195 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 5 | $\\dot{\\Delta e}$ 要限幅在 ±200 J/(kg·s) | **$\\dot{\\Delta e}$ 要限幅在 ±200 J/(kg·s)**（C3 第6章）：\"能量误差大的时候微分项容易引入噪声，加了限幅器效果立竿见影\"。能量误差加二阶低通，截止频率 **2~5 Hz**。 |\n| H196 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 6 | 末端飞行时间短，别加积分项 | **末端飞行时间短，别加积分项**（C3 第6章）：\"积分项来不及起作用，反而容易引起超调，PD 就够了\"。 |\n| H197 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 7 | 攻角限幅必须放在控制律计算的最后一步 | **攻角限幅必须放在控制律计算的最后一步**（C3 第6章）：作者把限幅放在增益调度之前，\"增益查表查到了错误区间，飞行器直接失控\"。 |\n| H198 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 8 | 攻角变化率限制在 5°/s 以内 | **攻角变化率限制在 5°/s 以内**（C3 第8章）：\"我见过有人直接给阶跃指令，结果飞行器直接失速\"。倾侧角反转（+30°→−30°）必须加**至少 0.5 s** 过渡，作者没做平滑导致航向偏差直接跳了 20°。 |\n| H199 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 9 | 能量偏低时增大倾侧角用高度换速度 | **能量偏低时增大倾侧角用高度换速度**（C3 第8章）：仿真中只减攻角速度恢复很慢，配合倾侧角到 **45°** 左右，\"速度能在 3 秒内提升 15%，代价是掉高约 100 米。这个交换比在末端制导中是可以接受的\"。 |\n| H200 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 10 | 阻力板开到最大的教训 | **阻力板开到最大的教训**（C3 第5章）：作者为快速减速把阻力板开到最大，\"飞行器直接失速，姿态失控\"——**阻力调制不能只看阻力，还要看升力是否够维持飞行**；且要检查阻力板位置引起的力矩平衡（作者某型无人机开板后高度掉得特别快，是升力中心后移产生低头力矩）。执行机构**留 10%~20% 余量**。 |\n| H201 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 11 | 先做开环测试 | **先做开环测试**（C3 第5章）：手动给定阻力板和攻角指令看能量变化曲线，摸清规律再上闭环，\"能避免很多低级错误\"。 |\n| H202 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 12 | 过程约束的三种处理，按阶段换 | **过程约束的三种处理，按阶段换**（C3 第9章）：工程初期用硬约束限幅（简单粗暴先让弹飞起来）→ 弹道定型后换罚函数法做精细调整 → MPC 因算力在型号里用得不多。预测子步取制导周期的 **1/5**；减速指令要叠加过载限制，\"否则约束满足了，结构先坏了\"；动压和热流同时超限时取更严格的减速量。 |\n| H203 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 13 | 动压与热流是耦合的 | **动压与热流是耦合的**（C3 第9章）：为躲动压在高空减速 → 飞行时间变长 → 热流累积更大。作者遇到两者交替超限调了三天，最后发现是初始能量分配问题，**收紧中末制导交接班速度条件**才解决。 |\n| H204 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 14 | 末段不要大幅拉高来修正高度偏差 | **末段不要大幅拉高来修正高度偏差**（C3 第11章）：\"速度比高度更重要\"，作者见过这么干导致速度掉到失速边界以下直接失控。实战案例：某滑翔增程弹用纯 PN 高度误差 ±20 m，改成能量-高度协调 + 前馈 + 增益调度后降到 **±3 m**，速度偏差 <2%。 |\n| H205 | C | 终端制导 | C-04 | 末端能量管理与可用过载预测 | 15 | 高超声速风洞数据本身有 ±10% 误差 | **高超声速风洞数据本身有 ±10% 误差**（C3 第27章）：作者用标称数据设计，实飞阻力系数偏差 15%，差点能量不足；舵偏一般不超过 ±20°；单次机动不超过 30 s 给结构留散热时间。 |\n| H206 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 1 | 多约束设计的第一步是检查约束相容性 | **多约束设计的第一步是检查约束相容性**（C4 第9章）。作者同时加末端角度和速度约束，\"发现两个约束在数学上存在矛盾——期望命中角对应的速度范围与期望速度值完全不重合，最后只能跟总体协商放宽其中一个\"。 |\n| H207 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 2 | $R$ 不能取得太小 | **$R$ 不能取得太小**（C4 第8章）：\"我在一个项目中 $R$ 取了 0.01，结果仿真里过载直接飞到 50 g，实际导弹根本做不到\"。取值参考：高机动目标 $R=0.1I$；低机动 $R=I$；角度要求严格 $R=0.5I$。速度约束权重 $\\rho$ **从 1 起步**，速度偏差大就增大、指令振荡就减小。 |\n| H208 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 3 | 先用无约束制导律做粗调，末端再切换成带角度约束的制导律 | **先用无约束制导律做粗调，末端再切换成带角度约束的制导律**（C4 第8章），兼顾中段能量效率与末端精度。核心权衡一句话：**用控制能量换取终端精度**。 |\n| H209 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 4 | 速度约束实测收益 | **速度约束实测收益**（C4 第9章）：不加速度约束时末端速度偏差 ±40 m/s，加了之后缩小到 **±5 m/s 以内**，代价是脱靶量 0.5 m → 1.2 m，\"这个 trade-off 是可以接受的\"。 |\n| H210 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 5 | $t_{go}$ 设下限 0.1 s | **$t_{go}$ 设下限 0.1 s**（C4 第8章）：\"否则数值会爆炸\"。$P(t)$ 矩阵做成**时间—剩余距离的二维查表**，比在线解 Riccati 快一个数量级。 |\n| H211 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 6 | 滑模面系数 $c_1,c_2$ 取 0.5~2.0 | **滑模面系数 $c_1,c_2$ 取 0.5~2.0**（C4 第11章）：\"太小收敛慢，太大容易引起抖振\"。作者半实物仿真试过 $c_1=5$，\"舵机抖得跟筛子似的\"。 |\n| H212 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 7 | 切换增益 $k$ 取扰动上界的 1.2~1.5 倍 | **切换增益 $k$ 取扰动上界的 1.2~1.5 倍**（C4 第11章）。作者踩坑：\"k 取太小系统根本进不了滑模面；取太大抖振严重到把执行器烧了\"。答辩时回答评委「凭什么保证 k 覆盖所有扰动」的答案是 **1.5 倍，留足裕量**。 |\n| H213 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 8 | 用 $\\tanh(s/\\Delta)$ 或 $\\mathrm{sat}(s/… | **用 $\\tanh(s/\\Delta)$ 或 $\\mathrm{sat}(s/\\Delta)$ 替代 $\\mathrm{sign}(s)$，$\\Delta=0.01\\sim0.05$**（C4 第10/11章）。作者在某无人机姿态控制项目因抖振**烧毁舵机**。周期紧先用边界层法，追求极致性能直接上高阶滑模（超螺旋：$u=-k_1\\|s\\|^{0.5}\\mathrm{sign}(s)+v,\\ \\dot v=-k_2\\mathrm{sign}(s)$）。 |\n| H214 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 9 | 初始误差太大时先加比例引导段再切滑模 | **初始误差太大时先加比例引导段再切滑模**（C4 第11章）：角度差 30° 以上时滑模\"到达时间过长\"。 |\n| H215 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 10 | 多约束耦合用三层分层优化 | **多约束耦合用三层分层优化**（C4 第9章）：第一层最优制导律生成基准轨迹（只管位置+速度）→ 第二层 MPC 处理角度和过载 → 第三层在线优化处理视场角等快变约束。\"每层只处理少量约束，计算量可控，层与层通过状态反馈解耦\"。 |\n| H216 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 11 | 快回路带宽至少是慢回路的 5 倍 | **快回路带宽至少是慢回路的 5 倍**（C4 第15章）。作者曾因两者带宽太接近出现耦合振荡，强制拉开后解决。慢回路期望动态设计成一阶低通形式，只需调 $\\omega_v,\\omega_\\gamma$ 两个参数。 |\n| H217 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 12 | 动态逆怕模型不准 | **动态逆怕模型不准**（C4 第15章）：气动数据偏差 15% 时控制律直接发散。三招：在线 RLS 辨识 + 鲁棒补偿项（滑模或 $H_\\infty$）+ 自适应增益。 |\n| H218 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 13 | 饱和时主动降低慢回路带宽 $\\omega_v,\\omega_\\gamma$ | **饱和时主动降低慢回路带宽 $\\omega_v,\\omega_\\gamma$**（C4 第15章，作者更推荐\"参考轨迹调节\"而非抗饱和补偿器）：期望轨迹变缓，控制量自然退出饱和。起因是一次飞行试验舵面指令打到限幅，脱靶量大了好几倍。 |\n| H219 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 14 | 三维叉积在视线角速度过零时数值不稳定 | **三维叉积在视线角速度过零时数值不稳定**（C4 第22章）：作者加小量正则化 $\\varepsilon=10^{-6}$ 解决。 |\n| H220 | C | 终端制导 | C-05 | 末端速度矢量控制（最优 / 滑模 / 动态逆） | 15 | MPC 用 jerk 作控制量 | **MPC 用 jerk 作控制量**（C4 第17章）：某型空地弹项目中直接用加速度作控制量，\"执行机构响应有明显滞后和超调；用 jerk 相当于给加速度加了个平滑滤波器，轨迹顺滑很多\"。预测时域 **N≤10**（试过 N=20，求解时间翻三倍而控制效果提升微乎其微）；STM32H743 上单次求解平均 **0.42 ms**、最大 **0.68 ms**，满足 100 Hz 控制。 |\n| H221 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 1 | 先排优先级，别把权重设成一样的 | **先排优先级，别把权重设成一样的**（C2 第19章）：\"我曾经把攻角约束和过载约束设成同等权重，结果两个都没满足好。改成过载优先、攻角其次，问题就解决了\"。 |\n| H222 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 2 | ⚠️ 注意：书中两处优先级排序不一致 | **⚠️ 注意：书中两处优先级排序不一致**——C1 第12章给的顺序是「1 过载 → 2 视场 → 3 落角」（理由：结构安全是底线 / 丢了目标后面全白搭 / 落角可放宽 ±5°）；而 C1 第8章 MPC 的约束优先级是「1 执行机构饱和 → 2 视场角 → 3 过载限制」（理由：舵面打死是硬约束 / 视场可用软约束但权重设高）。建模时**按具体场景与\"谁是硬约束\"确定，不要照抄某一处**，并在模型中显式标注依据。（另：C1 第12章也指出优先级不是死的——某项目客户要求落角 ±2° 不能超，过载和视场就得给落角让路。） |\n| H223 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 3 | 提前画「约束可行域」，看三个约束有没有交集 | **提前画「约束可行域」，看三个约束有没有交集**（C1 第12章）：没有交集就得改指标。作者曾为同时满足过载和落角把弹道设计得特别激进，结果末端姿态变化太快、导引头丢了目标。 |\n| H224 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 4 | 弹道分段 + 软切换 | **弹道分段 + 软切换**（C1 第12章）：中制导段控过载 → 过渡段调姿态盯视场 → 末制导段保落角和视场。过渡段用软切换函数，让过载权重从 100% 渐降到 60%、落角和视场从 0% 升到 40%，\"不会出现突变，弹道更平滑\"。 |\n| H225 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 5 | 该松就松，别死磕 | **该松就松，别死磕**（C1 第12章实例）：过载限 8 g 但仿真总超到 8.5 g → 跟结构组沟通放宽到 9 g → 限幅设 8.5 g 留 0.5 g 余量 → 落角 80° 降到 75° → 三个约束都满足。\"工程上很少有绝对的'必须'，更多是'在什么范围内可以接受'\"。另：过载短时间超一点（0.2 s 内超 10%）结构通常能扛，但别超太久。 |\n| H226 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 6 | 视场约束下的参数整定经验公式 | **视场约束下的参数整定经验公式**（C1 第15章）：$N=3\\sim5$（视场角小取小值）；$\\theta_{max}=0.8\\times$物理极限（留 20% 余量，±40° 导引头设 ±32°）；增益切换点 $t_{sw}=0.3\\,t_{go}$。至少做三组仿真：**标称工况 / 极限机动工况 / 初始指向偏差工况**。 |\n| H227 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 7 | 仿真中加视场角超限计数器 | **仿真中加视场角超限计数器**（C1 第15章）：只要超限一次就记录当时飞行状态，\"调试时能快速定位问题出在哪个阶段\"。$t_{go}$ 估计要**保守，宁可估长别估短**。 |\n| H228 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 8 | 噪声模型必须用实测数据 | **噪声模型必须用实测数据**（C1 第15章 / C2 第23章）：作者某项目仿真里视场角始终在 ±25° 以内，挂到飞控计算机上直接飙到 ±38°。C2 第23章补充：传感器噪声是**有色噪声**，至少加一阶马尔可夫过程模拟相关性。 |\n| H229 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 9 | 蒙特卡洛规范 | **蒙特卡洛规范**（C2 第23章 / C3 第23章 / C4 第25章）：次数 **≥500**（C4 作者实测 500 次与 10000 次统计结果差异 <1%）；优先用**拉丁超立方采样**（500 次 ≈ 简单随机采样 2000 次效果）；看 **95% 分位数和最大值而非均值**——作者见过平均 0.5 m 但最大 8 m，\"这在实战中就是灾难\"。随机分布要**正态+均匀混合**，全用正态会漏掉极端组合工况；多线程跑要为每个线程配独立随机数流。 |\n| H230 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 10 | 蒙特卡洛结果判读 | **蒙特卡洛结果判读**（C3 第23章）：成功率低但偏差小 → 存在\"死区\"，检查约束边界；成功率高但偏差大 → 鲁棒好但精度差；对某参数特别敏感 → 该回路设计有问题（作者加高度前馈后敏感度降一半）。成功率 **<95% 直接打回重做**。 |\n| H231 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 11 | 攻角约束满足率要求 ≥95%，指令平滑度 $\\max\\|\\ddot a_{cm… | **攻角约束满足率要求 ≥95%，指令平滑度 $\\max\\|\\ddot a_{cmd}\\|<50\\ \\mathrm{m/s^3}$**（C2 第23章）。某次综合结果：脱靶均值 0.67 m、标准差 0.32 m、满足率 97.2%、平滑度 32.5 m/s³。仿真矩阵至少 **3 种射程 × 3 种机动强度 = 9 种工况**。 |\n| H232 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 12 | 仿真必须加限幅和风场 | **仿真必须加限幅和风场**（C2 第23章 / C3 第11章）：\"我曾经有一次仿真跑得挺好，一上实物就炸了，原来是舵面限幅导致控制量饱和。仿真里没加限幅，实物加了\"。初始攻角别设太大（同事设 15° 仿真一开始就发散，建议 0°~5°）。 |\n| H233 | C | 终端制导 | C-06 | 多约束耦合与工程实现（权衡、一体化、验证） | 13 | 一体化设计的触发条件 | **一体化设计的触发条件**（C2 第18章）：\"当脱靶量要求小于 1 米、末端攻角约束在 ±2° 以内时，必须上一体化设计，否则调来调去都很难同时满足\"。**一体化模型必须包含执行机构限幅特性**，作者忽略舵机饱和导致仿真与实际差得离谱 统用极点配置 | **简单系统用 Z-N，复杂系统用极点配置**。模型准、能精确控制阻尼比和带宽 → 极点配置；模型不确定性大或赶时间 → Z-N 快速出初值再现场微调。 |\n| H265 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 3 | 仿真越完美，实物越可能出问题 | **仿真越完美，实物越可能出问题**。作者用极点配置把闭环极点放在 $s=-10\\pm j10$，\"仿真完美。结果半实物仿真时，由于传感器噪声和舵机非线性，系统高频振荡\"，把极点左移到 $s=-5\\pm j5$，牺牲快速性换稳定。 |\n| H266 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 4 | 阻尼比 0.3 → 0.7 是立竿见影的改进 | **阻尼比 0.3 → 0.7 是立竿见影的改进**。某型地空弹短周期阻尼比只有 0.3、超调很大，\"通过调整控制增益把阻尼比提升到 0.7，效果立竿见影\"。 |\n| H267 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 5 | 调试时先断开增稳回路，只调阻尼回路 | **调试时先断开增稳回路，只调阻尼回路**。\"当年我图省事一起调，结果花了三倍时间才把问题找出来。\" |\n| H268 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 6 | 三通道单独仿真都完美，一联调就出问题 | **三通道单独仿真都完美，一联调就出问题**——通道间耦合。对策是拉开三通道带宽差距（滚转最快、俯仰次之、偏航最慢）。 |\n| H269 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 7 | 时变特性必须增益调度 | **时变特性必须增益调度**。某半实物仿真用固定 PID，\"高空低速段表现还行，一到低空高速段就开始振荡\"；某型地空弹\"地面测试好好的，一上天就抖得跟筛子似的\"。 |\n| H270 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 8 | 调度变量选马赫数+动压 | **调度变量选马赫数+动压**（最常见组合），四个准则：能反映非线性变化、可测量、变化平滑、对故障鲁棒。作者见过选攻角做调度变量，\"结果攻角传感器一坏，整个系统直接崩了\"。 |\n| H271 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 9 | 调度维度别贪多 | **调度维度别贪多**。作者试过马赫数+动压+攻角+侧滑角四维调度，\"调度表大到飞控计算机内存装不下，插值计算时间赶上控制周期了。后来老老实实降到二维，效果反而更好\"。 |\n| H272 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 10 | 调度边界外再外推 10% 余量 | **调度边界外再外推 10% 余量**；**调度更新频率至少是控制频率的 1/10**（控制 100 Hz → 调度 ≥10 Hz）。曾有项目调度更新只有 10 Hz，\"导弹在高动态机动时，增益跟不上状态变化，直接发散\"。 |\n| H273 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 11 | 每次做完增益调度都做一次\"最坏情况测试\" | **每次做完增益调度都做一次\"最坏情况测试\"**：假设调度变量测量值有 20% 误差，\"这个测试帮我发现过好几次潜在问题\"。 |\n| H274 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 12 | 导航比整定 | **导航比整定**：高机动目标（战斗机）$N=4\\sim5$；低机动目标（无人机、巡航导弹）$N=3\\sim4$；导引头噪声大则适当降低。作者把 $N$ 设到 6，\"仿真里脱靶量很小，但实际飞行试验时导弹在末端剧烈抖动，差点失控\"。 |\n| H275 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 13 | 整定顺序 | **整定顺序**：先开环看裕度 → 再闭环调 PID → 最后加约束（舵机饱和、速率限制）。\"调 PID 时，我习惯先调比例项，让系统动起来；再加积分项消除静差；最后加微分项改善动态响应。别一上来就三个参数一起调。\" |\n| H276 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 14 | 蒙特卡洛是整定的收尾判据 | **蒙特卡洛是整定的收尾判据**：作者习惯跑 500 次以上，\"脱靶量均值小于 3 米，且标准差小于 1 米，我就觉得这个设计基本靠谱了\"；扫描 $N\\in[2.5,5.0]$ 看脱靶量趋势。 |\n| H277 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 15 | 超调与调节时间是一对矛盾 | **超调与调节时间是一对矛盾**：某项目把超调从 20% 压到 5%，\"结果调节时间从 1.2 s 变成了 2.8 s——这显然不行\"，折中点是超调 10%、调节时间 1.5 s。 |\n| H278 | D | 制导系统建模仿真 | D-03 | 制导系统参数整定——整定流程、调参顺序与指标权衡 | 16 | 限幅必须留裕度 | **限幅必须留裕度**：过载设计\"至少留 30% 的过载裕度\"，见过仿真 12 g 而实际因气动偏差飙到 18 g 导致弹体解体的案例。 |\n| H279 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 1 | 3 ms 时间偏差 → 脱靶量翻倍 | **3 ms 时间偏差 → 脱靶量翻倍**（某型地空弹）。后来统一用 IRIG-B 码对时才解决；另一项目制导计算机与仿真计算机各用自己的时钟，\"跑了 10 秒后时间差累积到 50 ms，整个仿真结果完全不可用\"。 |\n| H280 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 2 | 目标模拟器更新频率必须高于导引头 | **目标模拟器更新频率必须高于导引头**。某项目脱靶量总是偏大，\"目标模拟器更新频率只有 50 Hz，而导引头跟踪频率是 100 Hz——导引头在'猜'目标位置\"，提到 200 Hz 后解决。 |\n| H281 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 3 | 转台带宽不够就露馅 | **转台带宽不够就露馅**。数字仿真里导引头稳如磐石，\"上了转台就开始抖——转台带宽只有 5 Hz，而弹体振动频率在 8 Hz 左右\"。**选转台别光看指标，要看带宽**。 |\n| H282 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 4 | 光瞳匹配要提前算 | **光瞳匹配要提前算**。红外半实物仿真中黑体温度设置没问题但导引头锁不住目标，\"查了两天才发现黑体的辐射面积太小，导引头光学系统没完全覆盖\"，换大口径黑体解决。 |\n| H283 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 5 | 单点接地是铁律 | **单点接地是铁律**。舵机反馈信号里始终有 50 Hz 工频干扰，查了两天，\"是电源地和信号地共用了同一个回路\"，加隔离放大器解决。**信号噪声问题 80% 是接地问题**；50 Hz/100 Hz 噪声基本可断定为电源工频干扰。 |\n| H284 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 6 | 硬件集成三大原则 | **硬件集成三大原则**：先接地后接信号、强弱电分离、每个接口做标签。作者因一根屏蔽线没接地导致仿真机\"看门狗复位\"，查了三天。 |\n| H285 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 7 | 参数表会骗人 | **参数表会骗人**。选了一块标称 1 MS/s 的采集卡，\"闭环跑的时候延迟直接飙到 5 ms 以上，是驱动没配好、中断优先级太低\"；某项目用普通 PC 做实时仿真，10 ms 帧周期下频繁丢帧。 |\n| H286 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 8 | 实时任务优先级 | **实时任务优先级**：接口 I/O > 模型计算 > 数据通信（VxWorks 中数字越小优先级越高，100 > 120 > 150）。接口 I/O 一旦错过周期，硬件会报错甚至损坏。 |\n| H287 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 9 | TCP 传实时数据会崩 | **TCP 传实时数据会崩**。某次联调用 TCP 传遥测，\"交换机缓存溢出，TCP 包被延迟了 200 毫秒，整个仿真系统直接崩溃\"；传小数据记得关 Nagle（TCP_NODELAY）。反射内存网必须做**地址分区**防写冲突，节点 ID 必须唯一。 |\n| H288 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 10 | 测试三步走，不能跳 | **测试三步走，不能跳**：开环 → 闭环 → 全系统联调。软件集成\"分层集成、逐级验证\"：驱动自检 → 空模型（只做 IO 映射）→ 完整模型。**很多团队跳过前两步直接上闭环，出了问题不知道是模型错还是硬件坏**。 |\n| H289 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 11 | 排故三板斧 | **排故三板斧**：① 信号注入法（标准正弦/方波/阶跃逐级注入，偏差 >5% 要警惕）——作者靠它查出调理板增益电阻焊错导致幅值大了 1.2 倍；② 分段隔离法（从中间一刀切，半小时定位困扰团队两周的问题）；③ 对比验证法（与纯数学仿真比，**差异 >10% 肯定有问题**，5% 以内可接受）。 |\n| H290 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 12 | 每次半实物前先跑\"延迟标定\"程序 | **每次半实物前先跑\"延迟标定\"程序**：给飞控板发方波，看回来什么波形，延迟一目了然。 |\n| H291 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 13 | 信号模拟器要定期校准 | **信号模拟器要定期校准**。某项目\"模拟器的相位噪声比真实环境差了 20 dB，导致测出来的抗干扰性能虚高\"——实验室全优，外场掉链子。 |\n| H292 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 14 | 校准三级递进 | **校准三级递进**：传感器级（零偏/线性度/温度补偿，$-40\\sim+85^\\circ$C 温度循环）→ 通道级（增益/偏置/相位延迟/噪声基底，**校准信号带宽至少是工作带宽的 2 倍**）→ 系统级（闭环自检 + 残差分析）。某 MEMS 陀螺 25°C 零漂 0.02°/s、85°C 变 0.15°/s，不做温度补偿\"弹体转个 90° 弯，姿态误差能差十几度\"。项目中给校准留**至少 30% 的时间**。 |\n| H293 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 15 | 联调必做故障注入 | **联调必做故障注入**。作者故意让舵机卡死在最大偏角，\"结果控制律直接发散，仿真机过载保护跳闸\"，后来在控制律里加了限幅和速率限制。**正常工况跑得再好，也不如一次故障注入有价值**。 |\n| H294 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 16 | 数据管理 | **数据管理**：命名用\"日期_试验编号_工况编号_重复次数\"，数据**自动保存 + 每工况手动备份**（作者曾因忘点保存，12 小时试验全部白费）。试验计划时间**乘 1.5 倍**作为预留。 |\n| H295 | D | 制导系统建模仿真 | D-04 | 半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度 | 17 | 仿真结果乘 1.3 才是真实需求 | **仿真结果乘 1.3 才是真实需求**。 |\n| H296 | D | 制导系统建模仿真 | D-05 | 误差建模、蒙特卡洛与精度评估 | 1 | 仿真 0.5 m、外场 3 m | **仿真 0.5 m、外场 3 m**——漏了导引头测量噪声。另一次团队仿真 0.2 m，\"结果外场试验因为没考虑导引头盲区，脱靶量变成了 5 米\"。 |\n| H297 | D | 制导系统建模仿真 | D-05 | 误差建模、蒙特卡洛与精度评估 | 2 | 导引头噪声是距离相关的 | **导引头噪声是距离相关的**。作者曾用固定噪声模型，\"仿真结果漂亮得很，一上靶场就露馅\"。**远距离时噪声可能增大 3~5 倍**，必须在仿真中加入距离-噪声曲线。 |\n| H298 | D | 制导系统建模仿真 | D-05 | 误差建模、蒙特卡洛与精度评估 | 3 | 有色噪声不能用白噪声建模 | **有色噪声不能用白噪声建模**。GPS 误差必须用一阶马尔可夫；有色噪声用高斯白噪声替代会让仿真精度虚高。 |\n| H299 | D | 制导系统建模仿真 | D-05 | 误差建模、蒙特卡洛与精度评估 | 4 | 只看均值会翻车 | **只看均值会翻车**，看 **95% 分位数**。\"如果 95% 的脱靶量都在 1 米以内，那这个制导律才算真正可靠。\"（A 域同一作者也强调过：前任只报告平均脱靶量 3.2 m，实弹有一发 28 m，重做分析发现 95% 分位数达 22 m。） |\n| H300 | D | 制导系统建模仿真 | D-05 | 误差建模、蒙特卡洛与精度评估 | 5 | 不确定性分布假设错了，结论完全相反 | **不确定性分布假设错了，结论完全相反**。见过团队假设参数均匀分布、实际是高斯分布，\"结果仿真结论完全相反\"。 |\n\n> 仅预览前 300 行，完整数据共 439 行（见 `heuristics.csv`）", "size": 185891}, {"path": "algorithms/README.md", "kind": "md", "text": "# Python 制导算法库\n\n> 与 book010 的 30 张 RIA++ 卡配套的可执行实现。\n> **纯标准库**（无 numpy/scipy 依赖），Python 3.9+ 可直接运行。\n> 每个模块自带自检，`python3 <模块>.py` 即可验证。\n\n## 快速开始\n\n```bash\ncd algorithms\npython3 run_all.py          # 一键自检（7 个模块）+ 综合工程演示\npython3 gnc_core.py         # 单独跑某个模块的自检\n```\n\n```python\nimport engagement as eg\n\n# 一次交战仿真：末段突然机动的最坏工况\nr = eg.simulate(N=4.0, law=\"TPN\", R0=6000, H0=500, Vm=700, Vt=300,\n                t_break=5.0, tgt_g=9.0, amax=25*9.80665,\n                delay=0.10, sig_lam=1e-3, tau_f=0.05)\nprint(r[\"miss\"], r[\"peak_g\"], r[\"gimbal_max\"])   # 脱靶 / 峰值过载 / 最大框架角\n```\n\n## 模块清单\n\n| 模块 | 职责 | 自检项 | 卡片出处 |\n|---|---|---|---|\n| `gnc_core.py` | 向量/角度/LOS 运动学、碰撞三角、$t_{go}$、ZEM、CPA | 8 | A-01, B-02 |\n| `dynamics.py` | 一阶延迟（解析离散解）、限幅（硬/软/动态）、RK4 | 8 | A-04, B-02 |\n| `guidance_laws.py` | **10 种制导律**统一接口 + 注册表 | 11 | A-01/05/06, B-02/03, C-02/05, E-02/04 |\n| `seeker.py` | 有色噪声 AR(1)、角度/速率噪声模型、滤波微分、视场框架角 | 6 | A-01, C-02 |\n| `engagement.py` | 闭环交战仿真（机动/延迟/噪声/限幅/视场） | 8 | A-02/04/05, D 域 |\n| `metrics.py` | 分位数/CEP/工程评级/验收判据 | 8 | B-05 |\n| `monte_carlo.py` | 分布建模、拉丁超立方、1D/2D 扫描 | 9 | B-05 |\n| `run_all.py` | 一键自检 + 综合标定演示 | — | — |\n\n## 制导律注册表\n\n`guidance_laws.LAWS` 提供统一接口 `command(name, geom, **params) -> a_cmd`，\n可直接互换、可参数化（便于 MBSE 中的「同一接口下的策略变体」建模）：\n\n| 名称 | 公式 | 用途 | 卡片 |\n|---|---|---|---|\n| `TPN` | $a=N V_c\\dot\\lambda$（⊥视线） | 通用首选 | A-01 |\n| `PPN` | $a=N V_m\\dot\\lambda$（⊥速度） | 大气层内，需 $N$=6~10 | A-01 |\n| `APN` | $a=NV_c\\dot\\lambda+\\frac{N}{2}\\hat a_{T\\perp}$ | 机动目标（过载受限时才有收益） | B-03, A-05 |\n| `BPN` | $a=NV\\dot\\lambda+K_{bias}(\\theta-\\theta_{ref})$ | 落角/视场约束 | C-02 |\n| `OGL` | $a=N\\cdot \\mathrm{ZEM}/t_{go}^2$ | 最优制导，$N$=3 等价 PN | B-02 |\n| `IMPACT_ANGLE` | $a=N_1\\frac{y}{t^2}+N_2\\frac{\\dot y}{t}+N_3\\frac{V_m(\\theta-\\theta_d)}{t}$ | 终端落角控制 | C-05 |\n| `FOV_BARRIER` | $\\dot\\lambda_{des}=-k\\lambda(\\lambda_{max}^2-\\lambda^2)^2$ | 视场硬约束 | C-02 |\n| `SMC` | $s=\\dot\\lambda+c\\lambda,\\ u=-ks-\\varepsilon\\,\\mathrm{sat}(s/\\Phi)$ | 强鲁棒 | E-02/04 |\n| `PURE_PURSUIT` | $a=KV_m(\\lambda-\\theta_m)$ | 对照基线 | A-01 |\n| `PREDICTIVE` | 瞄准 $P_{pred}=P_T+V_T t_{go}+\\frac12\\hat A_T t_{go}^2$ | 融合制导 | A-06 |\n\n## 五条不可违背的建模约定\n\n这些是从 book010 仿真踩坑中固化下来的，写在代码注释里，改动前请先读：\n\n1. **$\\dot\\lambda$ 符号**：$\\dot\\lambda=(r_x\\dot r_y-r_y\\dot r_x)/|r|^2$，\n   写反会让导弹被\"推开\"（`gnc_core.los_rate`）。\n2. **初速按碰撞三角设定**：否则理想工况就有 0.5 m 级\"假脱靶\"\n   （`gnc_core.collision_heading`）。\n3. **目标机动必须进运动学**：只把机动喂给 APN 补偿项是致命 bug\n   （`engagement.simulate` 内分段解析积分）。\n4. **噪声用角度噪声模型**：测角噪声 + 滤波微分；速率噪声模型会得出\n   与教科书相反的结论（`seeker.Seeker`）。\n5. **框架角 $|\\lambda-\\theta_m|$ 且只在 $r>150$ m 统计**：\n   用 $\\arccos(\\hat v\\cdot\\hat r)$ 会算出 175° 这类荒谬值。\n\n## 自检覆盖\n\n```text\ngnc_core     8 项   λ̇ 符号 / 碰撞三角 λ̇≡0 / ZEM 双算法一致 / CPA 解析 vs 数值\ndynamics     8 项   解析解 vs 细分 / τ 特性 / 大步长稳定性 / RK4 四阶（比值 16.5）\nguidance    11 项   10 种律 / OGL≡PN / APN 收益边界 / BPN 落角 / FOV 屏障\nseeker       6 项   AR(1) 与 dt 无关 / 滤波微分 / 两种噪声模型的相反结论\nengagement   8 项   理想脱靶 2.4e-15 m / 延迟门槛 / 限幅 / 框架角合理性\nmetrics      8 项   分位数 / CEP / 评级阈值 / 验收倍率\nmonte_carlo  9 项   分布 / 拉丁超立方 / 1/√n 收敛 / 可复现性\n```\n\n## 已知数值结论（可复现）\n\n| 现象 | 数值 | 说明 |\n|---|---|---|\n| 理想工况脱靶 | $2.4\\times10^{-15}$ m | 碰撞三角 + 无扰动 |\n| 舵机延迟门槛 | ≤50 ms 无碍；300 ms → 7.5 m | 判据 $N\\tau/t_{go}\\to1$ |\n| $\\lambdȧ$ 滤波最优 $\\tau_f$ | ≈20 ms | 5 ms→3.45 m，200 ms→0.34 m |\n| 纯差分 vs 滤波 | 噪声 RMS 0.312 vs 0.035 rad/s | **9 倍**，印证\"$\\lambdȧ$ 绝不能差分\" |\n| APN 收益 | 20 g 限幅下 3.0 m；不受限 ≈0 | 过载不受限时无需 APN |\n| 角度噪声下 N 趋势 | 0.034 → 0.083 m（N=2.5→8） | 单调上升（教科书结论） |\n| 速率噪声下脱靶 | 小 2 个数量级 | 噪声被回路吃掉，模型不真实 |\n", "size": 5032}, {"path": "algorithms/gnc_core.py", "kind": "py", "text": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\ngnc_core.py — 制导基础工具层\n\n提供全局通用的向量/角度运算、视线（LOS）运动学、碰撞三角求解、\n剩余时间估计与零控脱靶量（ZEM）计算。纯标准库，无第三方依赖。\n\n符号约定（全库统一，务必遵守）：\n    r      = 目标位置 - 导弹位置      （相对位置矢量，指向目标）\n    rdot   = 目标速度 - 导弹速度      （相对速度矢量）\n    lam    = atan2(r_y, r_x)          （视线角）\n    lamdot = (r_x * rdot_y - r_y * rdot_x) / |r|^2      （视线角速率）\n    Vc     = -(r · rdot) / |r|        （接近速度，相互靠近时为正）\n    n_hat  = (-sin(lam), cos(lam))    （视线逆时针 90°，指令加速度正方向）\n\n    ⚠️ 经典坑：lamdot 写成 (r_y*rdot_x - r_x*rdot_y)/r^2 会符号反，\n       导弹会被目标\"推开\"，表现为脱靶量发散。本模块自检含符号验证。\n\n自检：python3 gnc_core.py\n\"\"\"\nfrom math import atan2, cos, hypot, sin, sqrt\n\n__all__ = [\n    \"vec_sub\", \"vec_add\", \"vec_scale\", \"vec_norm\", \"vec_dot\", \"vec_cross\",\n    \"wrap_pi\", \"deg\", \"rad\",\n    \"los\", \"los_rate\", \"closing_velocity\", \"los_unit\", \"los_normal\",\n    \"tgo_estimate\", \"zem\", \"collision_heading\", \"cpa_miss\",\n]\n\n\n# ---------------------------------------------------------------- 向量运算\ndef vec_sub(a, b):\n    \"\"\"a - b（逐分量）\"\"\"\n    return (a[0] - b[0], a[1] - b[1])\n\n\ndef vec_add(a, b):\n    return (a[0] + b[0], a[1] + b[1])\n\n\ndef vec_scale(a, s):\n    return (a[0] * s, a[1] * s)\n\n\ndef vec_norm(a):\n    return sqrt(a[0] * a[0] + a[1] * a[1])\n\n\ndef vec_dot(a, b):\n    return a[0] * b[0] + a[1] * b[1]\n\n\ndef vec_cross(a, b):\n    \"\"\"二维叉积的 z 分量：a × b\"\"\"\n    return a[0] * b[1] - a[1] * b[0]\n\n\n# ---------------------------------------------------------------- 角度工具\ndef wrap_pi(x):\n    \"\"\"把角度归一到 (-π, π]\"\"\"\n    while x > 3.141592653589793:\n        x -= 6.283185307179586\n    while x <= -3.141592653589793:\n        x += 6.283185307179586\n    return x\n\n\ndef deg(x):\n    \"\"\"弧度 → 度\"\"\"\n    return x * 57.29577951308232\n\n\ndef rad(x):\n    \"\"\"度 → 弧度\"\"\"\n    return x * 0.017453292519943295\n\n\n# ---------------------------------------------------------------- LOS 运动学\ndef los(t_pos, m_pos):\n    \"\"\"视线角 λ = atan2(r_y, r_x)\"\"\"\n    rx = t_pos[0] - m_pos[0]\n    ry = t_pos[1] - m_pos[1]\n    return atan2(ry, rx)\n\n\ndef los_rate(r, rdot):\n    \"\"\"视线角速率 λ̇ = (r × ṙ)_z / |r|²\n\n    Args:\n        r: 相对位置 (rx, ry)，指向目标\n        rdot: 相对速度 (v_rx, v_ry)\n    \"\"\"\n    rr = r[0] * r[0] + r[1] * r[1]\n    if rr <= 0.0:\n        return 0.0\n    return (r[0] * rdot[1] - r[1] * rdot[0]) / rr\n\n\ndef closing_velocity(r, rdot):\n    \"\"\"接近速度 Vc = -(r · ṙ)/|r|，相互靠近时为正\"\"\"\n    rn = vec_norm(r)\n    if rn <= 0.0:\n        return 0.0\n    return -vec_dot(r, rdot) / rn\n\n\ndef los_unit(r):\n    \"\"\"视线单位矢量 ê_r\"\"\"\n    rn = vec_norm(r)\n    return (r[0] / rn, r[1] / rn) if rn > 0 else (1.0, 0.0)\n\n\ndef los_normal(r):\n    \"\"\"视线法向单位矢量 n̂ = ê_r 逆时针 90°（指令加速度正方向）\"\"\"\n    e = los_unit(r)\n    return (-e[1], e[0])\n\n\n# ---------------------------------------------------------------- 时间与 ZEM\ndef tgo_estimate(r, rdot, a_t=0.0, lo=0.1, hi=10.0, iters=3):\n    \"\"\"剩余飞行时间 t_go 估计（含目标机动修正的隐式迭代）。\n\n    t_go = R/Vc + 0.5 * a_T * t_go² / Vc   （迭代 2~3 次即可）\n\n    经验（book010 卡 B-02）：t_go 是全系统最容易出问题的地方，\n    必须限幅 [0.1, 10] s 并加一阶低通（τ≈0.05 s），否则目标机动时\n    估计值会跳变（实测 2 s → 4 s）导致指令剧烈震荡。\n    \"\"\"\n    R = vec_norm(r)\n    Vc = closing_velocity(r, rdot)\n    if Vc <= 1e-6:\n        return hi\n    t = R / Vc\n    for _ in range(iters):\n        t = (R + 0.5 * a_t * t * t) / Vc\n    return max(lo, min(hi, t))\n\n\ndef zem(r, rdot, t_go):\n    \"\"\"零控脱靶量 ZEM（视线法向分量）。\n\n    ZEM = (r + ṙ·t_go) 在视线法向的投影 ≡ Vc·t_go²·λ̇ （线性化等价）\n\n    含义：从现在起不再施加任何控制，t_go 秒后导弹与目标的最近距离。\n    最优制导律（OGL）即 a = N·ZEM/t_go²，N=3 时退化为 PN。\n    \"\"\"\n    n = los_normal(r)\n    zr = (r[0] + rdot[0] * t_go, r[1] + rdot[1] * t_go)\n    return vec_dot(zr, n)\n\n\ndef collision_heading(t0, v_t, v_m_speed):\n    \"\"\"解析求解碰撞三角：给定目标状态与导弹速率，求导弹初速使 λ̇ ≡ 0。\n\n    由 V_T - V_M = -Vc·ê_r 且 |V_M| = Vm 得二次方程：\n        Vc² + 2(V_T·ê_r)·Vc + (|V_T|² - Vm²) = 0\n\n    ⚠️ 经验（book010 仿真教训）：初速若直接对准目标当前位置（纯追踪），\n    理想工况也会有 0.5 m 级\"假脱靶\"，掩盖真实规律。必须落在碰撞三角上。\n\n    Args:\n        t0: 目标初始位置 (x, y)（导弹在原点）\n        v_t: 目标速度 (vx, vy)\n        v_m_speed: 导弹速率（标量）\n    Returns:\n        (vmx, vmy, Vc)：导弹初速分量与接近速度\n    \"\"\"\n    R = hypot(t0[0], t0[1])\n    if R <= 0.0:\n        raise ValueError(\"目标与导弹初始重合\")\n    ex, ey = t0[0] / R, t0[1] / R          # ê_r（由导弹指向目标）\n    dot = v_t[0] * ex + v_t[1] * ey\n    disc = dot * dot - (v_t[0] ** 2 + v_t[1] ** 2 - v_m_speed ** 2)\n    if disc < 0.0:\n        raise ValueError(\n            f\"速度比不足（Vm={v_m_speed} 需 > {sqrt(v_t[0]**2 + v_t[1]**2 - disc):.1f}），\"\n            \"无碰撞三角解\")\n    Vc = -dot + sqrt(disc)\n    return v_t[0] + Vc * ex, v_t[1] + Vc * ey, Vc\n\n\ndef cpa_miss(r, rdot):\n    \"\"\"最近接近点（CPA）横向脱靶量解析估计。\n\n    miss = |r × ṙ| / |ṙ|，即匀速假设下相对运动的最近距离。\n    比逐点搜索 min|r| 平滑得多，适合作为仿真早停时的脱靶量。\n    \"\"\"\n    vn = vec_norm(rdot)\n    if vn <= 1e-9:\n        return vec_norm(r)\n    return abs(vec_cross(r, rdot)) / vn\n\n\n# ---------------------------------------------------------------- 自检\ndef _self_test():\n    print(\"=\" * 66)\n    print(\"  gnc_core 自检\")\n    print(\"=\" * 66)\n\n    # 1. λ̇ 符号验证：目标在 +y 方向远离（上偏），视线应逆时针转（λ̇ > 0）\n    r = (1000.0, 0.0)\n    rdot = (0.0, 100.0)          # 相对速度朝 +y\n    ld = los_rate(r, rdot)\n    assert ld > 0, f\"λ̇ 符号错误：应为正，实得 {ld}\"\n    print(f\"  [1] λ̇ 符号            : {ld:+.6f} rad/s  \"\n          f\"（目标上偏 ⇒ 视线逆时针，应为正）  ✅\")\n\n    # 2. 接近速度：相对速度朝向导弹 ⇒ Vc > 0\n    Vc = closing_velocity((1000.0, 0.0), (-300.0, 0.0))\n    assert Vc > 0\n    print(f\"  [2] 接近速度 Vc        : {Vc:+.2f} m/s  （靠近为正）  ✅\")\n\n    # 3. 法向单位矢量正交性\n    n = los_normal((1000.0, 0.0))\n    assert abs(vec_dot(n, (1.0, 0.0))) < 1e-12\n    print(f\"  [3] n̂ 正交性           : n̂=({n[0]:+.3f},{n[1]:+.3f})  ✅\")\n\n    # 4. 碰撞三角：解出的导弹初速应使 λ̇ ≡ 0\n    t0 = (5200.0, 500.0)\n    v_t = (-210.0, 60.0)\n    vmx, vmy, Vc0 = collision_heading(t0, v_t, 700.0)\n    ld0 = los_rate(t0, (v_t[0] - vmx, v_t[1] - vmy))\n    assert abs(ld0) < 1e-9, f\"碰撞三角未使 λ̇ 归零：{ld0}\"\n    assert abs(hypot(vmx, vmy) - 700.0) < 1e-9\n    print(f\"  [4] 碰撞三角           : V_M=({vmx:.1f},{vmy:.1f}) \"\n          f\"|V_M|={hypot(vmx, vmy):.3f}  Vc={Vc0:.1f}  λ̇={ld0:+.2e}  ✅\")\n\n    # 5. ZEM 两种算法一致性（几何投影 vs Vc·t_go²·λ̇ 线性化式）\n    r5 = (3000.0, 250.0)\n    rdot5 = (-600.0, -25.0)\n    tgo = tgo_estimate(r5, rdot5)\n    z_geo = zem(r5, rdot5, tgo)\n    z_lin = closing_velocity(r5, rdot5) * tgo * tgo * los_rate(r5, rdot5)\n    err = abs(z_geo - z_lin)\n    assert err < 1e-6, f\"ZEM 两算法不一致：{z_geo} vs {z_lin}\"\n    print(f\"  [5] ZEM 一致性         : 几何 {z_geo:+.4f} m / 线性化 \"\n          f\"{z_lin:+.4f} m  差 {err:.2e}  ✅\")\n\n    # 6. CPA 解析脱靶量 vs 数值搜索\n    r6, rdot6 = (2000.0, 150.0), (-500.0, -40.0)\n    best = min(vec_norm((r6[0] + rdot6[0] * t, r6[1] + rdot6[1] * t))\n               for t in [i * 0.0005 for i in range(10000)])\n    ana = cpa_miss(r6, rdot6)\n    assert abs(ana - best) < 1e-3, f\"CPA 解析解偏差过大：{ana} vs {best}\"\n    print(f\"  [6] CPA 脱靶量         : 解析 {ana:.6f} m / 数值搜索 \"\n          f\"{best:.6f} m  ✅\")\n\n    # 7. t_go 限幅\n    assert tgo_estimate((1.0, 0.0), (-1e-9, 0.0)) == 10.0     # 上溢截断\n    assert tgo_estimate((1e6, 0.0), (-1e6, 0.0)) <= 10.0\n    print(\"  [7] t_go 限幅 [0.1,10] : ✅\")\n\n    # 8. wrap_pi\n    for v in (7.0, -7.0, 0.0, 3.2):\n        assert -3.1415927 <= wrap_pi(v) <= 3.1415927\n    print(\"  [8] wrap_pi 归一化     : ✅\")\n\n    print(\"=\" * 66)\n    print(\"  gnc_core：8 项自检全部通过\")\n    print(\"=\" * 66)\n\n\nif __name__ == \"__main__\":\n    _self_test()\n", "size": 9008}, {"path": "algorithms/dynamics.py", "kind": "py", "text": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\ndynamics.py — 执行机构、限幅与数值积分\n\n组件\n----\n    FirstOrderLag : 舵机一阶延迟（解析离散解，步长无关）\n    Limiter       : 过载限幅（硬 / 软 tanh / 动态）\n    rk4_step      : 经典四阶 Runge–Kutta（向量状态）\n    integrate     : 定步长积分驱动器（带终止判据）\n\n设计依据（book010 卡 A-04 / B-02 经验）\n--------------------------------------\n* 一阶延迟用**解析离散解** a ← a_cmd + (a − a_cmd)·e^(−dt/τ)，\n  而非欧拉前向差分 —— 后者在大 dt/τ 时会失真甚至不稳定。\n* 限幅保留 **20%~30% 过载裕度**：\"按 80% 可用过载设计，靶试时需求冲到 85%\"。\n* 软限幅 u = u_max·tanh(u/u_max) 优于硬限幅（避免指令突变、\n  保护舵机）；动态限幅（按剩余时间/能量调整上限）工程上最推荐。\n\n纯标准库。自检：python3 dynamics.py\n\"\"\"\nimport math\n\n__all__ = [\"FirstOrderLag\", \"Limiter\", \"rk4_step\", \"integrate\", \"G\"]\n\nG = 9.80665\n\n\n# ---------------------------------------------------------------- 一阶延迟\nclass FirstOrderLag:\n    \"\"\"一阶惯性环节（舵机 / 滤波器）：τ·ȧ + a = a_cmd\n\n    解析离散解：a(t+dt) = a_cmd + (a(t) − a_cmd)·exp(−dt/τ)\n    该解对任意 dt 都是精确的（假设 a_cmd 步内恒定），\n    而前向差分 a += (a_cmd − a)·dt/τ 在 dt > 2τ 时会发散。\n    \"\"\"\n\n    def __init__(self, tau, y0=0.0):\n        self.tau = tau\n        self.y = y0\n\n    def reset(self, y0=0.0):\n        self.y = y0\n        return self.y\n\n    def step(self, cmd, dt):\n        if self.tau <= 0.0:\n            self.y = cmd\n        else:\n            self.y = cmd + (self.y - cmd) * math.exp(-dt / self.tau)\n        return self.y\n\n    def step_euler(self, cmd, dt):\n        \"\"\"前向差分（仅作对比，证明解析解的优势）。\"\"\"\n        if self.tau <= 0.0:\n            self.y = cmd\n        else:\n            self.y += (cmd - self.y) * dt / self.tau\n        return self.y\n\n\n# ---------------------------------------------------------------- 限幅\nclass Limiter:\n    \"\"\"过载/指令限幅。\n\n    mode:\n        'hard'    : 直接截断（简单，但指令突变、易激发未建模动态）\n        'soft'    : u = u_max·tanh(u/u_max)（连续可微，推荐）\n        'dynamic' : 上限随时变化（如按 t_go 收紧），需每步传入 limit\n    \"\"\"\n\n    def __init__(self, limit, mode=\"hard\", margin=1.0):\n        self.limit = limit\n        self.mode = mode\n        self.margin = margin            # 设计裕度系数：<1 表示降额使用\n\n    def amax(self, dynamic_limit=None):\n        lim = self.limit if dynamic_limit is None else dynamic_limit\n        return lim * self.margin\n\n    def __call__(self, u, dynamic_limit=None):\n        am = self.amax(dynamic_limit)\n        if self.mode == \"hard\":\n            return max(-am, min(am, u))\n        if self.mode == \"soft\":\n            return am * math.tanh(u / am) if am > 0 else 0.0\n        if self.mode == \"dynamic\":\n            return max(-am, min(am, u))\n        raise ValueError(f\"未知限幅模式：{self.mode}\")\n\n\n# ---------------------------------------------------------------- 积分器\ndef rk4_step(f, t, y, dt):\n    \"\"\"经典 RK4 单步：y ← y + dt/6·(k1 + 2k2 + 2k3 + k4)\n\n    Args:\n        f: 导数函数 f(t, y) -> dy/dt（y 为序列）\n        y: 状态序列\n    Returns:\n        新状态（与 y 同类型：list 或 tuple）\n    \"\"\"\n    n = len(y)\n    k1 = f(t, y)\n    y2 = [y[i] + 0.5 * dt * k1[i] for i in range(n)]\n    k2 = f(t + 0.5 * dt, y2)\n    y3 = [y[i] + 0.5 * dt * k2[i] for i in range(n)]\n    k3 = f(t + 0.5 * dt, y3)\n    y4 = [y[i] + dt * k3[i] for i in range(n)]\n    k4 = f(t + dt, y4)\n    return [y[i] + dt / 6.0 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i])\n            for i in range(n)]\n\n\ndef integrate(f, y0, dt, t_max, stop=None):\n    \"\"\"定步长积分驱动器。\n\n    Args:\n        stop: 可选终止判据 stop(t, y) -> bool\n    Returns:\n        (t_end, y_end, history)  history 为 [(t, y...), ...]\n    \"\"\"\n    y = list(y0)\n    t = 0.0\n    hist = [(t,) + tuple(y)]\n    n = int(t_max / dt)\n    for k in range(n):\n        y = rk4_step(f, t, y, dt)\n        t = (k + 1) * dt\n        hist.append((t,) + tuple(y))\n        if stop is not None and stop(t, y):\n            break\n    return t, y, hist\n\n\n# ---------------------------------------------------------------- 自检\ndef _self_test():\n    print(\"=\" * 72)\n    print(\"  dynamics 自检\")\n    print(\"=\" * 72)\n\n    # 1. 一阶延迟：解析解 vs 细分数值积分（应完全一致）\n    tau, dt = 0.1, 0.02\n    a = FirstOrderLag(tau)\n    y = 0.0\n    for _ in range(50):                      # 1 s\n        y = a.step(1.0, dt)\n    ref = FirstOrderLag(tau)                 # 细分 100 倍作为参考\n    yr = 0.0\n    for _ in range(5000):\n        yr = ref.step(1.0, dt / 100.0)\n    assert abs(y - yr) < 1e-12, f\"解析解与细分不一致：{y} vs {yr}\"\n    print(f\"  [1] 一阶延迟解析解      : dt/τ=0.2 时解析 {y:.12f} \"\n          f\"= 细分参考 {yr:.12f}  ✅\")\n\n    # 2. 时间常数验证：t = τ 时应达 63.2%\n    a = FirstOrderLag(0.1)\n    for _ in range(10):                      # 10 × 0.01 s = 0.1 s\n        v = a.step(1.0, 0.01)\n    assert abs(v - 0.6321205588) < 1e-4, f\"时间常数不符合一阶特性：{v}\"\n    print(f\"  [2] 阶跃响应 τ 特性     : t=τ 时输出 {v:.6f} \"\n          f\"(理论 1−e⁻¹=0.632121)  ✅\")\n\n    # 3. 大步长下解析解稳定，前向差分发散\n    a1, a2 = FirstOrderLag(0.01), FirstOrderLag(0.01)\n    v1 = v2 = 0.0\n    for _ in range(200):                     # dt = 3τ = 0.03\n        v1 = a1.step(1.0, 0.03)\n        v2 = a2.step_euler(1.0, 0.03)\n    assert abs(v1 - 1.0) < 1e-3, f\"解析解在大步长下失真：{v1}\"\n    assert abs(v2) > 1e3, f\"前向差分未发散，对比失效：{v2}\"\n    print(f\"  [3] 大步长 dt=3τ        : 解析解 {v1:.6f}（收敛）vs \"\n          f\"前向差分 {v2:.3e}（发散）✅\")\n\n    # 4. 三种限幅模式\n    xs = [0.5, 1.0, 2.0, 10.0]\n    for mode, lim in ((\"hard\", 1.0), (\"soft\", 1.0)):\n        L = Limiter(lim, mode=mode)\n        outs = [L(x) for x in xs]\n        assert all(abs(o) <= lim + 1e-12 for o in outs), f\"{mode} 越限：{outs}\"\n        print(f\"  [4] 限幅 {mode:5s}(u_max=1)   : \"\n              + \" \".join(f\"{o:.4f}\" for o in outs) + \"  ✅\")\n    L = Limiter(1.0, mode=\"soft\")\n    assert L(0.5) > 0.5 * 0.9 and L(0.5) < 0.5, \"软限幅在小信号处应接近线性\"\n    print(\"       ⇒ 软限幅小信号接近线性、大信号平滑饱和 ✅\")\n\n    # 5. 降额裕度\n    L = Limiter(10.0, mode=\"hard\", margin=0.8)\n    assert L(100.0) == 8.0, f\"20% 裕度未生效：{L(100.0)}\"\n    print(f\"  [5] 设计裕度 margin=0.8  : u=100 → {L(100.0):.1f}\"\n          f\"（限幅 10 降额至 8，卡 A-04 建议留 20%~30%）✅\")\n\n    # 6. RK4 四阶精度：简谐运动，步长减半误差应降约 16 倍\n    #    （积分时长取 2 s，避免长时间累积使大步长脱离渐近收敛区）\n    def f(t, y):                             # y = [x, v], ẍ = −x\n        return [y[1], -y[0]]\n\n    errs = []\n    for dt in (0.4, 0.2, 0.1):\n        _, y, _ = integrate(f, [1.0, 0.0], dt, 2.0)\n        errs.append(abs(y[0] - math.cos(2.0)))\n    ratios = [errs[i] / errs[i + 1] for i in range(len(errs) - 1)]\n    assert all(r > 14.0 for r in ratios), f\"RK4 未达四阶精度：{ratios}\"\n    print(\"  [6] RK4 收敛阶          : 步长减半误差比 \"\n          + \" / \".join(f\"{r:.1f}\" for r in ratios)\n          + f\"（理论 16，末值误差 {errs[-1]:.2e}）✅\")\n\n    # 7. 常加速度积分应解析精确\n    def fc(t, y):\n        return [y[1], 5.0]\n    _, y7, _ = integrate(fc, [0.0, 0.0], 0.1, 2.0)\n    assert abs(y7[0] - 0.5 * 5.0 * 4.0) < 1e-12, f\"常加速度积分不精确：{y7[0]}\"\n    print(f\"  [7] 常加速度积分        : x(2s) = {y7[0]:.12f} \"\n          f\"(解析 10.0)  ✅\")\n\n    # 8. 终止判据\n    def fs(t, y):\n        return [1.0]\n    t_end, y_end, hist = integrate(fs, [0.0], 0.1, 100.0,\n                                   stop=lambda t, y: y[0] >= 2.0)\n    assert 1.9 <= y_end[0] <= 2.2 and t_end < 100.0\n    print(f\"  [8] 终止判据            : 在 t={t_end:.2f}s 停止，\"\n          f\"y={y_end[0]:.2f}（目标 2.0）✅\")\n\n    print(\"=\" * 72)\n    print(\"  dynamics：8 项自检全部通过\")\n    print(\"=\" * 72)\n\n\nif __name__ == \"__main__\":\n    _self_test()\n", "size": 8490}, {"path": "algorithms/guidance_laws.py", "kind": "py", "text": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nguidance_laws.py — 制导律算法库\n\n统一接口 + 注册表，10 种制导律可互换、可参数化（呼应 MBSE「同一接口下的\n策略变体」建模思想）。所有公式均标注对应的 RIA++ 卡片编号，与\nassets/02_formulas.md 一一对应。\n\n核心接口\n--------\n    a_cmd = LAWS[name](geom, **params)        # 标量，沿视线法向 n̂\n\nGeom 由 engagement / 用户自行构造。指令加速度矢量：\n    - TPN 系：a_vec = a_cmd · n̂      （n̂ ⊥ 视线）\n    - PPN 系：a_vec = a_cmd · v̂n     （v̂n ⊥ 导弹速度）\n\n纯标准库。自检：python3 guidance_laws.py\n\"\"\"\nimport math\nfrom math import atan2, cos, hypot, sin\n\nfrom gnc_core import (closing_velocity, collision_heading, cpa_miss, los,\n                      los_normal, los_rate, vec_norm, vec_sub, wrap_pi, zem)\n\nG = 9.80665\n\n# ---------------------------------------------------------------- 几何快照\nclass Geom:\n    \"\"\"制导几何快照（每步由仿真器填充）。\"\"\"\n\n    __slots__ = (\"r\", \"rdot\", \"vm\", \"vt\", \"Vm\", \"Vc\", \"lam\", \"lamdot\",\n                 \"t_go\", \"a_t_perp\", \"theta_m\", \"theta_d\", \"zem\")\n\n    def __init__(self, m_pos, m_vel, t_pos, t_vel, a_t_perp=0.0,\n                 theta_d=None):\n        self.r = vec_sub(t_pos, m_pos)\n        self.rdot = vec_sub(t_vel, m_vel)\n        self.vm = m_vel\n        self.vt = t_vel\n        self.Vm = vec_norm(m_vel)\n        self.Vc = closing_velocity(self.r, self.rdot)\n        self.lam = atan2(self.r[1], self.r[0])\n        self.lamdot = los_rate(self.r, self.rdot)\n        self.a_t_perp = a_t_perp\n        self.theta_m = atan2(m_vel[1], m_vel[0])\n        self.theta_d = self.lam if theta_d is None else theta_d\n        self.t_go = self._tgo()\n        self.zem = zem(self.r, self.rdot, self.t_go)\n\n    def _tgo(self, lo=0.1, hi=10.0):\n        if self.Vc <= 1e-6:\n            return hi\n        t = vec_norm(self.r) / self.Vc\n        for _ in range(3):\n            t = (vec_norm(self.r) + 0.5 * self.a_t_perp * t * t) / self.Vc\n        return max(lo, min(hi, t))\n\n\n# ---------------------------------------------------------------- 制导律实现\ndef law_tpn(g, N=4.0):\n    \"\"\"真比例导引 TPN：a = N·Vc·λ̇（指令 ⊥ 视线）\n\n    卡 A-01。工程默认 N=3~5；抗机动能力强，大气层外/反导首选。\n    \"\"\"\n    return N * g.Vc * g.lamdot\n\n\ndef law_ppn(g, N=4.0):\n    \"\"\"纯比例导引 PPN：a = N·Vm·λ̇（指令 ⊥ 导弹速度）\n\n    卡 A-01。⚠️ 其 N 与 TPN 物理意义不同，需取 6~10 才有类似效果。\n    \"\"\"\n    return N * g.Vm * g.lamdot\n\n\ndef law_apn(g, N=4.5, est_err=0.0):\n    \"\"\"增广比例导引 APN：a = N·Vc·λ̇ + (N/2)·â_T⊥\n\n    卡 B-03 / A-05。对常值机动目标理论零脱靶。\n    ⚠️ est_err > 0.3 时可能劣于 PN；>0.5 反而更差（仿真已验证）。\n    \"\"\"\n    a_t = g.a_t_perp * (1.0 - est_err)      # 估计误差：低估补偿量\n    return N * g.Vc * g.lamdot + 0.5 * N * a_t\n\n\ndef law_bpn(g, N=4.0, K_bias=0.0, theta_ref=None):\n    \"\"\"偏置比例导引 BPN：a = N·V·λ̇ + K_bias·(θ_cur − θ_ref)\n\n    卡 C-02。用于视场/框架角与终端角约束：把弹道姿态拉向参考角。\n    K_bias=0 时退化为 PN。\n    \"\"\"\n    ref = g.lam if theta_ref is None else theta_ref\n    return N * g.Vm * g.lamdot + K_bias * (g.theta_m - ref)\n\n\ndef law_ogl(g, N=3.0):\n    \"\"\"最优制导律 OGL：a = N·ZEM/t_go²\n\n    卡 B-02 / C-02。ZEM 为零控脱靶量；N=3 时与 PN 等价（线性化意义下），\n    但对 t_go 估计精度敏感。\n    \"\"\"\n    if g.t_go <= 1e-6:\n        return 0.0\n    return N * g.zem / (g.t_go * g.t_go)\n\n\ndef law_impact_angle(g, N1=6.0, N2=2.0, N3=1.0, theta_d=None):\n    \"\"\"落角约束制导：a = N₁·y/t_go² + N₂·ẏ/t_go + N₃·Vm(θ_m−θ_d)/t_go\n\n    卡 C-05。y/ẏ 为视线法向的相对位移与速度分量。\n    \"\"\"\n    tg = max(g.t_go, 1e-3)\n    n = los_normal(g.r)\n    y = n[0] * g.r[0] + n[1] * g.r[1]\n    ydot = n[0] * g.rdot[0] + n[1] * g.rdot[1]\n    td = g.lam if theta_d is None else theta_d\n    return (N1 * y / (tg * tg) + N2 * ydot / tg\n            + N3 * g.Vm * wrap_pi(g.theta_m - td) / tg)\n\n\ndef law_fov_barrier(g, N=4.0, k=0.5, lam_max=0.5236):\n    \"\"\"视场约束制导（Barrier Lyapunov）：\n        λ̇_des = −k·λ·(λ_max² − λ²)²，a = N·Vc·(λ̇ − λ̇_des)\n\n    卡 C-02。λ 逼近 λ_max 时屏障项急剧增大，把视线角推回中心，\n    保证全程 |λ| < λ_max（视场不丢失）。\n    \"\"\"\n    lm2 = lam_max * lam_max\n    lam = wrap_pi(g.lam)\n    if abs(lam) >= lam_max:\n        lam = (lam_max - 1e-6) * (1.0 if lam > 0 else -1.0)\n    ld_des = -k * lam * ((lm2 - lam * lam) ** 2)\n    return N * g.Vc * (g.lamdot - ld_des)\n\n\ndef law_smc(g, k=3.0, eps=0.5, c=1.0, phi=0.05):\n    \"\"\"滑模制导 SMC：s = λ̇ + c·λ，u = −k·s − ε·sat(s/Φ)\n\n    卡 E-02 / E-04。sat() 为边界层饱和函数，抑制抖振。\n    对目标机动与参数摄动强鲁棒；Φ 越小越接近理想滑模但抖振越大。\n    \"\"\"\n    s = g.lamdot + c * wrap_pi(g.lam)\n    sat = s / phi if abs(s) < phi else (1.0 if s > 0 else -1.0)\n    return -(k * s + eps * sat) * max(g.Vc, 1.0)\n\n\ndef law_pure_pursuit(g, K=4.0):\n    \"\"\"纯追踪：a = K·Vm·(λ − θ_m)，指令指向目标当前位置\n\n    卡 A-01（对比基线）。末端需用过载大，仅作对照。\n    \"\"\"\n    return K * g.Vm * wrap_pi(g.lam - g.theta_m)\n\n\ndef law_predictive(g, a_t_est=0.0, Kp=1.0):\n    \"\"\"预测制导 PG：瞄准预测命中点\n        P_pred = P_T + V_T·t_go + ½·Â_T·t_go²\n\n    卡 A-06。对常值机动目标天然有前馈能力，但依赖 t_go 与 â_T 精度。\n    \"\"\"\n    n = los_normal(g.r)\n    px = g.r[0] + g.vt[0] * g.t_go + 0.5 * a_t_est * n[0] * g.t_go ** 2\n    py = g.r[1] + g.vt[1] * g.t_go + 0.5 * a_t_est * n[1] * g.t_go ** 2\n    lam_p = atan2(py, px)\n    return Kp * g.Vm * wrap_pi(lam_p - g.theta_m) / max(g.t_go, 0.1)\n\n\n# ---------------------------------------------------------------- 注册表\nLAWS = {\n    \"TPN\":           (law_tpn,          {\"N\": 4.0},\n                      \"真比例导引 a=N·Vc·λ̇（⊥视线）｜卡 A-01\"),\n    \"PPN\":           (law_ppn,          {\"N\": 4.0},\n                      \"纯比例导引 a=N·Vm·λ̇（⊥速度）｜卡 A-01\"),\n    \"APN\":           (law_apn,          {\"N\": 4.5, \"est_err\": 0.0},\n                      \"增广比例导引 a=N·Vc·λ̇+(N/2)â_T｜卡 B-03\"),\n    \"BPN\":           (law_bpn,          {\"N\": 4.0, \"K_bias\": 0.0,\n                                         \"theta_ref\": None},\n                      \"偏置比例导引 a=N·V·λ̇+K(θ−θ_ref)｜卡 C-02\"),\n    \"OGL\":           (law_ogl,          {\"N\": 3.0},\n                      \"最优制导律 a=N·ZEM/t_go²｜卡 B-02\"),\n    \"IMPACT_ANGLE\":  (law_impact_angle, {\"N1\": 6.0, \"N2\": 2.0, \"N3\": 1.0,\n                                         \"theta_d\": None},\n                      \"落角约束 a=N₁y/t²+N₂ẏ/t+N₃Vm(θ−θ_d)/t｜卡 C-05\"),\n    \"FOV_BARRIER\":   (law_fov_barrier,  {\"N\": 4.0, \"k\": 0.5,\n                                         \"lam_max\": 0.5236},\n                      \"视场屏障 λ̇_des=−kλ(λ_max²−λ²)²｜卡 C-02\"),\n    \"SMC\":           (law_smc,          {\"k\": 3.0, \"eps\": 0.5, \"c\": 1.0,\n                                         \"phi\": 0.05},\n                      \"滑模 s=λ̇+cλ, u=−ks−ε·sat(s/Φ)｜卡 E-02/04\"),\n    \"PURE_PURSUIT\":  (law_pure_pursuit, {\"K\": 4.0},\n                      \"纯追踪 a=K·Vm(λ−θ_m)｜卡 A-01 基线\"),\n    \"PREDICTIVE\":    (law_predictive,   {\"a_t_est\": 0.0, \"Kp\": 1.0},\n                      \"预测制导 瞄准 P_pred｜卡 A-06\"),\n}\n\n\ndef command(name, geom, **params):\n    \"\"\"按名称调用制导律（缺省参数自动补齐）。\"\"\"\n    fn, defaults, _ = LAWS[name]\n    p = dict(defaults)\n    p.update(params)\n    return fn(geom, **p)\n\n\ndef accel_vector(a_cmd, geom, variant=\"TPN\"):\n    \"\"\"把标量指令映射到加速度矢量。\n\n    TPN 系：沿视线法向 n̂ = (−sin λ, cos λ)\n    PPN 系：沿速度法向 v̂n = (−sin θ_m, cos θ_m)\n    \"\"\"\n    if variant == \"PPN\":\n        ang = geom.theta_m\n    else:\n        ang = geom.lam\n    return (-sin(ang) * a_cmd, cos(ang) * a_cmd)\n\n\n# ---------------------------------------------------------------- 最小仿真器（自检用）\ndef _mini_sim(law_name, N=4.0, t_break=1e9, a_t=0.0, dt=0.001,\n              amax=1e9, t_max=60.0, v_t=(-200.0, 0.0), **kw):\n    \"\"\"极简欧拉仿真（仅自检用，正式仿真见 engagement.py）。\n\n    返回 (脱靶量 m, 峰值过载 g, 是否命中)\n    \"\"\"\n    from gnc_core import collision_heading\n\n    mt = (6000.0, 500.0)\n    vmx, vmy, _ = collision_heading(mt, v_t, 700.0)\n    m = [0.0, 0.0, vmx, vmy]\n    tpos = [mt[0], mt[1]]\n    tvel = list(v_t)\n    peak, r_old = 0.0, vec_norm((mt[0], mt[1]))\n    n_man = None          # 目标机动方向（惯性系固定，t_break 时锁定）\n\n    for step in range(int(t_max / dt)):\n        t = step * dt\n        if t >= t_break:\n            if n_man is None:\n                n_man = los_normal((tpos[0] - m[0], tpos[1] - m[1]))\n            tvel[0] += a_t * n_man[0] * dt\n            tvel[1] += a_t * n_man[1] * dt\n        tpos[0] += tvel[0] * dt\n        tpos[1] += tvel[1] * dt\n\n        # 目标加速度在「当前视线法向」的投影（APN 补偿量）\n        a_perp = 0.0\n        if n_man is not None:\n            n_now = los_normal((tpos[0] - m[0], tpos[1] - m[1]))\n            a_perp = a_t * (n_man[0] * n_now[0] + n_man[1] * n_now[1])\n        g = Geom((m[0], m[1]), (m[2], m[3]), tuple(tpos), tuple(tvel),\n                 a_t_perp=a_perp)\n        a = command(law_name, g, N=N, **kw)\n        a = max(-amax, min(amax, a))\n        peak = max(peak, abs(a))\n        av = accel_vector(a, g, \"PPN\" if law_name == \"PPN\" else \"TPN\")\n        m[2] += av[0] * dt\n        m[3] += av[1] * dt\n        m[0] += m[2] * dt\n        m[1] += m[3] * dt\n\n        r_now = hypot(tpos[0] - m[0], tpos[1] - m[1])\n        if r_now > r_old and r_now > 20.0:      # 越过最近点\n            break\n        r_old = r_now\n        if r_now < 0.3:\n            break\n    miss = cpa_miss((tpos[0] - m[0], tpos[1] - m[1]),\n                    (tvel[0] - m[2], tvel[1] - m[3]))\n    return miss, peak / G\n\n\n# ---------------------------------------------------------------- 自检\ndef _self_test():\n    print(\"=\" * 70)\n    print(\"  guidance_laws 自检（最小欧拉仿真，dt=1 ms）\")\n    print(\"=\" * 70)\n\n    # 1. 注册表完整性\n    assert len(LAWS) == 10\n    print(f\"  [1] 制导律注册表       : {len(LAWS)} 种 \"\n          f\"({', '.join(LAWS)})  ✅\")\n\n    # 2. 理想工况（碰撞三角 + 非机动目标）：PN 应零脱靶\n    m, pk = _mini_sim(\"TPN\", N=4.0)\n    assert m < 0.5, f\"TPN 理想脱靶过大：{m}\"\n    print(f\"  [2] TPN 理想工况       : 脱靶 {m:.4f} m / 峰值 {pk:.4f} g  ✅\")\n\n    # 3. OGL(N=3) 与 PN(N=3) 在相同工况下量级一致（理论等价）\n    m_o, _ = _mini_sim(\"OGL\", N=3.0)\n    m_p, _ = _mini_sim(\"TPN\", N=3.0)\n    assert abs(m_o - m_p) < 0.5\n    print(f\"  [3] OGL(N=3) ≈ PN(N=3) : {m_o:.4f} m vs {m_p:.4f} m  ✅\")\n\n    # 4. APN 对常值机动目标显著优于 PN（同 N 对比，过载受限工况）\n    kw = dict(t_break=5.0, a_t=12.0 * G, amax=20.0 * G)\n    m_pn, _ = _mini_sim(\"TPN\", N=4.5, **kw)\n    m_ap, _ = _mini_sim(\"APN\", N=4.5, **kw)\n    assert m_ap < m_pn, f\"APN 未优于 PN：{m_ap} vs {m_pn}\"\n    print(f\"  [4] APN vs PN（同N=4.5）: PN {m_pn:.3f} m → APN {m_ap:.3f} m  ✅\")\n\n    # 5. APN 估计误差敏感性（应单调恶化；100% 误差即退化为 PN）\n    kw = dict(t_break=4.0, a_t=12.0 * G, amax=20.0 * G)\n    e_vals = (0.0, 0.3, 0.5, 1.0)\n    v = [_mini_sim(\"APN\", N=4.5, est_err=e, **kw)[0] for e in e_vals]\n    assert all(v[i + 1] >= v[i] - 1e-3 for i in range(len(v) - 1)), \\\n        f\"估计误差未单调恶化：{v}\"\n    print(\"  [5] APN 估计误差敏感性 : \"\n          + \" → \".join(f\"{int(e*100)}% {m:.3f}m\" for e, m in zip(e_vals, v))\n          + \"  单调恶化 ✅\")\n\n    # 5b. APN 的价值几乎全部来自「过载受限」场景\n    gains = []\n    for am in (20.0, 40.0, 1e9):\n        kk = dict(t_break=4.0, a_t=12.0 * G, amax=am * G if am < 1e8 else am)\n        pn = _mini_sim(\"TPN\", N=4.5, **kk)[0]\n        ap = _mini_sim(\"APN\", N=4.5, **kk)[0]\n        gains.append(pn - ap)\n    assert gains[0] > gains[1] > gains[2], f\"APN 收益未随限幅放宽而减小：{gains}\"\n    print(\"  [5b]APN 收益 vs 过载限幅: 20g 收益 %.3f m → 40g %.3f m → \"\n          \"不受限 %.3f m\\n\"\n          \"       ⇒ 过载不受限时 PN 已足够，上 APN 无收益（卡 A-05\"\n          \"「别一上来就上 APNG」） ✅\" % tuple(gains))\n\n    # 6. BPN（偏置比例导引）：终端落角约束与框架角压制（卡 C-02）\n    from gnc_core import collision_heading\n    import math\n\n    def _run_bpn(K_bias, theta_ref=-1.0, R0=6000.0, heading_err=0.0,\n                 amax=1e9, r_stop=150.0):\n        mt, v_t = (R0 * 0.96, R0 * 0.28), (-200.0, 0.0)\n        vmx, vmy, _ = collision_heading(mt, v_t, 700.0)\n        if heading_err:\n            c, s = math.cos(heading_err), math.sin(heading_err)\n            vmx, vmy = vmx * c - vmy * s, vmx * s + vmy * c\n        m = [0.0, 0.0, vmx, vmy]\n        tpos, tvel = list(mt), list(v_t)\n        dt = 0.001\n        for _ in range(30000):\n            g = Geom((m[0], m[1]), (m[2], m[3]), tuple(tpos), tuple(tvel))\n            a = command(\"BPN\", g, N=4.0, K_bias=K_bias, theta_ref=theta_ref)\n            a = max(-amax, min(amax, a))\n            av = accel_vector(a, g)\n            m[2] += av[0] * dt; m[3] += av[1] * dt\n            m[0] += m[2] * dt; m[1] += m[3] * dt\n            tpos[0] += tvel[0] * dt; tpos[1] += tvel[1] * dt\n            if math.hypot(tpos[0] - m[0], tpos[1] - m[1]) < r_stop:\n                return math.atan2(m[3], m[2]), abs(wrap_pi(g.lam - g.theta_m))\n        return math.atan2(m[3], m[2]), 9.99\n\n    ref = -1.0                       # 期望落角 −57.3°\n    errs, gims = [], []\n    for K in (0.0, 50.0, 100.0, 200.0):\n        th, gm = _run_bpn(K, theta_ref=ref)\n        errs.append(abs(wrap_pi(th - ref)))\n        gims.append(gm)\n    assert all(errs[i + 1] < errs[i] for i in range(len(errs) - 1)), \\\n        f\"落角误差未随 K_bias 单调下降：{[math.degrees(e) for e in errs]}\"\n    print(\"  [6] BPN 落角约束（θ_ref=−57.3°）: K_bias 0→200，终端角误差 \"\n          + \" → \".join(f\"{math.degrees(e):.1f}°\" for e in errs) + \" ✅\")\n    assert gims[-1] > gims[0], \"K_bias 过大未导致框架角恶化\"\n    print(f\"       ⚠️ 但框架角 {math.degrees(gims[0]):.1f}° → \"\n          f\"{math.degrees(gims[-1]):.1f}°：K_bias 过大会压弯弹道，需权衡 ✅\")\n\n    # 6b. 短 t_go + 大航向误差下的框架角压制\n    gs = [_run_bpn(K, theta_ref=None, R0=1500.0,\n                   heading_err=math.radians(25.0))[1]\n          for K in (0.0, 30.0, 60.0, 120.0)]\n    assert all(gs[i + 1] < gs[i] for i in range(len(gs) - 1)), \\\n        f\"框架角未单调下降：{[math.degrees(x) for x in gs]}\"\n    print(\"  [6b]BPN 压框架角（短t_go+25°误差）: \"\n          + \" → \".join(f\"{math.degrees(x):.2f}°\" for x in gs) + \" ✅\")\n\n    # 7. 零视线角速率时指令应为零（除含偏置/落角项者）\n    mt, v_t = (6000.0, 500.0), (-200.0, 0.0)\n    from gnc_core import collision_heading\n    vmx, vmy, _ = collision_heading(mt, v_t, 700.0)\n    g = Geom((0.0, 0.0), (vmx, vmy), mt, v_t)\n    assert abs(g.lamdot) < 1e-9\n    for name in (\"TPN\", \"PPN\", \"OGL\"):\n        a = command(name, g)\n        assert abs(a) < 1.0, f\"{name} 在 λ̇=0 时指令非零：{a}\"\n    print(\"  [7] λ̇=0 时零指令       : TPN/PPN/OGL 均 <1 m/s²  ✅\")\n\n    # 8. FOV 屏障（Barrier Lyapunov，卡 C-02）\n    lm2, k, lmax = 0.6 * 0.6, 0.5, 0.6\n    des = [-k * L * ((lm2 - L * L) ** 2) for L in (0.1, 0.3, 0.45, 0.55, 0.59)]\n    # (a) 恒回中：λ̇_des 与 λ 反向\n    assert all(d < 0 for d in des), f\"λ̇_des 未恒回中：{des}\"\n    # (b) 屏障特性：|λ̇_des| 先增大后随 λ→λ_max 衰减到 0\n    assert abs(des[1]) > abs(des[0]) and abs(des[-1]) < abs(des[1])\n    print(f\"  [8] FOV 屏障 λ̇_des      : λ=0.1→{des[0]:+.4f}  λ=0.3→{des[1]:+.4f}\"\n          f\"  λ=0.59→{des[-1]:+.6f}\\n\"\n          f\"       ⇒ 恒回中，且 λ→λ_max 时冻结视线（Barrier 特性） ✅\")\n\n    # 8b. 端到端：视场守住 vs 脱靶代价\n    def _run_fov(law, heading_err, **kw):\n        mt = (6000.0 * math.cos(0.45), 6000.0 * math.sin(0.45))\n        vmx, vmy, _ = collision_heading(mt, (-200.0, 0.0), 700.0)\n        c, s = math.cos(heading_err), math.sin(heading_err)\n        m = [0.0, 0.0, vmx * c - vmy * s, vmx * s + vmy * c]\n        tpos, tvel = list(mt), [-200.0, 0.0]\n        mx, mr = 0.0, 1e9\n        for _ in range(20000):\n            g = Geom((m[0], m[1]), (m[2], m[3]), tuple(tpos), tuple(tvel))\n            mx = max(mx, abs(wrap_pi(g.lam)))\n            r = hypot(tpos[0] - m[0], tpos[1] - m[1])\n            mr = min(mr, r)\n            if r < 5.0:\n                break\n            av = accel_vector(command(law, g, **kw), g)\n            m[2] += av[0] * 1e-3; m[3] += av[1] * 1e-3\n            m[0] += m[2] * 1e-3; m[1] += m[3] * 1e-3\n            tpos[0] += tvel[0] * 1e-3; tpos[1] += tvel[1] * 1e-3\n        return mx, mr\n\n    he = math.radians(-40.0)\n    pn_l, pn_m = _run_fov(\"TPN\", he, N=4.0)\n    fv_l, fv_m = _run_fov(\"FOV_BARRIER\", he, N=4.0, k=5.0, lam_max=0.6)\n    assert pn_l > 0.6 > fv_l, f\"视场约束未生效：PN {pn_l} / FOV {fv_l}\"\n    print(f\"  [8b]视场约束（−40°误差） : TPN max|λ| {pn_l:.3f} rad（越界）→ \"\n          f\"FOV(k=5) {fv_l:.3f} rad（守住）\\n\"\n          f\"       代价：脱靶 {pn_m:.1f} m → {fv_m:.1f} m  ✅\")\n\n    # 8c. k 过大发散：屏障增益存在稳定上限\n    bad_l, bad_m = _run_fov(\"FOV_BARRIER\", he, N=4.0, k=20.0, lam_max=0.6)\n    assert bad_l > 1.0 or bad_m > 100.0, f\"k=20 未发散，与扫描结果不符：{bad_l}\"\n    print(f\"  [8c]屏障增益上限        : k=20 → max|λ| {bad_l:.3f} rad / \"\n          f\"脱靶 {bad_m:.0f} m（发散）⇒ k 须标定，非越大越好 ✅\")\n\n    # 9. 全部制导律可调用且不产生 NaN（λ=0.3 rad，位于视场内）\n    g2 = Geom((0.0, 0.0), (700.0, 0.0), (1000.0, 309.0), (0.0, 0.0))\n    for name in LAWS:\n        a = command(name, g2)\n        assert not math.isnan(a) and not math.isinf(a), f\"{name} 产生非法值\"\n    print(\"  [9] 10 种律数值健全性  : 无 NaN/Inf  ✅\")\n\n    print(\"=\" * 70)\n    print(\"  guidance_laws：9 项自检全部通过（10 种制导律）\")\n    print(\"=\" * 70)\n\n\nif __name__ == \"__main__\":\n    _self_test()\n", "size": 18767}, {"path": "algorithms/seeker.py", "kind": "py", "text": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nseeker.py — 导引头与噪声模型\n\n本模块固化了 book010 蒸馏中最重要的一条建模经验：\n\n    ⚠️ 「N 是噪声放大器」的结论，只在【角度噪声 + 滤波微分】模型下成立。\n\n    速率噪声模型（直接在 λ̇ 上叠平谱噪声）\n        → 回路带宽越高抑制越好 → 脱靶量随 N **下降**（与教科书相反）\n    角度噪声模型（测角噪声 σ_λ → 一阶滤波微分求 λ̇）  ← 真实导引头\n        → 微分使噪声谱变「蓝」→ 回路带宽（∝N）越高吃得越多\n        → 脱靶量随 N **上升**（教科书效应）\n\n    若仿真中得出与教科书相反的结论，先查是不是用错了噪声模型。\n\n组件\n----\n    ColoredNoise : AR(1) 高斯–马尔可夫有色噪声，统计特性与步长 dt 无关\n    Seeker       : 导引头（测角噪声 / 滤波微分 / 速率噪声 / 视场 / 框架角）\n\n纯标准库。自检：python3 seeker.py\n\"\"\"\nimport math\nimport random\n\nfrom gnc_core import wrap_pi\n\n__all__ = [\"ColoredNoise\", \"Seeker\", \"rad\", \"deg\"]\n\nG = 9.80665\n\n\ndef rad(x):\n    return x * 0.017453292519943295\n\n\ndef deg(x):\n    return x * 57.29577951308232\n\n\n# ---------------------------------------------------------------- 有色噪声\nclass ColoredNoise:\n    \"\"\"AR(1) 高斯–马尔可夫有色噪声：n ← φ·n + σ·√(1−φ²)·N(0,1)\n\n    关键性质：φ = exp(−dt/τ) 使稳态方差恒为 σ²，**与积分步长 dt 无关**。\n    （若用「每步独立白噪声」，噪声功率谱会随 dt 变化，导致换步长后\n     仿真结论不可复现 —— 这是蒙特卡洛结果不可信的常见根因。）\n    \"\"\"\n\n    def __init__(self, sigma=0.0, tau=0.02, seed=None):\n        self.sigma = sigma\n        self.tau = tau\n        self.rng = random.Random(seed)\n        self.state = 0.0\n\n    def reset(self):\n        self.state = 0.0\n\n    def step(self, dt):\n        \"\"\"推进一步，返回噪声样本。\"\"\"\n        if self.sigma <= 0.0:\n            return 0.0\n        phi = math.exp(-dt / self.tau) if self.tau > 0 else 0.0\n        self.state = (self.state * phi\n                      + self.sigma * math.sqrt(1.0 - phi * phi)\n                      * self.rng.gauss(0.0, 1.0))\n        return self.state\n\n\n# ---------------------------------------------------------------- 导引头\nclass Seeker:\n    \"\"\"导引头模型（测角 → 滤波微分 → λ̇ 估计）。\n\n    Args:\n        sigma_lam: 测角噪声标准差（rad）。典型 1 mrad（闪烁/热噪声）\n        tau_f: λ̇ 一阶滤波微分时间常数（s）。本工况最优 ≈20 ms\n        rate_noise: 速率噪声模型下的 λ̇ 噪声强度（rad/s）；>0 时启用\n                    （此模型会得出与教科书相反的结论，仅供对比）\n        noise
