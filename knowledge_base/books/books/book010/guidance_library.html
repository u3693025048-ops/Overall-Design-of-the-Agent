 方程 — 最优导航比 N=3 的由来与权重矩阵选取》\n\n\n**执行机构延迟必须先进模型再调参**（C2 第10章）。作者的 LQR 制导律数字仿真很好，一上硬件就抖，查出是执行机构延迟没建模，\"加了一个一阶延迟环节重新调参才解决\"。\n\n\n### `H080` \"冻结系数\"近似要验证\n\n\n> 出处：B-02 《LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取》\n\n\n**\"冻结系数\"近似要验证**（C4 第4章）。$A$ 矩阵因 $R,\\dot R$ 时变而时变，工程上常在某时刻冻结处理，\"仿真时一定要验证这个近似的有效性\"。\n\n\n### `H081` $S$ 的量级\n\n\n> 出处：B-02 《LQR 与 Riccati 方程 — 最优导航比 N=3 的由来与权重矩阵选取》\n\n\n**$S$ 的量级**（C1 第3章 $S=100\\cdot I$；C2 第11章 \"$S$ 一般取 $R$ 的 10~100 倍\"；C2 第10章 \"先固定 $s\\approx100$，再调 $q/r$ 比例，从 10 开始试\"）。**但 $S$ 不是越大越好**——C2 第11章：\"$S$ 太大会导致控制量在末端剧烈变化，仿真完美、一上实物抖得跟筛子似的。\"\n\n\n### `H082` APN 的实测收益\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**APN 的实测收益**（C2 第9章，脱靶量 PN→APN）：目标匀速直线 0.8→0.7 m（仅 12%）；**3g 横向 4.2→1.1 m（74%）；5g 蛇形 8.5→2.3 m（73%）；7g 急转 15.6→4.8 m（69%）**。目标不机动时两者差别不大——**APN 的价值全在机动段**。\n\n\n### `H083` $N/2$ 这个系数不要乱改\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**$N/2$ 这个系数不要乱改**（C2 第9章）。\"有人想改成 $N/3$ 或 $N/1.5$，结果弹道振荡得一塌糊涂。\"\n\n\n### `H084` APN 的三条硬边界\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**APN 的三条硬边界**（C2 第9章）：① **估计误差超过 30% 时 APN 可能不如 PN**，作者实测 50% 误差时脱靶量比 PN 还大；② **估计延迟超过 0.2 s 补偿效果大打折扣**，甚至帮倒忙；③ **APN 的 $N$ 取 4~6（建议 4.5），比 PN 的 3~5 更苛刻**。\n\n\n### `H085` 卡尔曼滤波的加速度噪声协方差宁可设大一点\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**卡尔曼滤波的加速度噪声协方差宁可设大一点**（C2 第9章）。作者\"滤波器收敛得太稳，目标一机动估计值滞后 0.5 秒，导弹直接飞过\"。C2 第20章同款教训：为追求平滑把 $Q$ 设得特别小，目标机动时指令滞后整整 0.5 秒。\n\n\n### `H086` 调参顺序\"先 $R$ 后 $Q$\"\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**调参顺序\"先 $R$ 后 $Q$\"**，且 **\"Q 和 R 的比值比绝对值更重要\"**（C2 第20章）——先按传感器手册定 $R$，再调 $Q$。\n\n\n### `H087` EKF 的雅可比矩阵必须符号推导 + 数值验证\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**EKF 的雅可比矩阵必须符号推导 + 数值验证**（C2 第20章）。作者手算雅可比漏了一项，滤波器在机动时刻直接发散，查了三天；另一次是一个偏导数符号写反。\n\n\n### `H088` 没有万能的目标模型\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**没有万能的目标模型**（C2 第4章）。用匀速模型跟高机动战斗机 → 滤波发散得一塌糊涂；反过来用当前统计模型跟匀速直线目标，\"因为模型过于复杂，反而引入了不必要的噪声\"。**选模型要匹配实际场景**。\n\n\n### `H089` 机动检测阈值不是越灵敏越好\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**机动检测阈值不是越灵敏越好**（C2 第21章）。作者一开始把阈值设得太严，滤波器频繁重置、估计反而更差；**放宽到 99.5% 置信度，检测延迟多了 0.1 秒，整体跟踪精度反而提升**。一般取 95% 或 99%。\n\n\n### `H090` IMM 调参三原则\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**IMM 调参三原则**（C2 第21章）：**模型数 2~3 个就够**（试过 5 个，计算量翻倍、精度没提升）；**转移概率矩阵要对称**，否则概率会偏向某个模型；初始化状态估计要尽量准。作者用 IMM 稳定跟踪 5g 蛇形机动目标，效果远好于单模型。\n\n\n### `H091` 微分对策 $\\gamma$ 别设太小\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**微分对策 $\\gamma$ 别设太小**（C2 第14章）。\"把 $\\gamma$ 设得太小，导弹控制量发散，直接飞出了仿真边界。\"$\\gamma$ 代表导弹对目标机动能力的估计，**估计太乐观（$\\gamma$ 小）就会过度自信导致控制饱和；$\\gamma$ 越大越保守越稳健**，且应随目标机动强度在线调整。\n\n\n### `H092` 微分对策的价值是\"稳\"而非\"最优\"\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**微分对策的价值是\"稳\"而非\"最优\"**（C2 第14章对比实验）：PN 打正弦机动目标，脱靶量在 0.5~5 m 大幅波动；换成微分对策制导律后**稳定在 1.2 m 左右**。\"虽然单次不一定最优，但胜在稳健。\"\n\n\n### `H093` HJI 数值求解的维度灾难\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**HJI 数值求解的维度灾难**（C1 第9章）。\"状态空间超过 4 维，网格数就爆炸了。我曾经试过 6 维状态，跑了一晚上没出结果\"，后来改用稀疏网格。神经网络近似的坑是**输出在边界处震荡**，作者的解法是\"加物理约束（过载限幅、速率限幅）作为网络输出层的激活函数\"；训练数据**必须覆盖\"危险区域\"**（近距离、大角速率），否则末端策略失效。\n\n\n### `H094` 滚动时域 min-max 的时域选取\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**滚动时域 min-max 的时域选取**（C1 第9章）：预测时域 $T$ 取**剩余飞行时间的 1/3~1/2**，\"太短策略会短视\"。\n\n\n### `H095` 血的教训：仿真中目标机动上限要提高 30%\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**血的教训：仿真中目标机动上限要提高 30%**（C4 第16章）。作者在某次竞标演示中仿真脱靶量全部 <0.5 m，现场实测目标做了一个 7G 突然转弯，**三枚导弹全部脱靶**——复盘发现仿真里目标机动最大只设了 5G。\n\n\n### `H096` 滑模抖振在硬件上才暴露\n\n\n> 出处：B-03 《机动目标拦截 — 目标加速度建模、估计与微分对策制导》\n\n\n**滑模抖振在硬件上才暴露**（C4 第16章）。\"仿真里跑得好好的，一上真实舵机，抖得跟筛子似的\"，改用 $\\tanh(s/\\phi)$ 替代 sign，$\\phi$ 取 **0.1~0.5**。ESO 估计器带宽**从 10 rad/s 起步**微调。\n\n\n### `H097` 打靶法怕长积分区间\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**打靶法怕长积分区间**（C3 第4章）。作者用打靶法解高超声速再入制导\"死活不收敛\"，因为终端条件对猜测值极度敏感。**在打靶法上浪费两周，换成多重打靶两天搞定**。\n\n\n### `H098` 多重打靶段数选取原则\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**多重打靶段数选取原则**（C3 第4章）：**每段积分时间不超过系统最小时间常数的 5 倍**，兼顾稳定性与变量规模。\n\n\n### `H099` 协态初值猜测三招\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**协态初值猜测三招**（C3 第7章）：**从终端反推**（先假设简单控制律反向积分，作者\"屡试不爽\"）；**利用物理意义**给量级；**先简化到一维**找范围再推广。实在不行**用遗传算法辅助猜**——把 $\\lambda(0)$ 作优化变量、终端误差作适应度。\n\n\n### `H100` $\\lambda(0)$ 千万别给 0\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**$\\lambda(0)$ 千万别给 0**（C3 第7章）：\"曾经直接给 $\\lambda(0)=0$，积分出来终端误差巨大。\"\n\n\n### `H101` 千万不要用欧拉法解伴随方程\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**千万不要用欧拉法解伴随方程**（C3 第7章）。作者图省事用过，\"算出来的制导指令全是震荡的\"。刚性方程用 **Radau**（隐式），非刚性用 **RK45**；协态方程**从终端反向积分更稳定**。\n\n\n### `H102` 缩放是必须做的\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**缩放是必须做的**（C3 第4/7章）。\"状态是 $10^4$ 米、协态是 $10^{-3}$，不做缩放，数值误差会淹没真实解\"，建议把所有变量归一化到 $[0,1]$ 或 $[-1,1]$。\n\n\n### `H103` 雅可比要给解析的\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**雅可比要给解析的**（C3 第4章）：数值差分虽然省事但精度差，容易导致不收敛。\n\n\n### `H104` 终端条件要松弛\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**终端条件要松弛**（C3 第4章）：\"终端条件太严格，数值上根本达不到\"，作者一般加容忍度（如终端位置误差 1 m 内即算满足）。\n\n\n### `H105` 伪谱法不适合 bang-bang 和强路径约束\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**伪谱法不适合 bang-bang 和强路径约束**（C3 第8章 / C2 第16章）。作者求解一个拦截问题，\"解出来看着挺漂亮，一检查发现控制量在末端剧烈振荡\"，原因是全局多项式在非光滑处振荡。有人用伪谱法解 bang-bang 问题，**配点数加到 200 还在振荡，换回直接配点 50 个节点就搞定**。\n\n\n### `H106` 配点数从 $N=10$ 起逐步增加直到解稳定\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**配点数从 $N=10$ 起逐步增加直到解稳定**（C2 第16章）。伪谱法**本质上是开环控制**，除非算力极强否则不适合在线，更适合**离线轨迹规划或做验证基准解**。\n\n\n### `H107` 三种直接法选型\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**三种直接法选型**（C3 第8章）：问题简单/精度要求不高/实时性要求高 → 直接配点；解光滑、需高精度 → 伪谱；解有突变、约束复杂 → hp 自适应。**没有万能方法，选方法要看问题本身**。\n\n\n### `H108` CasADi 实战要点\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**CasADi 实战要点**（C3 第17章）：优先用 **MX** 变量（支持 if-else 等复杂控制流）；**CasADi 不做缩放**，状态量级差异大（位置 1000 vs 角度 0.01）时 IPOPT 收敛极慢，须先归一化；**初始猜测用线性插值**（从初态线性变化到终态）收敛最快。IPOPT 推荐参数：`tol=1e-6`、`max_iter=500`、`print_level=5`（生产环境 0）、`mu_init=1e-6`。\n\n\n### `H109` SDRE 的 $A(x)$ 分解不唯一，是最大暗坑\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**SDRE 的 $A(x)$ 分解不唯一，是最大暗坑**（C2 第16章）。作者在高超声速拦截项目中\"控制量剧烈振荡，排查两天，发现是 $A(x)$ 分解时分母项在某状态点接近零，矩阵病态\"，**强制加小正则项才解决**。且 SDRE 只能保证局部最优。\n\n\n### `H110` $\\theta$-D 是算力受限时的最优折中\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**$\\theta$-D 是算力受限时的最优折中**（C2 第16章）。某型空空导弹弹载 DSP 跑不动 SDRE，换 $\\theta$-D 后**控制周期从 10 ms 降到 1 ms 以内**，代价是精度略有损失。验证方法：**先用 SDRE 算基准解对比，误差 5% 以内即可放心用**，否则增加级数阶数。选型口诀：**算力充足→SDRE；算力受限→$\\theta$-D；离线优化→伪谱法**。\n\n\n### `H111` 步长策略决定生死\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**步长策略决定生死**（C3 第5章）。\"见过有人 $\\alpha=0.01$ 跑了 10000 步还没收敛，换 Armijo 后 200 步搞定。**千万别用固定步长跑最速下降法**。\"Armijo 的 $c$ 取 **0.1**（取 0.01 步长偏大易震荡，取 0.5 太保守）。\n\n\n### `H112` 共轭梯度要加重置\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**共轭梯度要加重置**（C3 第5章）。非二次型问题上 $\\beta_k$ 可能算成负值、方向乱掉，**每 $n$ 步重置为负梯度方向**。实测同问题：最速下降 87 步 vs 共轭梯度 **12 步**。\n\n\n### `H113` 能用解析解就别上数值优化\n\n\n> 出处：B-04 《最优制导律数值求解 — TPBVP、打靶法、伪谱法与非线性近似》\n\n\n**能用解析解就别上数值优化**（C1 第8章）。作者曾痴迷 MPC，\"结果在嵌入式平台上跑不动，计算延迟导致控制周期不稳定\"，现在的原则是\"能用解析解，就别上数值优化\"。\n\n\n### `H114` C++ 实现的性能实测数据\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**C++ 实现的性能实测数据**（C3 第20章，Eigen + OOP，i7-12700H，10 万次）：平均 **0.32 μs**、最大 **1.15 μs**、最小 0.28 μs，**全程无动态内存分配**。结论是 OOP 抽象的开销完全可忽略。\n\n\n### `H115` Eigen 的动态矩阵会在运行时分配内存\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**Eigen 的动态矩阵会在运行时分配内存**（C3 第20章）——\"这在实时系统里是致命的\"。对策：**全部用固定大小矩阵**（如 `Eigen::Vector3d`）或预分配内存池。\n\n\n### `H116` 架构上把制导律抽象成基类 + 派生类\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**架构上把制导律抽象成基类 + 派生类**（C3 第20章）：公共计算（如闭合速度）放基类，用 `std::unique_ptr` 管理对象，\"做多模式制导时靠这个技巧实现无缝切换\"。作者还强调**性能测试要看最大值而非平均值**。\n\n\n### `H117` 查表法是最划算的加速手段\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**查表法是最划算的加速手段**（C3 第15章实测）：把 `atan2` 换查表，**200 μs → 15 μs**；把 $t_{go}$ 里的开方换查表，**300 μs → 40 μs，精度损失不到 1%**。优化手段效果排序：查表 5~10 倍 > 定点替代浮点 2~4 倍 > 循环展开 1.5~3 倍 > 预计算常数 -30% > DMA（CPU 占用 -50%）。\n\n\n### `H118` 定点乘法必须加饱和\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**定点乘法必须加饱和**（C1 第18章）。作者漏了这一步，\"制导指令在边界处突然跳变，导弹差点失控。从那以后，我所有定点乘法都加饱和，宁可慢一点，也要稳一点\"。\n\n\n### `H119` 混合精度策略\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**混合精度策略**（C1 第18章）：大范围量（位置/速度）用浮点或 Q32.32，小范围高精度量（姿态角/制导系数）用 Q15，中间结果用 32/64 位。某无人机项目**计算时间 2 ms → 0.5 ms，精度损失不到 0.1%**。\n\n\n### `H120` 定点化必须逐模块验证\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**定点化必须逐模块验证**（C1 第18章）。作者一次性全定点化，\"定位误差大了 10 倍，查了三天才找到是哪个模块精度不够\"，现在要求每模块定点/浮点输出对比**误差 < 1e-3**。\n\n\n### `H121` DSP 选型要看 MAC 能力而非主频\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**DSP 选型要看 MAC 能力而非主频**（C1 第18章），且**必须留 30% 算力余量**——\"后期调试、加功能，算力需求只会涨不会降\"，作者吃过选型刚好够、甲方临时加模块导致系统瘫痪的亏。\n\n\n### `H122` Simulink 的 MATLAB Function 里不能放 bvp4c\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**Simulink 的 MATLAB Function 里不能放 bvp4c**（C3 第19章）。\"把 bvp4c 塞进去，仿真跑一步就卡死了\"——Simulink 是实时逐步求解，bvp4c 是离线迭代，**必须把控制律的解析表达式写进去**。\n\n\n### `H123` 代码生成四查\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**代码生成四查**（C3 第19章）：求解器改**固定步长**；数据类型改定点/单精度；`Transfer Fcn` 换成离散版本；MATLAB Function **避免动态内存分配**。生成后**必须做 SIL（软件在环）测试**对比结果。作者用 Signal Conversion 模块减少数据拷贝，**代码量直接降一半**。\n\n\n### `H124` Python 侧的两个签名陷阱\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**Python 侧的两个签名陷阱**（C3 第16章）：`odeint` 是 `func(state, t)`，`solve_ivp` 是 `func(t, state)`，**顺序正好相反**。制导仿真**务必设 `max_step=0.01`**（默认步长在脱靶量附近太大，拦截点计算偏差）；分母**加 `1e-6` 正则化**防除零；用 `np.float64`（作者因精度问题导致脱靶量偏差 0.5 m，排查一整天）。\n\n\n### `H125` MPC 实时化四招实测加速\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**MPC 实时化四招实测加速**（C3 第9章）：缩短预测时域 -40%、减少控制分段 -50%、**热启动 -30%**、**显式 MPC -90%以上**。预测时域取**剩余飞行时间的 30%~50%**。\n\n\n### `H126` MPC 约束的三个要点\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**MPC 约束的三个要点**（C3 第9章）：**软约束优于硬约束**（作者把过载约束设太硬，\"优化问题直接无解\"）；**约束别设成理论极限，留 10%~20% 余量**；注意约束的时序性。**热启动要配重置机制**——目标突然机动时上一解不是好初值，\"残差太大就重新用零初值算一次\"。求解器选型：**OSQP 比 SLSQP 快一个数量级**。\n\n\n### `H127` 实时系统的两个隐蔽坑\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**实时系统的两个隐蔽坑**（C3 第15章）：① **采样时间抖动**——\"以为定时器很准，结果中断响应时间有波动\"，对策是加时间戳补偿；② **测执行时间不要用 printf**，作者**用 GPIO 翻转 + 示波器**量关键函数耗时。\n\n\n### `H128` 4 弹协同的真实算力墙\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**4 弹协同的真实算力墙**（C4 第28章）：算法仿真飞快，上硬件**单步 20 ms > 制导周期 10 ms，\"算不完\"**。最终改成**\"离线预计算 + 在线查表修正\"**，牺牲一点最优性换实时性。作者的通用对策：算法降阶 / 分时复用（目标状态每 5 个制导周期更新一次，中间用预测值）/ FPGA 加速。\n\n\n### `H129` 评估指标的经验阈值\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**评估指标的经验阈值**（C1 第27章）：脱靶量 **<1 m 优秀，1~3 m 良好，3~5 m 及格**；鲁棒性 $\\sigma/\\mu$ **<0.3 优秀，0.3~0.5 良好，>0.5 需改进**；**带干扰脱靶量均值 ≤ 理想值 2 倍可接受，超过 3 倍必须回炉重调**。蒙特卡洛至少 500~1000 次，且**务必看 95% 分位数而非均值**。\n\n\n### `H130` 参数优化三法选型\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**参数优化三法选型**（C1 第28章）：GA 参数多/非线性强但后期震荡；PSO 连续参数/中等维度，实现简单收敛快；**贝叶斯优化适合仿真昂贵的场景**（几十次评估即可）。作者推荐**\"两阶段优化法\"：先用 GA/PSO 跑几十代锁定区域，再用贝叶斯精调**。PSO 用**拉丁超立方采样**初始化（比随机均匀靠谱），惯性权重 $w$ 从 **0.9 线性递减到 0.4**。实测（带落角约束制导律）：脱靶 2.3→0.8 m（65%）、最大过载 18.5→14.2 g（23%）、终端速度 680→712 m/s。\n\n\n### `H131` 最后一条，也是最重要的一条\n\n\n> 出处：B-05 《代码实现与工程化 — 离散化、实时性与在线求解可行性》\n\n\n**最后一条，也是最重要的一条**（C1 第28章）：**\"优化算法不是万能药。参数优化前先确认制导律结构是对的。结构错了，参数再优也白搭。\"**\n\n\n### `H132` 优先级排序：命中精度 > 时间协同 > 角度协同 > 空间协同\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**优先级排序：命中精度 > 时间协同 > 角度协同 > 空间协同**（C4 第5章）。作者的解耦策略是\"**先解耦，再协同**\"：分层设计（上层协同规划、下层跟踪控制）+ 给每个约束加松弛变量避免死锁。\n\n\n### `H133` 时间协同的误差容忍度只有 0.1~0.5 s\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**时间协同的误差容忍度只有 0.1~0.5 s**（C4 第5章）——\"别追求绝对同时，工程上做不到也没必要\"。\n\n\n### `H134` 角度约束要做软约束\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**角度约束要做软约束**（C4 第5章）。作者\"角度约束加得太硬，导致弹道过度弯曲、能量消耗太大\"。\n\n\n### `H135` 空间协同一定要容忍通信延迟\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**空间协同一定要容忍通信延迟**（C4 第5章）。曾因忽略延迟导致\"导弹之间互相等待，队形一直收敛不了\"，对策是加**容忍窗口——相对位置误差 10 m 内即视为队形已形成**。\n\n\n### `H136` 通信频率至少 10 Hz\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**通信频率至少 10 Hz**（C4 第7章）。作者设成 1 Hz，\"导弹都快到目标了还没达成一致\"。\n\n\n### `H137` 时延是第一个拦路虎\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**时延是第一个拦路虎**（C4 第13章）：**时延从 10 ms 增到 50 ms，收敛时间从 2 秒变成 8 秒**。工程建议：**通信时延控制在控制周期的 1/5 以内**（周期 50 ms → 时延 ≤10 ms）。补偿用卡尔曼预测。\n\n\n### `H138` 丢包率超过 40% 时大多数一致性协议失效，按 20% 做冗余设计\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**丢包率超过 40% 时大多数一致性协议失效，按 20% 做冗余设计**（C4 第13章）。作者设 30% 随机丢包时\"部分导弹的制导指令开始漂移，脱靶量大了好几倍\"。对策：**至少保留最近 3 帧数据**做插值填补。\n\n\n### `H139` 图不连通会分裂成子群各飞各的\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**图不连通会分裂成子群各飞各的**（C4 第6章）。作者故意断开一条链路，5 枚弹分成两派\"场面一度非常尴尬\"。另：**实际战场链路常不对称**（A 能听到 B、B 听不到 A），作者因默认双向通信、一枚弹被山体遮挡而**整个协同算法崩溃**——建模时要用有向图。\n\n\n### `H140` 一致性只保证\"一致\"，不保证\"一致到正确的值\"\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**一致性只保证\"一致\"，不保证\"一致到正确的值\"**（C4 第6章）。若所有弹的初始预计到达时间都偏大，收敛后也偏大——**必须引入参考节点或外部输入项**把一致值拉到期望范围。\n\n\n### `H141` ITCG 的 $K_t$ 取 0.5~2.0\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**ITCG 的 $K_t$ 取 0.5~2.0**（C4 第8章）：\"设得太大，导弹像抽风一样来回摆动\"，且应**远距离大、近距离小**（分段线性或模糊）。理想情况时间误差 0.3 s，加扰动后 1 s 以内。\n\n\n### `H142` 末端必须放弃时间控制\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**末端必须放弃时间控制**（C4 第8章）：\"当距离目标小于 500 m 时切换到纯比例导引，放弃时间控制，优先保证命中\"——因为 $R\\to0$ 时 $t_{go}$ 估计的任何小误差都被放大。\n\n\n### `H143` 期望攻击时间不能随便设\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**期望攻击时间不能随便设**（C4 第8章）：先算**最小可达时间与最大可达时间**，在区间内取值，否则导弹要么赶不上、要么得绕大圈超出机动范围。\n\n\n### `H144` ITCG 最大的坑是速度模型\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**ITCG 最大的坑是速度模型**（C4 第8章）。作者\"忽略了导弹速度的衰减，仿真时间控制效果很好，实际飞行试验差了 3 秒多\"——**\"从那以后，我每次做 ITCG 都会先标定速度曲线\"**。\n\n\n### `H145` IACG 的 $K_\\theta$ 别贪大\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**IACG 的 $K_\\theta$ 别贪大**（C4 第9章）。作者设到 8，\"导弹在中段就开始剧烈摆动，过载直接饱和，花了三天才排查出来——**角度误差项和比例导引项在相位上打架了**\"。另两条：**刚发射的前 2 秒用 0.5 倍增益**（速度低、过载能力弱）；**距离目标 500 m 内让角度误差项逐渐退化为零**，否则最后一刻指令跳变。多弹协同时**期望攻击角之间至少留 15° 间隔**，避免雷达波束交叉干扰。\n\n\n### `H146` 双约束制导律的 $N_2$ 别超 2\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**双约束制导律的 $N_2$ 别超 2**（C4 第11章）：\"试过 $N_2=5$，导弹在天上画了个大 S 形，差点没追上目标\"。剩余时间**用剩余航程/速度估算而非 $T_d - t$**（作者直接用后者，速度波动导致攻击时间偏差 0.3 s，\"对高速目标足够它机动躲开\"）。实测三弹（攻击角 -30°/0°/30°）：命中时间 14.98~15.02 s，**末端角度误差 <0.5°**。\n\n\n### `H147` 架构选型的实测数据\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**架构选型的实测数据**（C4 第12章）：Leader-Follower 编队从 5 枚加到 8 枚，**领弹 CPU 跑满、控制周期从 10 ms 拖到 50 ms**；领弹被打掉则\"跟弹像无头苍蝇，有的飞向敌方防空阵地，有的互相撞上\"。无 Leader 的代价是**代码量 3~5 倍**，且作者踩过\"三枚弹同时认为自己是临时领弹、编队直接散架\"的坑，靠**优先级仲裁机制**解决。选型三问：编队规模？敌方防空能力？通信条件？\n\n\n### `H148` 千万不要在项目中期切换架构\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**千万不要在项目中期切换架构**（C4 第12章）。见过团队临时从 Leader-Follower 改无 Leader，**代码重写 80%、工期延误两个月**。\n\n\n### `H149` 任务分配的\"就近分配\"陷阱\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**任务分配的\"就近分配\"陷阱**（C4 第22章）：两枚弹同时扑向同一高价值目标、另一个目标无人管，典型的局部最优。对策是加**\"覆盖度\"约束**；若分配结果频繁切换，加**\"切换代价\"惩罚项**。**目标分配与航迹规划是迭代关系而非串行**——航迹规划发现时间协同不可行，要回退重新分配。\n\n\n### `H150` 航迹规划要留安全裕度\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**航迹规划要留安全裕度**（C4 第22章）。两弹航迹空间交叉但时间错开，因风速扰动一枚晚到 3 秒\"在交叉点差点撞上\"。人工势场法的**局部极小问题**：两弹僵持不动，作者的解法是\"**弹间距离在某范围波动超过 3 秒时，给其中一枚加随机方向的短时推力**\"。另需设**最大绕飞系数**，超过就重新分配目标。\n\n\n### `H151` 带宽要按标称值的 50% 设计\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**带宽要按标称值的 50% 设计**（C4 第28章）。4 弹协同理论需求约 25.6 kbps，而作者一次外场试验用标称 100 kbps 电台，**实际丢包率高达 30%**——\"每次握手、确认、重传占掉大量带宽，真正传有效数据的连一半都不到\"。**\"永远按实际可用带宽的 50% 来设计通信协议\"**。省带宽四招：传差分数据（压缩比 5:1~10:1）、事件触发通信、优先级调度、分布式决策（能不通信就不通信）。\n\n\n### `H152` 能量最优追求的是\"均衡\"而非\"最小化\"\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**能量最优追求的是\"均衡\"而非\"最小化\"**（C4 第25章）。作者一开始用\"总燃料最小\"作目标，\"有一枚导弹为了省油飞了个大圆弧，到达时间严重滞后\"。改用 $\\min\\max J_i$ 后，六弹仿真**燃料消耗方差从 0.15 降到 0.03**；四弹仿真到达时间差 <0.4 s、燃料消耗最大差仅 0.8 kg。三个坑：忽略气动参数随高度变化（用地面数据做高空段，燃料预测偏差 15%）；**过度追求均衡导致整体到达延迟 8 秒**（\"均衡是手段，不是目的\"）；**末端要留 5%~10% 燃料余量**。\n\n\n### `H153` 机动目标协同时，仿真里的目标机动上限要提高 30%\n\n\n> 出处：B-06 《多导弹协同最优制导 — 协同架构、攻击时间一致性与任务分配》\n\n\n**机动目标协同时，仿真里的目标机动上限要提高 30%**（C4 第16章）；机动场景必须覆盖匀速直线/匀速转弯/蛇形/突然跃起四种。\n\n\n## 域 C：终端制导\n\n\n### `H154` 视场约束必须当硬约束，没有商量余地\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**视场约束必须当硬约束，没有商量余地**（C1 第1章）。作者见过一个项目把它当软约束，外场试验时导弹末端因视场超限导致制导指令反转，直接飞向相反方向。\n\n\n### `H155` 画「视场裕度—时间」曲线\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**画「视场裕度—时间」曲线**（作者的个人习惯）：末端裕度低于 **3°** 就重新审视制导律参数或导引头安装方案，\"这个习惯帮我避免了好几次设计返工\"。\n\n\n### `H156` 仿真里的视场角要缩小 10%~15%\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**仿真里的视场角要缩小 10%~15%**（C1 第25章）：标称 ±30° 的导引头，仿真里只用 ±26°。因为探测器边缘像元信噪比低、光学边缘畸变、信号处理有延迟，\"仿真里在视场内的目标，实际可能已经无法稳定跟踪\"。\n\n\n### `H157` 留 3°~5° 的安装/遮挡余量\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**留 3°~5° 的安装/遮挡余量**（C1 第25章）。作者一次外场试验丢失目标，查了半天是弹体结构（头罩、天线、支架）在某些姿态角下遮挡了视场。对策：做三维 CAD 逐角度检查遮挡 + 半实物仿真加入遮挡模型。\n\n\n### `H158` 视场安全裕度留给弹体扰动\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**视场安全裕度留给弹体扰动**（C1 第25章）：视场 ±30° 但制导律只用到 ±25°，剩下 5° 留给弹体振动、气动弹性、推力偏心——导引头稳定平台的隔离度不是 100%。\n\n\n### `H159` 锥体判断要归一化\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**锥体判断要归一化**：把目标位置转到导引头系再归一到单位球面，\"当目标很近时 $\\|\\mathbf{t}\\|$ 很小，不等式两边都接近 0，容易产生误判\"。\n\n\n### `H160` 阈值别用 $\\cos\\theta_{FOV}$，用 $\\cos(\\theta…\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**阈值别用 $\\cos\\theta_{FOV}$，用 $\\cos(\\theta_{FOV}+2^\\circ)$**；代码里的 `SAFE_MARGIN` 作者取 **0.035 rad（约 2°）**，\"太小没效果，太大又太保守\"。\n\n\n### `H161` 半实物仿真加时间滞后项 0.05~0.1 s\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**半实物仿真加时间滞后项 0.05~0.1 s**（C1 第4章）：伺服系统有响应延迟，目标进了视场也得等框架转过来才能锁定。\n\n\n### `H162` 标称 FOV ≠ 有效 FOV\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**标称 FOV ≠ 有效 FOV**（C1 第2章）：某型导引头为追大视场把光学设计做得很激进，外场背景辐射太强、目标淹没在噪声里，最后不得不把视场收窄 5°。\n\n\n### `H163` 先估目标最大机动产生的视线角速率，再留 1.5~2 倍余量\n\n\n> 出处：C-01 《导引头建模与视场/框架角约束》\n\n\n**先估目标最大机动产生的视线角速率，再留 1.5~2 倍余量**（C1 第25章）。作者因没算这个余量，半实物仿真时目标一做大机动就丢，加 **30%** 余量后解决。\n\n\n### `H164` $K_{bias}$ 不要超过导航比 $N$ 的 1/3\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**$K_{bias}$ 不要超过导航比 $N$ 的 1/3**（C1 第6章，\"偏置增益不要超过导航比 N 的 1/3，否则容易引起弹道发散\"）。作者曾设得太大导致弹道明显振荡。\n\n\n### `H165` 偏置项退出时机\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**偏置项退出时机**：$t_{go}<1$ s 时线性衰减到零，既保末端视场又不影响命中精度。另：一定要对 $a_{bias}$ 做限幅，否则大偏差时指令过载过大。\n\n\n### `H166` BPN 是「被动」修正，只适用于框架角缓慢偏离\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**BPN 是「被动」修正，只适用于框架角缓慢偏离**。目标末端突然反向机动时偏置项反应跟不上，框架角仍会超限——\"这时候就需要更高级的方法\"。\n\n\n### `H167` 调参小技巧\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**调参小技巧**：先把 $K_{bias}$ 设为零跑一遍纯 PN，看框架角超限多少，再逐步加 $K_{bias}$ 直到满足要求，\"这样调试效率很高，我一直在用\"。有框架角速率反馈时结合使用，某项目框架角峰值又降了约 5°。\n\n\n### `H168` 李雅普诺夫增益 $k$ 取 0.5~2\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**李雅普诺夫增益 $k$ 取 0.5~2**（C1 第10章）。作者把 $k$ 设到 10，\"导弹像发了疯一样左右摆动，导引头视场反而更差\"，降到 **1.5** 解决。另外初始视线角别贴边界，留 **3°~5°** 安全余量——$\\lambda_0=29.9^\\circ$ 时 $V$ 极大、控制量直接饱和。\n\n\n### `H169` MPC 硬约束改软约束 + 松弛变量\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**MPC 硬约束改软约束 + 松弛变量**（C1 第8章）：作者早期直接把约束加在状态上，\"MPC 求解时经常无解——约束太硬了，优化器直接罢工\"。\n\n\n### `H170` MPC 实时性\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**MPC 实时性**：能用 2 阶就别用 4 阶；预测步数 **N=5~10**；用热启动（上时刻解作初值）。某型导弹上把 QP 求解器换成自定义梯度下降法，**计算时间 15 ms → 3 ms**。$Q$ 从 `diag([10,10,1,1])` 起步，采样 5 ms。\n\n\n### `H171` 虚拟目标切换必须加滞回 + 最小驻留时间\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**虚拟目标切换必须加滞回 + 最小驻留时间**（C1 第9章）：作者因切换太频繁导致导弹来回摆动脱靶，加了「进入门限≠退出门限」和「每次切换后至少保持 **0.5 s**」。\n\n\n### `H172` 切换制导律串一阶低通，时间常数 0.1~0.3 s\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**切换制导律串一阶低通，时间常数 0.1~0.3 s**，防指令突变引起弹体抖动。\n\n\n### `H173` 视场预测窗口 0.5~1 s\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**视场预测窗口 0.5~1 s**（C1 第13章）。作者设到 3 s，\"目标机动方向都变了，预测完全不准\"。补偿系数**不要超过 0.7**，留余量给不确定性；先给 50% 预测偏移量再微调。\n\n\n### `H174` 预测模型必须包含导引头伺服特性\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**预测模型必须包含导引头伺服特性**（C1 第7章）：作者 MPC 预测模型里忽略框架动态，\"仿真时预测的视场角总是偏小\"，加一阶惯性环节后才吻合。\n\n\n### `H175` 视场分区控制\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**视场分区控制**（C1 第7章，作者在某型导弹的做法）：把 ±30° 分为安全区 0~20°、警戒区 20°~25°、危险区 25°~30°，不同区用不同策略。\n\n\n### `H176` 方案阶段 N 选 4 以上\n\n\n> 出处：C-02 《视场约束下的制导律设计（BPN / 李雅普诺夫 / MPC / 虚拟目标）》\n\n\n**方案阶段 N 选 4 以上**（C1 第5章）：\"N=3 虽然脱靶量可能更小，但视场丢失风险显著增加\"。采用变导航比（按框架角动态调整 N）后，某型号**视场丢失率从 15% 降到 2% 以下**——这是作者最推荐的措施。\n\n\n### `H177` 攻角限制在失速点的 80% 左右\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**攻角限制在失速点的 80% 左右**（C2 第4章）。作者吃过亏：\"某次试验中攻角指令给大了 5 度，导弹直接失速翻滚，最后自毁了\"。某型导弹试验攻角 28° 时弹翼根部出现裂纹，从此把最大攻角限到 **22°**（留 6° 裕度）。\n\n\n### `H178` 舵机在最大攻角下至少留 30% 力矩余量\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**舵机在最大攻角下至少留 30% 力矩余量**（C2 第4章）。作者调试某型弹时发现攻角到 15° 后舵面响应变慢，查出是舵机力矩不够，换了更大功率舵机。\n\n\n### `H179` 软约束比硬约束鲁棒\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**软约束比硬约束鲁棒**（C2 第9章）：\"我曾经试过硬约束，结果遇到测量噪声时，控制量直接发散——那叫一个惨\"。用终端代价 $S$ 惩罚而非终端等式约束。\n\n\n### `H180` $S(3,3)$ 不能贪大\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**$S(3,3)$ 不能贪大**（C2 第9章）：作者为追求末端攻角精度把 $S(3,3)$ 设得特别大，\"仿真时发现导弹在末端突然拉出一个大过载，结构都受不了\"。**加权矩阵选取要综合考虑平台机动能力**。\n\n\n### `H181` 调参顺序：先调 $R$ 保证控制量不饱和，再调 $S$ 和 $Q$\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**调参顺序：先调 $R$ 保证控制量不饱和，再调 $S$ 和 $Q$**。Riccati 反向积分步长 **0.01 s** 就够，用四阶龙格-库塔。\n\n\n### `H182` 滑模参数经验值\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**滑模参数经验值**（C2 第11章）：$\\lambda=0.1\\sim0.5$（太大响应慢、太小超调大）；$k_1=5\\sim20$（受舵机带宽限制，\"别贪快\"）；$k_2$ = **干扰上界的 1.2~1.5 倍**。作者曾把 $k_2$ 设得偏小，遇强风干扰攻角直接冲到 28°（限幅 25°），后加自适应增益才解决。\n\n\n### `H183` 抖振抑制\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**抖振抑制**：边界层厚度 $\\Phi=0.01\\sim0.05$，配合扩张状态观测器效果最好（C2 第10章）。趋近律参数 $\\varepsilon=0.1\\sim0.5$、$k=5\\sim20$；作者把 $\\varepsilon$ 设到 2.0，\"实物实验时舵机高频振荡，差点把机械结构震散\"，降到 **0.3** 才解决。\n\n\n### `H184` 李雅普诺夫只保证 $s\\to0$，不保证瞬态不超限\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**李雅普诺夫只保证 $s\\to0$，不保证瞬态不超限**（C2 第11章）：\"仿真时稳态没问题，但实际飞行中攻角在到达滑模面前已经超了\"。对策：加\"到达阶段\"约束或用积分滑模。\n\n\n### `H185` 自适应实测\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**自适应实测**（C2 第13章，马赫 2.5、10 km、气动参数 +20% 摄动、攻角约束 ±20°）：\n\n| 指标 | 传统 PID 制导 | 自适应攻角约束制导 |\n|---|---|---|\n| 脱靶量 | 3.2 m | 0.8 m |\n| 最大攻角 | 24.5°（超限） | 19.8°（满足） |\n| 参数估计收敛时间 | — | 1.2 s |\n\n\n### `H186` 势函数末段要衰减\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**势函数末段要衰减**（C2 第13章）：剩余时间小于 1 s 时逐渐减弱势函数，\"让制导律专注于命中精度\"。势函数加太强会影响终端精度。\n\n\n### `H187` 自适应调参\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**自适应调参**：$\\Gamma$ 从 **0.1** 起逐步增大（设太大会高频振荡）；估计值参数投影限制在名义值 **±50%**；遗忘因子时间常数 **0.5~1 s**；估计器加死区，阈值取传感器噪声标准差的 **2~3 倍**；参数初值取名义值的 80%~120%。\n\n\n### `H188` LMI 无解先别急着改参数\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**LMI 无解先别急着改参数**（C2 第15章）：\"我曾经把 $\\alpha_{max}$ 设成 5°，结果 LMI 怎么都解不出来。放宽到 10°，立马有解\"。另：求解后逐行检查 LMI 维度是否匹配——作者漏写一行攻角约束，仿真跑出来攻角超限。\n\n\n### `H189` 攻角约束不是越紧越好\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**攻角约束不是越紧越好**（C2 第23章）：作者把约束设到 ±5°，满足率只有 **60%**；放宽到 ±8°，满足率升到 **98%**，脱靶量反而更小——\"太紧的约束会导致制导指令剧烈变化，反而影响精度\"。要求满足率 **≥95%**。\n\n\n### `H190` 三维解耦不是万能的\n\n\n> 出处：C-03 《末端攻角/落角约束控制（LQR / 滑模 / 自适应 / 鲁棒）》\n\n\n**三维解耦不是万能的**（C2 第20章）：陀螺噪声偏大时解耦后的制导律反而发散，作者加了低通滤波才解决。\n\n\n### `H191` 加「能量健康度」指标\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**加「能量健康度」指标**（C3 第3章）：把能量高度在走廊中的位置归一化到 0~1，>0.8 安全、0.5~0.8 预警、<0.5 触发紧急控制。\"这个指标简单直观，调试时特别好用\"。作者一次仿真中健康度一直在 0.6 附近上不去，查出来是**气动模型少算了一个阻力项**——\"先别急着调控制参数，回头检查模型\"。\n\n\n### `H192` 可行域分析必须是动态的，要预测未来 3~5 s\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**可行域分析必须是动态的，要预测未来 3~5 s**（C3 第3章）。作者只检查当前时刻能量在走廊内，结果末端突然掉出走廊来不及补救。执行节奏：**每 0.1 s 算一次能量高度，每 0.5 s 做一次可行域判断**。\n\n\n### `H193` 能量管理要提前 5~10 s 介入\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**能量管理要提前 5~10 s 介入**（C3 第5章）：\"等到最后 2 秒再调，往往来不及\"。\n\n\n### `H194` 分段点 3~5 个就够\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**分段点 3~5 个就够**（C3 第4章）：\"设得太少轨迹不平滑，设得太多容易过拟合\"。剖面预留 **5%~10%** 余量；必须保证 $E_{h,ref}-h_{ref}$ 始终大于安全阈值，否则反算出的速度会小于失速速度。\n\n\n### `H195` $\\dot{\\Delta e}$ 要限幅在 ±200 J/(kg·s)\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**$\\dot{\\Delta e}$ 要限幅在 ±200 J/(kg·s)**（C3 第6章）：\"能量误差大的时候微分项容易引入噪声，加了限幅器效果立竿见影\"。能量误差加二阶低通，截止频率 **2~5 Hz**。\n\n\n### `H196` 末端飞行时间短，别加积分项\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**末端飞行时间短，别加积分项**（C3 第6章）：\"积分项来不及起作用，反而容易引起超调，PD 就够了\"。\n\n\n### `H197` 攻角限幅必须放在控制律计算的最后一步\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**攻角限幅必须放在控制律计算的最后一步**（C3 第6章）：作者把限幅放在增益调度之前，\"增益查表查到了错误区间，飞行器直接失控\"。\n\n\n### `H198` 攻角变化率限制在 5°/s 以内\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**攻角变化率限制在 5°/s 以内**（C3 第8章）：\"我见过有人直接给阶跃指令，结果飞行器直接失速\"。倾侧角反转（+30°→−30°）必须加**至少 0.5 s** 过渡，作者没做平滑导致航向偏差直接跳了 20°。\n\n\n### `H199` 能量偏低时增大倾侧角用高度换速度\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**能量偏低时增大倾侧角用高度换速度**（C3 第8章）：仿真中只减攻角速度恢复很慢，配合倾侧角到 **45°** 左右，\"速度能在 3 秒内提升 15%，代价是掉高约 100 米。这个交换比在末端制导中是可以接受的\"。\n\n\n### `H200` 阻力板开到最大的教训\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**阻力板开到最大的教训**（C3 第5章）：作者为快速减速把阻力板开到最大，\"飞行器直接失速，姿态失控\"——**阻力调制不能只看阻力，还要看升力是否够维持飞行**；且要检查阻力板位置引起的力矩平衡（作者某型无人机开板后高度掉得特别快，是升力中心后移产生低头力矩）。执行机构**留 10%~20% 余量**。\n\n\n### `H201` 先做开环测试\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**先做开环测试**（C3 第5章）：手动给定阻力板和攻角指令看能量变化曲线，摸清规律再上闭环，\"能避免很多低级错误\"。\n\n\n### `H202` 过程约束的三种处理，按阶段换\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**过程约束的三种处理，按阶段换**（C3 第9章）：工程初期用硬约束限幅（简单粗暴先让弹飞起来）→ 弹道定型后换罚函数法做精细调整 → MPC 因算力在型号里用得不多。预测子步取制导周期的 **1/5**；减速指令要叠加过载限制，\"否则约束满足了，结构先坏了\"；动压和热流同时超限时取更严格的减速量。\n\n\n### `H203` 动压与热流是耦合的\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**动压与热流是耦合的**（C3 第9章）：为躲动压在高空减速 → 飞行时间变长 → 热流累积更大。作者遇到两者交替超限调了三天，最后发现是初始能量分配问题，**收紧中末制导交接班速度条件**才解决。\n\n\n### `H204` 末段不要大幅拉高来修正高度偏差\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**末段不要大幅拉高来修正高度偏差**（C3 第11章）：\"速度比高度更重要\"，作者见过这么干导致速度掉到失速边界以下直接失控。实战案例：某滑翔增程弹用纯 PN 高度误差 ±20 m，改成能量-高度协调 + 前馈 + 增益调度后降到 **±3 m**，速度偏差 <2%。\n\n\n### `H205` 高超声速风洞数据本身有 ±10% 误差\n\n\n> 出处：C-04 《末端能量管理与可用过载预测》\n\n\n**高超声速风洞数据本身有 ±10% 误差**（C3 第27章）：作者用标称数据设计，实飞阻力系数偏差 15%，差点能量不足；舵偏一般不超过 ±20°；单次机动不超过 30 s 给结构留散热时间。\n\n\n### `H206` 多约束设计的第一步是检查约束相容性\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**多约束设计的第一步是检查约束相容性**（C4 第9章）。作者同时加末端角度和速度约束，\"发现两个约束在数学上存在矛盾——期望命中角对应的速度范围与期望速度值完全不重合，最后只能跟总体协商放宽其中一个\"。\n\n\n### `H207` $R$ 不能取得太小\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**$R$ 不能取得太小**（C4 第8章）：\"我在一个项目中 $R$ 取了 0.01，结果仿真里过载直接飞到 50 g，实际导弹根本做不到\"。取值参考：高机动目标 $R=0.1I$；低机动 $R=I$；角度要求严格 $R=0.5I$。速度约束权重 $\\rho$ **从 1 起步**，速度偏差大就增大、指令振荡就减小。\n\n\n### `H208` 先用无约束制导律做粗调，末端再切换成带角度约束的制导律\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**先用无约束制导律做粗调，末端再切换成带角度约束的制导律**（C4 第8章），兼顾中段能量效率与末端精度。核心权衡一句话：**用控制能量换取终端精度**。\n\n\n### `H209` 速度约束实测收益\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**速度约束实测收益**（C4 第9章）：不加速度约束时末端速度偏差 ±40 m/s，加了之后缩小到 **±5 m/s 以内**，代价是脱靶量 0.5 m → 1.2 m，\"这个 trade-off 是可以接受的\"。\n\n\n### `H210` $t_{go}$ 设下限 0.1 s\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**$t_{go}$ 设下限 0.1 s**（C4 第8章）：\"否则数值会爆炸\"。$P(t)$ 矩阵做成**时间—剩余距离的二维查表**，比在线解 Riccati 快一个数量级。\n\n\n### `H211` 滑模面系数 $c_1,c_2$ 取 0.5~2.0\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**滑模面系数 $c_1,c_2$ 取 0.5~2.0**（C4 第11章）：\"太小收敛慢，太大容易引起抖振\"。作者半实物仿真试过 $c_1=5$，\"舵机抖得跟筛子似的\"。\n\n\n### `H212` 切换增益 $k$ 取扰动上界的 1.2~1.5 倍\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**切换增益 $k$ 取扰动上界的 1.2~1.5 倍**（C4 第11章）。作者踩坑：\"k 取太小系统根本进不了滑模面；取太大抖振严重到把执行器烧了\"。答辩时回答评委「凭什么保证 k 覆盖所有扰动」的答案是 **1.5 倍，留足裕量**。\n\n\n### `H213` 用 $\\tanh(s/\\Delta)$ 或 $\\mathrm{sat}(s/…\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**用 $\\tanh(s/\\Delta)$ 或 $\\mathrm{sat}(s/\\Delta)$ 替代 $\\mathrm{sign}(s)$，$\\Delta=0.01\\sim0.05$**（C4 第10/11章）。作者在某无人机姿态控制项目因抖振**烧毁舵机**。周期紧先用边界层法，追求极致性能直接上高阶滑模（超螺旋：$u=-k_1|s|^{0.5}\\mathrm{sign}(s)+v,\\ \\dot v=-k_2\\mathrm{sign}(s)$）。\n\n\n### `H214` 初始误差太大时先加比例引导段再切滑模\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**初始误差太大时先加比例引导段再切滑模**（C4 第11章）：角度差 30° 以上时滑模\"到达时间过长\"。\n\n\n### `H215` 多约束耦合用三层分层优化\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**多约束耦合用三层分层优化**（C4 第9章）：第一层最优制导律生成基准轨迹（只管位置+速度）→ 第二层 MPC 处理角度和过载 → 第三层在线优化处理视场角等快变约束。\"每层只处理少量约束，计算量可控，层与层通过状态反馈解耦\"。\n\n\n### `H216` 快回路带宽至少是慢回路的 5 倍\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**快回路带宽至少是慢回路的 5 倍**（C4 第15章）。作者曾因两者带宽太接近出现耦合振荡，强制拉开后解决。慢回路期望动态设计成一阶低通形式，只需调 $\\omega_v,\\omega_\\gamma$ 两个参数。\n\n\n### `H217` 动态逆怕模型不准\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**动态逆怕模型不准**（C4 第15章）：气动数据偏差 15% 时控制律直接发散。三招：在线 RLS 辨识 + 鲁棒补偿项（滑模或 $H_\\infty$）+ 自适应增益。\n\n\n### `H218` 饱和时主动降低慢回路带宽 $\\omega_v,\\omega_\\gamma$\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**饱和时主动降低慢回路带宽 $\\omega_v,\\omega_\\gamma$**（C4 第15章，作者更推荐\"参考轨迹调节\"而非抗饱和补偿器）：期望轨迹变缓，控制量自然退出饱和。起因是一次飞行试验舵面指令打到限幅，脱靶量大了好几倍。\n\n\n### `H219` 三维叉积在视线角速度过零时数值不稳定\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**三维叉积在视线角速度过零时数值不稳定**（C4 第22章）：作者加小量正则化 $\\varepsilon=10^{-6}$ 解决。\n\n\n### `H220` MPC 用 jerk 作控制量\n\n\n> 出处：C-05 《末端速度矢量控制（最优 / 滑模 / 动态逆）》\n\n\n**MPC 用 jerk 作控制量**（C4 第17章）：某型空地弹项目中直接用加速度作控制量，\"执行机构响应有明显滞后和超调；用 jerk 相当于给加速度加了个平滑滤波器，轨迹顺滑很多\"。预测时域 **N≤10**（试过 N=20，求解时间翻三倍而控制效果提升微乎其微）；STM32H743 上单次求解平均 **0.42 ms**、最大 **0.68 ms**，满足 100 Hz 控制。\n\n\n### `H221` 先排优先级，别把权重设成一样的\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**先排优先级，别把权重设成一样的**（C2 第19章）：\"我曾经把攻角约束和过载约束设成同等权重，结果两个都没满足好。改成过载优先、攻角其次，问题就解决了\"。\n\n\n### `H222` ⚠️ 注意：书中两处优先级排序不一致\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**⚠️ 注意：书中两处优先级排序不一致**——C1 第12章给的顺序是「1 过载 → 2 视场 → 3 落角」（理由：结构安全是底线 / 丢了目标后面全白搭 / 落角可放宽 ±5°）；而 C1 第8章 MPC 的约束优先级是「1 执行机构饱和 → 2 视场角 → 3 过载限制」（理由：舵面打死是硬约束 / 视场可用软约束但权重设高）。建模时**按具体场景与\"谁是硬约束\"确定，不要照抄某一处**，并在模型中显式标注依据。（另：C1 第12章也指出优先级不是死的——某项目客户要求落角 ±2° 不能超，过载和视场就得给落角让路。）\n\n\n### `H223` 提前画「约束可行域」，看三个约束有没有交集\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**提前画「约束可行域」，看三个约束有没有交集**（C1 第12章）：没有交集就得改指标。作者曾为同时满足过载和落角把弹道设计得特别激进，结果末端姿态变化太快、导引头丢了目标。\n\n\n### `H224` 弹道分段 + 软切换\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**弹道分段 + 软切换**（C1 第12章）：中制导段控过载 → 过渡段调姿态盯视场 → 末制导段保落角和视场。过渡段用软切换函数，让过载权重从 100% 渐降到 60%、落角和视场从 0% 升到 40%，\"不会出现突变，弹道更平滑\"。\n\n\n### `H225` 该松就松，别死磕\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**该松就松，别死磕**（C1 第12章实例）：过载限 8 g 但仿真总超到 8.5 g → 跟结构组沟通放宽到 9 g → 限幅设 8.5 g 留 0.5 g 余量 → 落角 80° 降到 75° → 三个约束都满足。\"工程上很少有绝对的'必须'，更多是'在什么范围内可以接受'\"。另：过载短时间超一点（0.2 s 内超 10%）结构通常能扛，但别超太久。\n\n\n### `H226` 视场约束下的参数整定经验公式\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**视场约束下的参数整定经验公式**（C1 第15章）：$N=3\\sim5$（视场角小取小值）；$\\theta_{max}=0.8\\times$物理极限（留 20% 余量，±40° 导引头设 ±32°）；增益切换点 $t_{sw}=0.3\\,t_{go}$。至少做三组仿真：**标称工况 / 极限机动工况 / 初始指向偏差工况**。\n\n\n### `H227` 仿真中加视场角超限计数器\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**仿真中加视场角超限计数器**（C1 第15章）：只要超限一次就记录当时飞行状态，\"调试时能快速定位问题出在哪个阶段\"。$t_{go}$ 估计要**保守，宁可估长别估短**。\n\n\n### `H228` 噪声模型必须用实测数据\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**噪声模型必须用实测数据**（C1 第15章 / C2 第23章）：作者某项目仿真里视场角始终在 ±25° 以内，挂到飞控计算机上直接飙到 ±38°。C2 第23章补充：传感器噪声是**有色噪声**，至少加一阶马尔可夫过程模拟相关性。\n\n\n### `H229` 蒙特卡洛规范\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**蒙特卡洛规范**（C2 第23章 / C3 第23章 / C4 第25章）：次数 **≥500**（C4 作者实测 500 次与 10000 次统计结果差异 <1%）；优先用**拉丁超立方采样**（500 次 ≈ 简单随机采样 2000 次效果）；看 **95% 分位数和最大值而非均值**——作者见过平均 0.5 m 但最大 8 m，\"这在实战中就是灾难\"。随机分布要**正态+均匀混合**，全用正态会漏掉极端组合工况；多线程跑要为每个线程配独立随机数流。\n\n\n### `H230` 蒙特卡洛结果判读\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**蒙特卡洛结果判读**（C3 第23章）：成功率低但偏差小 → 存在\"死区\"，检查约束边界；成功率高但偏差大 → 鲁棒好但精度差；对某参数特别敏感 → 该回路设计有问题（作者加高度前馈后敏感度降一半）。成功率 **<95% 直接打回重做**。\n\n\n### `H231` 攻角约束满足率要求 ≥95%，指令平滑度 $\\max|\\ddot a_{cm…\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**攻角约束满足率要求 ≥95%，指令平滑度 $\\max|\\ddot a_{cmd}|<50\\ \\mathrm{m/s^3}$**（C2 第23章）。某次综合结果：脱靶均值 0.67 m、标准差 0.32 m、满足率 97.2%、平滑度 32.5 m/s³。仿真矩阵至少 **3 种射程 × 3 种机动强度 = 9 种工况**。\n\n\n### `H232` 仿真必须加限幅和风场\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**仿真必须加限幅和风场**（C2 第23章 / C3 第11章）：\"我曾经有一次仿真跑得挺好，一上实物就炸了，原来是舵面限幅导致控制量饱和。仿真里没加限幅，实物加了\"。初始攻角别设太大（同事设 15° 仿真一开始就发散，建议 0°~5°）。\n\n\n### `H233` 一体化设计的触发条件\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**一体化设计的触发条件**（C2 第18章）：\"当脱靶量要求小于 1 米、末端攻角约束在 ±2° 以内时，必须上一体化设计，否则调来调去都很难同时满足\"。**一体化模型必须包含执行机构限幅特性**，作者忽略舵机饱和导致仿真与实际差得离谱。$H_\\infty$ 鲁棒性好但控制器阶数高，某项目因阶数太高实时性跟不上，需降阶。\n\n\n### `H234` 时延补偿的边界\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**时延补偿的边界**（C2 第26章）：Smith 预估器对**固定时延**效果特别好，但\"模型参数辨识不准时反而让系统更不稳定\"。不要过度补偿——\"我见过有人把时延补偿到负值，系统直接发散\"；作者把参数调得太激进，半实物仿真在某频率点谐振，差点烧舵机。时延测量用阶跃响应法。\n\n\n### `H235` 计算延迟补偿用预测法\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**计算延迟补偿用预测法**（C4 第27章）：$x_{pred}=x(k)+d\\,T_s\\,f(x(k),u(k))$，用预测值算制导指令。实测**不加补偿脱靶 1.5 m，加补偿降到 0.3 m**。\n\n\n### `H236` 滤波器截止频率不能低于制导回路带宽的 5 倍\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**滤波器截止频率不能低于制导回路带宽的 5 倍**（C4 第27章）：作者把截止频率设到 10 Hz 而回路带宽 8 Hz，飞行试验末端剧烈抖动、脱靶超差 3 倍，改到 50 Hz 解决。采样周期不是越短越好——某项目从 5 ms 改到 1 ms，视线角速率噪声被放大 3 倍，脱靶反而变大。\n\n\n### `H237` Pareto 前沿是跟甲方谈判的工具\n\n\n> 出处：C-06 《多约束耦合与工程实现（权衡、一体化、验证）》\n\n\n**Pareto 前沿是跟甲方谈判的工具**（C4 第20章）：作者用 NSGA-II 跑了一整晚得到前沿，直接拿曲线跟甲方谈\"你要速度 0.8 Ma 方向误差最多 2.5°；要方向 1° 速度最多 0.7 Ma，你选吧\"，最后落到 0.75 Ma / 2° 的双方可接受点。\n\n\n## 域 D：制导系统建模仿真\n\n\n### `H238` $\\boldsymbol\\omega\\times\\mathbf{V}$ 叉乘…\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**$\\boldsymbol\\omega\\times\\mathbf{V}$ 叉乘项不能漏**。作者第一次做六自由度仿真漏了这项，\"导弹飞着飞着就'飘'起来了，怎么调参数都不对\"，查了三天。同理 $\\boldsymbol\\omega\\times(\\mathbf{I}\\boldsymbol\\omega)$ 陀螺耦合项漏掉会导致滚转通道发散。\n\n\n### `H239` $C_{m\\alpha}$ 符号搞反 = 正反馈\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**$C_{m\\alpha}$ 符号搞反 = 正反馈**。\"我曾经在仿真时发现导弹发散得特别快，查了半天，原来是 $C_{m\\alpha}$ 符号搞反了。静稳定导弹的 $C_{m\\alpha}$ 必须是负的\"——写代码时反复核对。\n\n\n### `H240` 风洞数据不能当常数用\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**风洞数据不能当常数用**。作者直接套风洞报告系数导致仿真发散：\"风洞数据是在特定马赫数和雷诺数下测的，而导弹飞行包线很宽\"。必须建立随 $Ma$、$\\alpha$ 变化的插值表。\n\n\n### `H241` 惯性参数必须实测\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**惯性参数必须实测**。某项目理论计算质心偏了 5%，\"结果控制律怎么调都振荡\"。推力-时间曲线受温度影响大，常温与低温可差 20%。\n\n\n### `H242` 设计值当气动系数，仿真与飞行试验差 30%\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**设计值当气动系数，仿真与飞行试验差 30%**。原因是实际加工弹体外形有微小偏差。\"从那以后，我坚持用实测气动数据做仿真\"。\n\n\n### `H243` 步长偷懒会毁掉控制律\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**步长偷懒会毁掉控制律**。作者把步长从 0.001 改成 0.01，\"仿真结果看起来'差不多'，但控制律设计出来根本不能用——步长太大把高频动态都滤掉了\"。检验方法：**改变步长看结果是否一致**。\n\n\n### `H244` 必须用 RK4，别用欧拉法\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**必须用 RK4，别用欧拉法**。同弹道、同步长 0.01 s，飞 10 秒后位置误差能差出几百米。\n\n\n### `H245` 俯仰 90° 欧拉角奇异\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**俯仰 90° 欧拉角奇异**，作者在大机动仿真中直接发散，\"从那以后，我但凡涉及大角度机动，一律用四元数\"。\n\n\n### `H246` 舵机模型忽略速率限制，仿真与试飞差 30%\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**舵机模型忽略速率限制，仿真与试飞差 30%**。\"舵机在大指令下根本转不了那么快，速率限制一定要加！\"\n\n\n### `H247` 阻尼回路带宽别贪高\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**阻尼回路带宽别贪高**。作者设到 50 Hz，\"高频噪声全进来了，舵机抖得跟筛糠似的\"，后来取**弹体带宽的 3~5 倍**。内环（自动驾驶仪）带宽必须是外环（制导）的 **5~10 倍**，否则外环指令执行不了。\n\n\n### `H248` 三通道带宽要拉开差距\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**三通道带宽要拉开差距**：滚转最快、俯仰次之、偏航最慢，可有效减少通道间耦合。\n\n\n### `H249` 延迟补偿要的是\"预测\"不是\"平滑\"\n\n\n> 出处：D-01 《制导回路分层建模与降阶——从六自由度到等效时间常数》\n\n\n**延迟补偿要的是\"预测\"不是\"平滑\"**。作者曾用低通滤波做补偿，\"结果相位滞后更严重了\"；改用一阶外推 $u_{comp}=u_{cmd}+(u_{cmd}-u_{prev})\\dfrac{T_{delay}}{dt}$，强非线性系统用卡尔曼预测——某高动态项目把**等效延迟从 2.3 ms 降到 0.4 ms**。\n\n\n### `H250` 实测案例：地空弹末制导失稳\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**实测案例：地空弹末制导失稳**（C2 第20章）。开环扫频结果：\n\n| 频率 (Hz) | 开环增益 (dB) | 相位裕度 (°) | 状态 |\n|---|---|---|---|\n| 1.0 | 12.3 | 48 | 稳定 |\n| 2.5 | 8.7 | 32 | 临界 |\n| 4.0 | 5.2 | 12 | 失稳 |\n| 5.5 | 2.1 | -5 | 失稳 |\n\n修复三管齐下：比例增益 0.8→0.5、积分 0.3→0.15（4 Hz 处降约 4 dB）；输出端加二阶低通@8 Hz；角速率反馈阻尼比 0.6→0.8。修复后 **4 Hz 处相位裕度 12°→33°，脱靶量 8.3 m→1.2 m**。\n\n\n### `H251` 实测案例：反舰弹末段等幅振荡\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**实测案例：反舰弹末段等幅振荡**（C2 第21章，±3°@2 Hz，脱靶量 2 m→15 m）。导航比扫描：\n\n| $N$ | 稳态误差 | 振荡幅度 | 响应时间 |\n|---|---|---|---|\n| 3 | 0.8° | ±0.5° | 1.2 s |\n| 4 | 0.5° | ±3.0° | 0.8 s |\n| 5 | 0.3° | ±5.5° | 0.6 s |\n\n结论：\"**工程中导航比不要超过 3.5，除非你有特别好的滤波手段**\"。三步解决：二阶低通@10 Hz → $N$ 降到 3.2 + 舵偏速率限幅 30°/s → 超前校正 15°@2 Hz。**振荡 ±3°→±0.5°，脱靶量 15 m→3 m，稳定裕度 5 dB→12 dB**。\n\n\n### `H252` 别只看幅值裕度\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**别只看幅值裕度**。\"有一次我幅值裕度做到 12 dB，以为稳了，结果相位裕度只有 20°。试飞时导弹在末端开始抖——舵机延迟把相位吃掉了。\"\n\n\n### `H253` 别只看低频段\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**别只看低频段**。某系统低频 10 dB，高频段只有 2 dB，\"结果系统在高频噪声激励下振荡了\"。\n\n\n### `H254` 舵机接近饱和区时等效带宽下降 20%~30%\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**舵机接近饱和区时等效带宽下降 20%~30%**。按线性模型算出的 35°，\"实际可能只有 25°\"，必须做非线性仿真验证。\n\n\n### `H255` 数字实现要额外留 5~10° 相位裕度\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**数字实现要额外留 5~10° 相位裕度**，专门抵消采样和计算延迟；采样率至少是带宽的 10 倍，否则会出现\"数字抖动\"。\n\n\n### `H256` 非线性吃掉裕度的实测数据\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**非线性吃掉裕度的实测数据**：舵机死区 0.3° → 低速跟踪 0.5 Hz 极限环；齿轮间隙 0.1° → 10 Hz 极限环；高攻角机动舵机饱和 → 8 Hz 持续抖动。\n\n\n### `H257` 超前校正的边界\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**超前校正的边界**：某空地弹相位裕度只有 18°，\"加了超前校正，把 $\\alpha$ 取到 5，相位裕度直接拉到 42°\"；但滞后校正 $\\beta=20$ 时\"相位裕度掉了 15°，系统出现低频振荡\"，降到 $\\beta=8$ 才好。**$\\beta$ 一般取 5~10，别贪心**，转折频率取剪切频率的 1/5~1/10。\n\n\n### `H258` 盲目加超前校正会放大噪声\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**盲目加超前校正会放大噪声**。\"相位裕度是上去了，但高频增益也被抬高了，导致传感器噪声被放大。**频域调试是'跷跷板'，一头压下去，另一头会翘起来**\"。\n\n\n### `H259` 陷波器 Q 值控制在 10~30\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**陷波器 Q 值控制在 10~30**。作者 Q 值设太高，\"有用信号的相位在陷波点附近发生剧烈变化，影响了测角精度\"；某滚转回路 10 Hz 谐振峰加陷波后增益裕度 3 dB→8 dB。\n\n\n### `H260` 主导极点不能孤立看\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**主导极点不能孤立看**。某俯仰通道只盯最近的一对共轭复极点，忽略了一个带近邻零点的实极点，\"超调量比预期大了 30%\"。\n\n\n### `H261` Nyquist 别数包围次数\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**Nyquist 别数包围次数**，工程上直接看曲线与负实轴交点在 $(-1,j0)$ 的左侧还是右侧。\n\n\n### `H262` 先检查硬件，再调软件\n\n\n> 出处：D-02 《制导回路稳定性分析——根轨迹、频域裕度与失稳机理》\n\n\n**先检查硬件，再调软件**。某项目花两周调算法，最后发现是舵机减速器齿轮磨损严重，\"换了舵机，问题立刻解决\"。\n\n\n### `H263` Z-N 参数普遍偏激进\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**Z-N 参数普遍偏激进**，\"我习惯把 $K_p$ 再打八折，然后微调积分时间\"。血的教训：某次仿真里追目标追得很好，\"结果半实物仿真时舵机直接饱和，差点把转台干废了\"。\n\n\n### `H264` 简单系统用 Z-N，复杂系统用极点配置\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**简单系统用 Z-N，复杂系统用极点配置**。模型准、能精确控制阻尼比和带宽 → 极点配置；模型不确定性大或赶时间 → Z-N 快速出初值再现场微调。\n\n\n### `H265` 仿真越完美，实物越可能出问题\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**仿真越完美，实物越可能出问题**。作者用极点配置把闭环极点放在 $s=-10\\pm j10$，\"仿真完美。结果半实物仿真时，由于传感器噪声和舵机非线性，系统高频振荡\"，把极点左移到 $s=-5\\pm j5$，牺牲快速性换稳定。\n\n\n### `H266` 阻尼比 0.3 → 0.7 是立竿见影的改进\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**阻尼比 0.3 → 0.7 是立竿见影的改进**。某型地空弹短周期阻尼比只有 0.3、超调很大，\"通过调整控制增益把阻尼比提升到 0.7，效果立竿见影\"。\n\n\n### `H267` 调试时先断开增稳回路，只调阻尼回路\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**调试时先断开增稳回路，只调阻尼回路**。\"当年我图省事一起调，结果花了三倍时间才把问题找出来。\"\n\n\n### `H268` 三通道单独仿真都完美，一联调就出问题\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**三通道单独仿真都完美，一联调就出问题**——通道间耦合。对策是拉开三通道带宽差距（滚转最快、俯仰次之、偏航最慢）。\n\n\n### `H269` 时变特性必须增益调度\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**时变特性必须增益调度**。某半实物仿真用固定 PID，\"高空低速段表现还行，一到低空高速段就开始振荡\"；某型地空弹\"地面测试好好的，一上天就抖得跟筛子似的\"。\n\n\n### `H270` 调度变量选马赫数+动压\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**调度变量选马赫数+动压**（最常见组合），四个准则：能反映非线性变化、可测量、变化平滑、对故障鲁棒。作者见过选攻角做调度变量，\"结果攻角传感器一坏，整个系统直接崩了\"。\n\n\n### `H271` 调度维度别贪多\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**调度维度别贪多**。作者试过马赫数+动压+攻角+侧滑角四维调度，\"调度表大到飞控计算机内存装不下，插值计算时间赶上控制周期了。后来老老实实降到二维，效果反而更好\"。\n\n\n### `H272` 调度边界外再外推 10% 余量\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**调度边界外再外推 10% 余量**；**调度更新频率至少是控制频率的 1/10**（控制 100 Hz → 调度 ≥10 Hz）。曾有项目调度更新只有 10 Hz，\"导弹在高动态机动时，增益跟不上状态变化，直接发散\"。\n\n\n### `H273` 每次做完增益调度都做一次\"最坏情况测试\"\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**每次做完增益调度都做一次\"最坏情况测试\"**：假设调度变量测量值有 20% 误差，\"这个测试帮我发现过好几次潜在问题\"。\n\n\n### `H274` 导航比整定\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**导航比整定**：高机动目标（战斗机）$N=4\\sim5$；低机动目标（无人机、巡航导弹）$N=3\\sim4$；导引头噪声大则适当降低。作者把 $N$ 设到 6，\"仿真里脱靶量很小，但实际飞行试验时导弹在末端剧烈抖动，差点失控\"。\n\n\n### `H275` 整定顺序\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**整定顺序**：先开环看裕度 → 再闭环调 PID → 最后加约束（舵机饱和、速率限制）。\"调 PID 时，我习惯先调比例项，让系统动起来；再加积分项消除静差；最后加微分项改善动态响应。别一上来就三个参数一起调。\"\n\n\n### `H276` 蒙特卡洛是整定的收尾判据\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**蒙特卡洛是整定的收尾判据**：作者习惯跑 500 次以上，\"脱靶量均值小于 3 米，且标准差小于 1 米，我就觉得这个设计基本靠谱了\"；扫描 $N\\in[2.5,5.0]$ 看脱靶量趋势。\n\n\n### `H277` 超调与调节时间是一对矛盾\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**超调与调节时间是一对矛盾**：某项目把超调从 20% 压到 5%，\"结果调节时间从 1.2 s 变成了 2.8 s——这显然不行\"，折中点是超调 10%、调节时间 1.5 s。\n\n\n### `H278` 限幅必须留裕度\n\n\n> 出处：D-03 《制导系统参数整定——整定流程、调参顺序与指标权衡》\n\n\n**限幅必须留裕度**：过载设计\"至少留 30% 的过载裕度\"，见过仿真 12 g 而实际因气动偏差飙到 18 g 导致弹体解体的案例。\n\n\n### `H279` 3 ms 时间偏差 → 脱靶量翻倍\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**3 ms 时间偏差 → 脱靶量翻倍**（某型地空弹）。后来统一用 IRIG-B 码对时才解决；另一项目制导计算机与仿真计算机各用自己的时钟，\"跑了 10 秒后时间差累积到 50 ms，整个仿真结果完全不可用\"。\n\n\n### `H280` 目标模拟器更新频率必须高于导引头\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**目标模拟器更新频率必须高于导引头**。某项目脱靶量总是偏大，\"目标模拟器更新频率只有 50 Hz，而导引头跟踪频率是 100 Hz——导引头在'猜'目标位置\"，提到 200 Hz 后解决。\n\n\n### `H281` 转台带宽不够就露馅\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**转台带宽不够就露馅**。数字仿真里导引头稳如磐石，\"上了转台就开始抖——转台带宽只有 5 Hz，而弹体振动频率在 8 Hz 左右\"。**选转台别光看指标，要看带宽**。\n\n\n### `H282` 光瞳匹配要提前算\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**光瞳匹配要提前算**。红外半实物仿真中黑体温度设置没问题但导引头锁不住目标，\"查了两天才发现黑体的辐射面积太小，导引头光学系统没完全覆盖\"，换大口径黑体解决。\n\n\n### `H283` 单点接地是铁律\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**单点接地是铁律**。舵机反馈信号里始终有 50 Hz 工频干扰，查了两天，\"是电源地和信号地共用了同一个回路\"，加隔离放大器解决。**信号噪声问题 80% 是接地问题**；50 Hz/100 Hz 噪声基本可断定为电源工频干扰。\n\n\n### `H284` 硬件集成三大原则\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**硬件集成三大原则**：先接地后接信号、强弱电分离、每个接口做标签。作者因一根屏蔽线没接地导致仿真机\"看门狗复位\"，查了三天。\n\n\n### `H285` 参数表会骗人\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**参数表会骗人**。选了一块标称 1 MS/s 的采集卡，\"闭环跑的时候延迟直接飙到 5 ms 以上，是驱动没配好、中断优先级太低\"；某项目用普通 PC 做实时仿真，10 ms 帧周期下频繁丢帧。\n\n\n### `H286` 实时任务优先级\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**实时任务优先级**：接口 I/O > 模型计算 > 数据通信（VxWorks 中数字越小优先级越高，100 > 120 > 150）。接口 I/O 一旦错过周期，硬件会报错甚至损坏。\n\n\n### `H287` TCP 传实时数据会崩\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**TCP 传实时数据会崩**。某次联调用 TCP 传遥测，\"交换机缓存溢出，TCP 包被延迟了 200 毫秒，整个仿真系统直接崩溃\"；传小数据记得关 Nagle（TCP_NODELAY）。反射内存网必须做**地址分区**防写冲突，节点 ID 必须唯一。\n\n\n### `H288` 测试三步走，不能跳\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**测试三步走，不能跳**：开环 → 闭环 → 全系统联调。软件集成\"分层集成、逐级验证\"：驱动自检 → 空模型（只做 IO 映射）→ 完整模型。**很多团队跳过前两步直接上闭环，出了问题不知道是模型错还是硬件坏**。\n\n\n### `H289` 排故三板斧\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**排故三板斧**：① 信号注入法（标准正弦/方波/阶跃逐级注入，偏差 >5% 要警惕）——作者靠它查出调理板增益电阻焊错导致幅值大了 1.2 倍；② 分段隔离法（从中间一刀切，半小时定位困扰团队两周的问题）；③ 对比验证法（与纯数学仿真比，**差异 >10% 肯定有问题**，5% 以内可接受）。\n\n\n### `H290` 每次半实物前先跑\"延迟标定\"程序\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**每次半实物前先跑\"延迟标定\"程序**：给飞控板发方波，看回来什么波形，延迟一目了然。\n\n\n### `H291` 信号模拟器要定期校准\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**信号模拟器要定期校准**。某项目\"模拟器的相位噪声比真实环境差了 20 dB，导致测出来的抗干扰性能虚高\"——实验室全优，外场掉链子。\n\n\n### `H292` 校准三级递进\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**校准三级递进**：传感器级（零偏/线性度/温度补偿，$-40\\sim+85^\\circ$C 温度循环）→ 通道级（增益/偏置/相位延迟/噪声基底，**校准信号带宽至少是工作带宽的 2 倍**）→ 系统级（闭环自检 + 残差分析）。某 MEMS 陀螺 25°C 零漂 0.02°/s、85°C 变 0.15°/s，不做温度补偿\"弹体转个 90° 弯，姿态误差能差十几度\"。项目中给校准留**至少 30% 的时间**。\n\n\n### `H293` 联调必做故障注入\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**联调必做故障注入**。作者故意让舵机卡死在最大偏角，\"结果控制律直接发散，仿真机过载保护跳闸\"，后来在控制律里加了限幅和速率限制。**正常工况跑得再好，也不如一次故障注入有价值**。\n\n\n### `H294` 数据管理\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**数据管理**：命名用\"日期_试验编号_工况编号_重复次数\"，数据**自动保存 + 每工况手动备份**（作者曾因忘点保存，12 小时试验全部白费）。试验计划时间**乘 1.5 倍**作为预留。\n\n\n### `H295` 仿真结果乘 1.3 才是真实需求\n\n\n> 出处：D-04 《半实物仿真系统搭建——三层两环架构、实时性、时序同步与可信度》\n\n\n**仿真结果乘 1.3 才是真实需求**。\n\n\n### `H296` 仿真 0.5 m、外场 3 m\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**仿真 0.5 m、外场 3 m**——漏了导引头测量噪声。另一次团队仿真 0.2 m，\"结果外场试验因为没考虑导引头盲区，脱靶量变成了 5 米\"。\n\n\n### `H297` 导引头噪声是距离相关的\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**导引头噪声是距离相关的**。作者曾用固定噪声模型，\"仿真结果漂亮得很，一上靶场就露馅\"。**远距离时噪声可能增大 3~5 倍**，必须在仿真中加入距离-噪声曲线。\n\n\n### `H298` 有色噪声不能用白噪声建模\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**有色噪声不能用白噪声建模**。GPS 误差必须用一阶马尔可夫；有色噪声用高斯白噪声替代会让仿真精度虚高。\n\n\n### `H299` 只看均值会翻车\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**只看均值会翻车**，看 **95% 分位数**。\"如果 95% 的脱靶量都在 1 米以内，那这个制导律才算真正可靠。\"（A 域同一作者也强调过：前任只报告平均脱靶量 3.2 m，实弹有一发 28 m，重做分析发现 95% 分位数达 22 m。）\n\n\n### `H300` 不确定性分布假设错了，结论完全相反\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**不确定性分布假设错了，结论完全相反**。见过团队假设参数均匀分布、实际是高斯分布，\"结果仿真结论完全相反\"。\n\n\n### `H301` 最坏情况不只扫边界，还要扫内部\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**最坏情况不只扫边界，还要扫内部**。作者只做边界扫描翻过车：\"K 和 τ 同时偏离标称值，但都没到边界，系统却失稳了——那是参数组合的'共振点'。\"\n\n\n### `H302` 理论稳定边界上再加 20% 裕度\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**理论稳定边界上再加 20% 裕度**是作者的个人铁律。\n\n\n### `H303` 气动参数偏差可达 20%\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**气动参数偏差可达 20%**；某项目仿真过载需求 12 g，实际因气动偏差飙到 18 g，\"结果导弹在空中解体了\"。**至少留 30% 过载裕度**。\n\n\n### `H304` 蒙特卡洛收尾判据\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**蒙特卡洛收尾判据**：跑 500 次以上，脱靶量均值 <3 m 且标准差 <1 m；**仿真结果乘 1.3 才是真实需求**。\n\n\n### `H305` 多变量系统要做奇异值检查\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**多变量系统要做奇异值检查**。\"解耦后时域响应很好，但奇异值分析显示系统接近奇异——解耦补偿器引入了数值病态。**别被时域表现骗了**。\"\n\n\n### `H306` 3σ 去野点不能直接用\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**3σ 去野点不能直接用**。数据有阶跃变化（如导弹转弯）时 3σ 会把真实信号干掉；**先做滑动窗口，窗口宽度取系统时间常数的 3~5 倍**。\n\n\n### `H307` 重采样时阶跃信号必须用零阶保持器\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**重采样时阶跃信号必须用零阶保持器**。\"我曾经把舵机阶跃响应插值成了斜坡，导致频域分析时相位特性完全错了。\"\n\n\n### `H308` 时间基准差 0.1 秒 → 分析结果完全错误\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**时间基准差 0.1 秒 → 分析结果完全错误**。外场分析中遥测与地面雷达时间基准没对齐是高频翻车点；另有一次\"误差怎么都找不到原因，后来发现是仿真计算机时钟漂移导致采样时间不均匀\"。\n\n\n### `H309` 模型校准警惕过度拟合\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**模型校准警惕过度拟合**。\"为了拟合某次飞行试验数据，把气动系数调得面目全非。结果换一个飞行条件，模型完全不准了。\"正确流程：**敏感性分析 → 参数辨识 → 交叉验证**，且**校准后参数必须在物理合理范围内**（如 $C_D$ 不能为负）。\n\n\n### `H310` 哪怕只有一次飞行试验数据，也比一百次仿真数据有价值\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**哪怕只有一次飞行试验数据，也比一百次仿真数据有价值**——真实环境里有很多模型没考虑的因素。\n\n\n### `H311` 误差来源定位表\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**误差来源定位表**（C3 第15章）：传感器噪声 → 高频抖动 → 频谱分析；执行机构延迟 → 相位滞后 → 频域分析；模型简化 → 低频偏差 → 对比纯数字仿真；接口量化误差 → 阶梯状响应 → 检查 AD/DA 位数。\n\n\n### `H312` 抗干扰场景要看\"精度退化曲线\"而非单点指标\n\n\n> 出处：D-05 《误差建模、蒙特卡洛与精度评估》\n\n\n**抗干扰场景要看\"精度退化曲线\"而非单点指标**。某型弹无干扰 CEP 5 m，加某种压制干扰后 CEP 变 50 m——\"虽然还能命中，但已经失去了作战价值\"。作者因此在指标里加了\"**失锁恢复时间 ≤ 0.5 s**\"（某次外场命中概率 100%，但遥测显示每次失锁都发生在干扰功率突变瞬间）。\n\n\n### `H313` 干扰吃裕度的实测\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**干扰吃裕度的实测**：某型弹无干扰稳定裕度 12 dB，加干扰后\"导引头等效噪声带宽变宽、相位滞后增加，稳定裕度直接掉到 3 dB 以下，脱靶量从 2 米变成 20 米\"。\n\n\n### `H314` 干扰的影响不是线性的\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**干扰的影响不是线性的**：\"有时候干扰功率增加 3 dB，脱靶量可能增加 10 倍。抗干扰设计不能只靠'加功率'解决。\"\n\n\n### `H315` 只盯导引头会翻车\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**只盯导引头会翻车**。\"导引头扛住了干扰，但计算机算出的指令让舵机饱和了，导弹照样打不准。**抗干扰设计一定要从系统层面考虑**。\"\n\n\n### `H316` 速度欺骗功率只需真信号的 1/10\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**速度欺骗功率只需真信号的 1/10**——因为速度跟踪环路对幅度不敏感。\n\n\n### `H317` 复合干扰是 1+1=3\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**复合干扰是 1+1=3**，\"两种干扰的相互作用会产生非线性效应，比如互调产物会落在信号带宽内\"。\n\n\n### `H318` 多干扰源距离小于半波长会形成等效合成干扰源\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**多干扰源距离小于半波长会形成等效合成干扰源**，方向图会变化，不能当独立信号处理。\n\n\n### `H319` 零陷：仿真 -40 dB，实际 -25 dB 就不错了\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**零陷：仿真 -40 dB，实际 -25 dB 就不错了**。作者见过最好的 -60 dB。**零陷越深，其他方向副瓣抬升越明显**，且方向估计有误差时零陷会打偏——用对角加载提高稳健性。\n\n\n### `H320` 陷波器 Q 值太高会毁掉测角精度\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**陷波器 Q 值太高会毁掉测角精度**：\"有用信号的相位在陷波点附近发生剧烈变化\"。陷波器是双刃剑。\n\n\n### `H321` 认知顺序：能用时域解决的绝不用频域，能用频域解决的绝不动用时频域\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**认知顺序：能用时域解决的绝不用频域，能用频域解决的绝不动用时频域**——越往后计算量越大。\n\n\n### `H322` 变增益 PN\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**变增益 PN**：干扰强时降低 $N$ 让导弹\"反应慢一点\"。某空地弹干扰下脱靶量 2 m→8 m，\"加了变增益逻辑，脱靶量压回到 3 米以内\"。\n\n\n### `H323` 滑模制导律的抖振坑\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**滑模制导律的抖振坑**：\"仿真时脱靶量 0.5 米，一上实弹，舵机抖得跟筛子似的\"。对策是用饱和函数代替符号函数做边界层（太宽抗干扰能力下降、太窄抖振回来），或上 Super-Twisting 高阶滑模（不需知道干扰导数、只需干扰有界）。\n\n\n### `H324` 自适应最优制导\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**自适应最优制导**：学生实验中\"干扰环境下脱靶量比固定增益降低了 40%\"。但**最优制导律假设干扰是白噪声**，拖曳式诱饵根本不是，必须走鲁棒（min-max）或自适应路线；且**计算量大，老式 DSP 可能跑不动，工程实现前先做实时性评估**。\n\n\n### `H325` \"抗干扰设计，七分靠制导律，三分靠滤波\"\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**\"抗干扰设计，七分靠制导律，三分靠滤波\"**——把滤波和估计做好往往事半功倍。\n\n\n### `H326` 多传感器融合的经典判据\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**多传感器融合的经典判据**：某次复合干扰下\"雷达说目标在左边，红外说在右边，两个传感器各自被欺骗了。融合后发现空间位置不一致、运动轨迹也不匹配——两个都是假的，真目标藏在中间那条航迹上\"。\n\n\n### `H327` 异类传感器时空配准是最头疼的问题\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**异类传感器时空配准是最头疼的问题**。作者曾查三天发现红外支架有 **0.1° 微小变形——10 km 外就是 17 米偏差**，\"从那以后我每次做空间配准都会先做一次现场标定\"。配准精度要求：**时间配准优于最高采样周期的 1/10**；坐标转换矩阵必须用双精度；安装误差建议每季度标定一次。\n\n\n### `H328` 融合权重千万别用固定权重\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**融合权重千万别用固定权重**。\"一开始用固定权重，结果在干扰切换时系统反应迟钝\"，改成按信噪比、数据一致性、历史可靠性动态调整后\"效果立竿见影\"。作者优先推荐**特征级融合**（性价比最高），决策级最易实现但抗干扰能力有限。\n\n\n### `H329` 多模复合不是模式越多越好\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**多模复合不是模式越多越好**，\"模式多了数据融合复杂度指数级上升。我建议**最多三种模式**，再多就得不偿失了\"。\n\n\n### `H330` 中段/末段交接是最脆弱环节\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**中段/末段交接是最脆弱环节**，干扰机最爱在此下手。**绝不能用单一特征（如信噪比）做判决**——作者吃过亏：\"干扰机把信噪比做得很高，导引头直接锁了假目标\"，改成多特征联合判决 + 运动一致性校验。交接要用状态机管理（MID_COURSE → HANDOVER_PENDING → HANDOVER_ACTIVE → TERMINAL_ACTIVE），超时回退中段，并保留\"记忆跟踪保持\"。\n\n\n### `H331` 扰动观测器带宽别贪高\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**扰动观测器带宽别贪高**：设到 200 Hz，\"高频噪声被放大，平台反而抖得更厉害\"，取伺服带宽 3~5 倍即可。\n\n\n### `H332` 前馈是双刃剑\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**前馈是双刃剑**：\"前馈系数算错了 10%，系统响应超调量从 5% 飙到 25%\"，必须配合在线辨识；**前馈通道一定要限幅，取额定值的 80%**（作者忘加限幅烧过驱动器）。\n\n\n### `H333` 机械耦合是稳定平台的隐形杀手\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**机械耦合是稳定平台的隐形杀手**：实验室 0.05 mrad，上车变 0.3 mrad——\"安装基座的共振频率和弹体振动频率重合了\"，铝合金基座换钢制基座解决。\n\n\n### `H334` 综合案例实测（反舰弹，多域协同方案）\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**综合案例实测（反舰弹，多域协同方案）**：\n\n| 干扰场景 | 干信比 | 未抗干扰命中概率 | 抗干扰后 | 提升 |\n|---|---|---|---|---|\n| 无干扰 | 0 dB | 95% | 96% | +1% |\n| 噪声压制 | 25 dB | 12% | 87% | +75% |\n| 距离欺骗 | 15 dB | 8% | 91% | +83% |\n| 组合干扰 | 20 dB | 3% | 78% | +75% |\n\n关键参数：波束宽度 2.5°、跳频 2000 跳/秒（带宽 2 GHz）、脉冲压缩比 1000:1、极化切换 <1 μs；多域融合权重 **频域 0.3 / 时域 0.3 / 空域 0.25 / 极化 0.15**（权重用蒙特卡洛统计各模块正确率后确定，不是拍脑袋）。半实物阶段暴露 ADC 采样时钟抖动导致频域误判（加锁相环解决）、空域波束偏 0.5°（阵元相位校准数据没更新）。\n\n\n### `H335` 外场试验\"三三制\"\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**外场试验\"三三制\"**：3 种干扰样式 × 3 个功率等级 × 3 个目标场景 = **至少 27 次试验**。见过只做 5 次就敢说\"验证通过\"，\"定型时被专家问得哑口无言\"。\n\n\n### `H336` 评估指标必须包含干扰条件的完整描述\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**评估指标必须包含干扰条件的完整描述**。某项目指标只写\"命中概率 ≥85%\"，\"外场试验时干扰机功率只开了 60%，数据全达标——但实际作战时敌人会只开 60% 功率吗？\"\n\n\n### `H337` HIL 抗干扰实测（某型空空弹，红外制导）\n\n\n> 出处：D-06 《抗干扰设计——干扰机理、多域协同与性能评估》\n\n\n**HIL 抗干扰实测（某型空空弹，红外制导）**：无干扰脱靶 1.2 m / 制导 8.5 s；单发干扰弹 2.8 m / 9.1 s；多发干扰弹 5.6 m / 10.3 s。改进制导律抗干扰逻辑后降到 3 m 以内。**红外 HIL 最难的不是硬件接口，而是\"让导引头看到它该看到的东西\"**——作者曾因目标辐射模型少一个波段，导引头一直锁定不了目标。\n\n\n## 域 E：飞行器轨迹控制\n\n\n### `H338` 栅格分辨率\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**栅格分辨率**：四旋翼室内 0.1 m、室外开阔 0.5 m 基本够用。**必须做障碍物膨胀**，膨胀半径至少飞行器半径的一半——作者没膨胀，规划路径贴墙飞，撞上了凸出的门把手。三维栅格内存是 $O(n^3)$：0.1 m 分辨率建 100 m³ 空间 = 1000³ = 10 亿格 ≈ 1 GB，实际项目要用八叉树。\n\n\n### `H339` A\\* vs Dijkstra 实测\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**A\\* vs Dijkstra 实测**（100×100 栅格）：Dijkstra 探索约 7000 节点（约 70%），A\\* 约 2000 节点，**效率 3 倍以上**。作者曾用 Dijkstra 做实时重规划，地图一更新就卡死。他的惯用组合拳：**先 A\\* 快速找可行路径，再 Dijkstra 做局部优化**。\n\n\n### `H340` 平滑后必须再做碰撞检测\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**平滑后必须再做碰撞检测**。作者偷懒没做，平滑路径穿墙，差点撞机。\"安全第一，平滑第二\"。\n\n\n### `H341` RRT 步长取环境特征尺寸的 5%~10%\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**RRT 步长取环境特征尺寸的 5%~10%**。太大跳过狭窄通道，太小树长得慢。三维实现：采样次数至少是二维的 **3~5 倍**；近邻搜索用 KD-Tree（作者用 nanoflann）；**Goal Bias 5%~10%** 直接采样目标点；双向 RRT\\* 比单向**快 2~3 倍**。\n\n\n### `H342` RRT vs RRT\\* 实测\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**RRT vs RRT\\* 实测**（无人机三维避障）：同样环境，RRT 采样 5000 次得到 32 m 路径；RRT\\* 采样 8000 次得到 **24 m** 且更平滑，代价是计算时间多约 **40%**。毫秒级决策用 RRT，允许几秒规划就用 RRT\\*。\n\n\n### `H343` 避坑：RRT\\* 重布线后必须递归更新所有子节点的 cost\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**避坑：RRT\\* 重布线后必须递归更新所有子节点的 cost**。作者忘了更新，路径虽短了但树结构乱了，后续规划出错。\n\n\n### `H344` 阶数不是越高越好\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**阶数不是越高越好**。作者用 Minimum Crack（五阶）算出来的轨迹**起点终点控制量直接爆了**；用高阶多项式拟合整条轨迹出现**龙格现象**（两端剧烈振荡）。记住\"**分段比整体更稳定**\"，分段处要保证速度、加速度甚至加加速度连续，只保证位置连续飞机会\"磕头\"。\n\n\n### `H345` B 样条 vs 贝塞尔\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**B 样条 vs 贝塞尔**：做编队表演时甲方改一个航点，贝塞尔要重算所有飞机轨迹，改用 B 样条解决——因为 B 样条有**局部性**，在线重规划只改局部控制点。**必须用\"夹紧\"B 样条**（首尾节点重复 degree+1 次），否则曲线不过首尾控制点，起点终点到不了。嵌入式上控制点 ≤20 个、阶数 ≤3。\n\n\n### `H346` 硬约束设太死会无解\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**硬约束设太死会无解**。作者把避障距离设成硬约束，狭窄通道里求解器一直报错；改成软约束加指数惩罚项解决。但软约束**惩罚权重不能太小**，否则轨迹贴着障碍走。他的约束添加顺序：**先不加约束跑通，再逐个加**，出问题能快速定位。\n\n\n### `H347` 走廊约束用\"关键帧约束法\"降规模\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**走廊约束用\"关键帧约束法\"降规模**：100 m 走廊每米一个约束 = 100 组不等式，求解器跑不动；只在拐弯处、狭窄处加约束，**约束数 100→10，求解时间从秒级降到毫秒级**。走廊段之间**必须留重叠**（作者留 0.5 m），否则过渡时找不到连续路径。\n\n\n### `H348` 时间分配用 S 形而非梯形\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**时间分配用 S 形而非梯形**。梯形在加减速切换点**加加速度无穷大**，物理上不可能实现，飞机明显\"点头\"。\n\n\n### `H349` 时间最优必须留余量\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**时间最优必须留余量**：时间缩放后作者建议再留 **5%~10%**，因为还有风扰和传感器延迟——\"我曾经吃过这个亏，余量留少了，转弯处差点失控\"。离散点数 $N$ 取 100~200，太小会导致加速度跳变。\n\n\n### `H350` Tube 管道半径的标定\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**Tube 管道半径的标定**：一开始选太小，扰动稍大就出管；改成**用实际飞行数据标定扰动上界**。也不要设太大——管道太粗轨迹过于保守，飞行时间直接翻倍；作者后来改用统计方法取 **95% 置信区间**。管道半径里**要额外加一项传感器噪声**，否则真实状态会\"看起来\"出管。\n\n\n### `H351` 求解器选型与加速\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**求解器选型与加速**（C1 第26章实测）：CVXOPT 方便但慢（500 维问题近 2 分钟）；**OSQP 是实时首选**（四旋翼避障 50 ms 周期，平均求解 8 ms；STM32 上 10 步预测单步约 2 ms）；Gurobi 最强（2000 变量/5000 约束，OSQP 30 s 未收敛，Gurobi 2 s 全局最优）。加速三板斧：**热启动**（省一半迭代）、**精度 1e-6→1e-3**（省 30%~50%）、**约束矩阵转稀疏 + 去冗余**（1000 约束压缩到 200，时间砍半）。作者实测四旋翼实时避障从 **15 ms 优化到 3 ms**。**每次必须检查 status 是否为 'solved'**——有人没检查，直接拿不可行解去控制飞行器。\n\n\n### `H352` 权重整定\n\n\n> 出处：E-01 《轨迹规划方法全景：图搜索 / 采样 / 参数化优化 / 微分平坦与约束建模》\n\n\n**权重整定**：作者的习惯是**先跑一次不带权重的优化，看各代价的量级，再反推权重**；调参时固定两个、只调第三个。各维度数值范围可能差几个数量级（平滑度 0.001 vs 安全性 1000），**不归一化权重就没意义**。项目不同阶段权重不同：**初期偏安全、中期偏平滑、后期偏时间效率**。\n\n\n### `H353` 串级调参铁律\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**串级调参铁律**：**先内环后外环，绝不同时调两个环**（否则分不清问题在哪）。作者的实测参数：内环 $K_p=0.15,\\ K_d=0.02,\\ K_i=0.005$；外环 $K_p=4.5,\\ K_d=0.3$。**外环只用 PD 不加 I**——内环已有 I，外环再加会低频震荡。另一个案例：姿态环 P 从 1 试到 0.2 都不理想，加 $D=0.1$ 后 P 回到 0.5 效果刚好，**\"P 和 D 的配合\"**。\n\n\n### `H354` 位置环 P 不能大\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**位置环 P 不能大**：GPS 误差可能到米级，P 太大飞机来回晃。作者从 0.5 试起，晃就降到 0.3，慢就加到 0.8。\n\n\n### `H355` 抗积分饱和\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**抗积分饱和**：新手先用**积分限幅**（简单可靠，作者靠它解决 90% 的问题），再上**反计算法**（更平滑，增益取 0.5 可调），或**条件积分**（只在误差小于阈值时积分）。他见过 I 设太大、飞机一启动就往前冲差点撞墙。\n\n\n### `H356` LQR 的坑\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**LQR 的坑**：$R$ 设成 0.001 直接**电机满油门**；纯 LQR 无积分、稳态误差消不掉（做 LQI 时积分项权重取状态权重的约 0.1 倍，避免 windup）；**模型里阻尼系数高估 20%，上机就持续低频抖动**。作者的忠告：\"LQR 不是万能的，它需要准确的模型。\"\n\n\n### `H357` MPC 参数\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**MPC 参数**：预测时域 $N=10\\sim20$（作者从系统上升时间的 1.5 倍起试）；$Q$ 大跟踪紧但会**为追一个噪声点疯狂抖动**——作者加了 $\\Delta u$ 的 $S$ 项才解决；**R 从 0.1 调到 1.0，四旋翼抖动直接消失**。调参顺序：**先固定 R 调 Q**。\n\n\n### `H358` MPC 必加输入饱和约束\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**MPC 必加输入饱和约束**。作者忘了加，MPC 算出油门 2.0（实际最大 1.0），飞行器直接失控翻跟头——\"从那以后每次跑 MPC 前都先检查约束矩阵是否生效\"。\n\n\n### `H359` 线性化点别太稀疏\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**线性化点别太稀疏**：轨迹曲率变化大（急转弯）时**每 5 步重新线性化一次**；每次更新参考轨迹重算 $A,B$。嵌入式优化：**QP 矩阵组装放初始化，运行时只更新参考轨迹和初值**。\n\n\n### `H360` 求解失败先放松约束\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**求解失败先放松约束**。osqp 返回 \"problem unsolved\" 时，多半是位置限制与速度限制冲突（如要求 0.1 s 内从 0 到 10 而速度上限 5）。**先放松、求解稳定后再慢慢收紧**；硬约束必加**松弛变量**——作者把约束设太紧导致频繁找不到可行解。\n\n\n### `H361` 别迷信 NMPC\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**别迷信 NMPC**。作者见过用 NMPC 控制线性系统，因求解器收敛问题导致控制周期抖动，\"还不如 PID\"。判断准则：**小范围工作（悬停、小角度转弯）用 LMPC 稳定得多**；大迎角/参数剧变/吊挂负载才上 NMPC。NMPC 上机必须靠**RTI 实时迭代 + 热启动**，标准 NLP 求解动辄几十到上百毫秒，而飞控周期只有 10~20 ms。\n\n\n### `H362` 反步法\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**反步法**：$c_1$ **从 1 开始调**，作者设成 100 导致控制器输出剧烈震荡差点烧电机；$\\dot\\alpha_{n-1}$ **千万别直接差分**（噪声放大到不可控），用数值微分或跟踪微分器（TD）；**反步法本身不处理饱和**，需另外加抗饱和补偿器；离散化采样频率至少是带宽的 10 倍（作者用 1 kHz）。\n\n\n### `H363` 滑模\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**滑模**：$c$ 从 **5** 开始试，取值 1~20，$c=100$ 控制量直接饱和；$k=10\\sim20$、$\\varepsilon=0.1\\sim0.5$；边界层 $\\Phi=0.01\\sim0.1$——作者把 $\\Phi$ 设成 0.5，**抖振没了但跟踪误差大了两倍**；采样频率至少带宽的 10 倍，否则抖振加剧。\n\n\n### `H364` 几何控制的头号坑：姿态误差符号\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**几何控制的头号坑：姿态误差符号**。$R_e=R_d^TR$ 与 $R_e=R^TR_d$ 差一个转置，控制效果完全相反——作者实飞时飞机剧烈震荡，排查半天才发现。增益比例 **$K_R:K_\\omega=1:2$ 到 $1:5$**，先调 $K_\\omega$ 稳角速度环，再调 $K_R$。**姿态积分不能用欧拉法**（$R+\\Delta t\\dot R$ 不在 $SO(3)$ 上），要用指数映射；推力必须限幅在 $[f_{min},f_{max}]$。\n\n\n### `H365` 前瞻制导 vs PID 的实测\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**前瞻制导 vs PID 的实测**（C3 第29章，多旋翼抗风扰综合案例）：**ESO + 滑模方案的稳态误差只有纯 PID 的 22%，恢复时间快近 3 倍**。外环用非线性前瞻制导而非 PID，因为\"PID 在曲线轨迹上永远追着目标跑，差一口气\"。\n\n\n### `H366` 前馈 + MPC 的实测\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**前馈 + MPC 的实测**（C1 第30章）：四旋翼以 **12 m/s** 通过 5 个门框组成的赛道，**加前馈后跟踪误差比纯 MPC 减少约 40%**。权重经验值：**位置 100、速度 10、姿态 1**。前馈的作用是\"提前告诉飞行器马上要转弯了，准备好力矩\"。\n\n\n### `H367` MPC 采样时间\n\n\n> 出处：E-02 《轨迹跟踪控制律：串级PID / LQR / MPC / 反步 / 滑模 / 几何控制 / 前瞻制导的适用边界与整定》\n\n\n**MPC 采样时间**：四旋翼 **20~50 ms 合理**；作者曾设 10 ms 结果算不过来直接炸机。电机转速上限**留 10% 余量**，否则遇强风时控制量刚好在边界、毫无裕度。\n\n\n### `H368` 数值：矩阵求逆是万恶之源\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**数值：矩阵求逆是万恶之源**。Minimum Snap 直接求解时**条件数动不动上亿**，求解结果完全不能用。三条对策：① **时间归一化**，把每段时间归一化到 $[0,1]$，条件数好很多；② 求逆改用 **Cholesky 或 QR 分解**（作者：\"数值稳定性差一点，结果就差十万八千里\"）；③ **加断言检查约束矩阵的秩是否等于约束个数**，秩不够说明约束冗余或冲突。作者曾漏掉一行连续性约束，轨迹在连接点加速度突变，飞控直接报错。\n\n\n### `H369` 不等式约束的\"暴力但有效\"处理\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**不等式约束的\"暴力但有效\"处理**：先解无约束轨迹，检查是否超限，超限就在超限点附近插入新航点重新求解。\n\n\n### `H370` RTOS：抢占式调度 + 优先级继承\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**RTOS：抢占式调度 + 优先级继承**。作者姿态控制任务优先级设 10、通信设 5；某次姿态偶尔抖动，查了两天是**中优先级的日志任务占用 CPU、导致高优先级 IMU 任务拿不到 I2C 总线锁**，加优先级继承协议解决。**尽量少用锁**——用消息队列传数据，别用共享内存加锁；他见过一个项目为省内存用全局变量加锁，锁竞争导致控制周期抖动，全改成消息队列才稳定。\n\n\n### `H371` 中断服务函数里绝不做矩阵运算\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**中断服务函数里绝不做矩阵运算**，只做数据采集和置标志位，矩阵运算放主循环。**禁止在 ISR 里跑辨识**。\n\n\n### `H372` 代码生成三档选型\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**代码生成三档选型**：**Simulink Coder** 快、用于早期验证与 HIL（但代码质量一般）；**Embedded Coder** 可精细控制存储类/变量类型/内存对齐，可把 IMU 数据直接映射到 SPI 外设寄存器；**手写 C++** 用 CMSIS-DSP + SIMD，**性能至少提升 30%**，代价是维护成本与移植性。作者实测：Simulink Coder 生成代码部署到无 FPU 的 MCU，**CPU 占用飙到 90% 以上**。\n\n\n### `H373` 浮点一致性坑\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**浮点一致性坑**：手写 EKF 在 STM32H7 上跑得好，换到 GD32 结果不一致——两个 MCU 的 FPU 对 NaN/Inf 的处理不同。**手写代码必须加浮点一致性检查**。\n\n\n### `H374` MIL→SIL 的三类经典差异\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**MIL→SIL 的三类经典差异**（作者全踩过）：① MIL 用连续积分器、代码只能用离散积分；② **MIL 里浮点没问题，SIL 里定点截断导致积分项漂移，飞 30 s 后姿态开始抖**；③ **MIL 输入弧度、SIL 写成角度，差 57 倍**。\n\n\n### `H375` 回归测试\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**回归测试**：用例**至少 50 个**；作者只覆盖正常工况，改了限幅逻辑后大机动时姿态失控。用 CI 自动触发；**每次输出要画 MIL/SIL 曲线叠加图**——\"只看数值对比，曲线形状不一样都没发现\"。MIL 阶段就要加传感器噪声模型，否则 SIL 加噪声直接发散。\n\n\n### `H376` HIL 延迟\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**HIL 延迟**：作者因舵机响应延迟比模型多 5 ms，PID 从稳定变振荡（相位裕度掉一大截）。**延迟超过系统主导时间常数的 1/10，补偿效果急剧下降**，此时应优化硬件链路而非死磕软件。对策：共享时钟源 + 环形缓冲区补偿固定拍数。\n\n\n### `H377` HIL 接口细节\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**HIL 接口细节**：实时机默认输出 400 Hz 而舵机只能响应 200 Hz，HIL 里跑得好、上真机一直抖；±10 V 板卡接 0~3.3 V 飞控 ADC 会冒烟，必须加调理；**必加隔离放大器**（作者偷懒没加，飞控电源一波动烧了实时机模拟输入通道）；**仿真机模型更新率至少是飞控采样率的 2 倍**（1 kHz IMU vs 500 Hz 模型 = 数据全混叠）；实时机要有\"安全输出\"状态，等飞控握手后再切正常模式；**必须加看门狗，飞控死机时 100 ms 内停仿真**，否则舵机满偏能打坏台架（作者换过一个舵机臂）。\n\n\n### `H378` HIL 测不出来的三件事\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**HIL 测不出来的三件事**：电机 EMI 耦合到传感器线缆、螺旋桨振动引发的共振、真实电源波动。作者的对策：**HIL 通过后先做\"系留飞行\"——拴住离地 30 cm 悬停**，能暴露大量 HIL 发现不了的问题，稳了再解锁全自由飞行。\n\n\n### `H379` 安全冗余三件套\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**安全冗余三件套**（C2 第28章）：**软件看门狗**（硬件看门狗检测不了\"逻辑死锁\"——任务死循环但中断还在跑，照样能喂狗）；**心跳**（内部心跳让控制模块发现姿态模块停止更新就切备用源；外部心跳连续丢 **3~5 次**再触发动作，别设太死）；**降级策略必须有恢复机制**——作者做过一个降级，切到备用传感器后不切回来，备用也坏了直接崩溃。\n\n\n### `H380` FMEA 要随版本迭代\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**FMEA 要随版本迭代**。作者改了一版滤波器参数却忘了更新 FMEA，新参数在某些工况下导致 IMU 数据发散。他的结论：**RPN 最高的往往不是发生概率最高的，而是后果最严重的**（案例中 IMU 加速度计饱和 → 必须做双 IMU 冗余）。\n\n\n### `H381` 控制分配\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**控制分配**：**伪逆法必须加限幅**（作者忘了加，仿真里执行器输出爆表、姿态乱跳）；伪逆会把控制量均匀分到所有执行器，但响应快慢/易饱和程度不同，均匀分配往往不是最优；**链式递增法**（响应快的优先，如舵面优先于推力矢量）时**优先级设反会导致主执行器一直饱和、辅助执行器闲着**。建议：**先用伪逆做基准，再按执行器特性调整，不要一上来就用复杂方法**。\n\n\n### `H382` 机载辨识的实时性\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**机载辨识的实时性**：飞控 CPU 只有几百 MHz，**一次矩阵求逆地面 0.1 ms、机载 10 ms，一次就把整个 10 ms 控制周期吃掉**。对策：**分时切片**（这个周期更新协方差、下周期更新增益、再下周期更新参数，每周期只占 2~3 ms）；**3×3 矩阵用 Cholesky 分解比直接求逆快 40%**（实测）；协方差矩阵要加**平方根形式或小正则化项**，否则会变非正定直接崩溃；**32 位全局时间计数器约 71 分钟溢出一次**，要用 64 位或加溢出处理；**连续丢包超过 3 次就暂停辨识**，用上一时刻参数顶替。\n\n\n### `H383` 接口先定义再写代码\n\n\n> 出处：E-03 《轨迹控制算法工程化：离散化、代码架构、实时性、数值稳健与异常处理》\n\n\n**接口先定义再写代码**。作者：\"代码写完了才发现位置估计输出的坐标系和控制器期望的不一致，改了一整天。\" 另外两个必查项：**四元数必须归一化**（见过跑几分钟模长变成 1.5，姿态直接崩）；**偏航角用 atan2 不要 atan**（用 atan 导致在 ±π 附近跳变，飞机原地打转）。\n\n\n### `H384` 建模阶段的三个坑\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**建模阶段的三个坑**：① **惯性矩阵 $J$ 不是常数**——随燃油消耗变化，作者忽略了导致**仿真与试飞差 15%**；② **风洞数据不能直接上天**——某型无人机滚转阻尼比预期小了近 20%，查出来是**雷诺数效应**；③ **小攻角假设不能乱用**——作者在高攻角项目里直接线性化，仿真很好、试飞直接进失速螺旋。他的习惯：**建模完成后先做开环仿真，看响应是否符合物理直觉；开环都跑不对，闭环更别想**。拿到新项目先花至少 30% 时间摸透模型。\n\n\n### `H385` 摄动范围要\"适度保守\"\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**摄动范围要\"适度保守\"**：太松控制器过于保守，太紧可能失稳。作者的做法：**用风洞或试飞数据统计参数变化范围，再留 20%~30% 余量**。\n\n\n### `H386` 滑模\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**滑模**：$c$ 从 5 起（1~20），$c=100$ 控制量饱和；$\\Phi=0.01\\sim0.1$，**$\\Phi=0.5$ 抖振没了但误差大两倍**；**符号函数直接用会烧舵机**（作者在俯仰通道直接上 sign，高频抖振把舵机烧了）。\n\n\n### `H387` 高阶滑模的实测\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**高阶滑模的实测**：一阶滑模时舵机在 **0.5° 幅度高频摆动**，换二阶滑模后舵机动作明显柔和，**轨迹跟踪精度反而提升 30%**。但**把 $k_2$ 调大 20%，抖振反而增加**（积分项响应太快引入新高频）。调参顺序：**先调 $k_2$（收敛速度）再调 $k_1$（抗扰能力）**。三阶滑模残余抖振更小但**响应慢了 50 ms**。高阶滑模含积分环节，**必加 anti-windup**；**执行器有严重死区/滞环时，再高阶的滑模也救不了——先解决硬件**。\n\n\n### `H388` 滑模 vs PID 实测\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**滑模 vs PID 实测**（无人机高度控制）：有风扰下滑模高度偏差 **±5 cm**，PID 跑到 **±15 cm**；代价是油门有高频抖动，用边界层处理后可接受。\n\n\n### `H389` ADRC 的头号坑是 $b_0$\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**ADRC 的头号坑是 $b_0$**。作者一开始直接用手册电机推力系数算，**ESO 发散**；改用\"给阶跃信号测加速度响应反推 $b_0$\"。**$b_0$ 差 20%，控制效果天差地别**；**符号搞反系统直接发散**。\n\n\n### `H390` ADRC 调参顺序\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**ADRC 调参顺序**：**先调 ESO 再调 SEF**。ESO 按带宽法整定（$\\beta_1=3\\omega_o,\\beta_2=3\\omega_o^2,\\beta_3=\\omega_o^3$），$\\omega_o$ 调大估计快但噪声敏感；**先给固定控制量，看 $z_1$ 能否跟上实际状态、$z_3$ 能否稳住**。SEF 的 $k_p$ 可以比 PID 的 $K_p$ 大很多（扰动已补偿），作者从 $k_p=1,k_d=0.5$ 起步。$\\delta$ 取 **0.01~0.1**：太小线性区太窄 ESO 抖，太大非线性特性丢失。**限幅后的实际值必须反馈给 ESO**，否则观测器会误判扰动。\n\n\n### `H391` ADRC 算力\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**ADRC 算力**：一次循环约 **50~80 个浮点运算**，STM32F405 上跑 200 Hz 没问题，F103 需要把 fal 改成查表法。反馈通道建议加 **20 Hz 低通**或用跟踪微分器代替直接微分。\n\n\n### `H392` DOBC 的最大坑是 $Q(s)$ 的相位滞后\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**DOBC 的最大坑是 $Q(s)$ 的相位滞后**。作者四旋翼上地面仿真很好、**一上天就炸了**，排查三天发现是 $Q(s)$ 相位滞后导致补偿信号与实际干扰不同步。$Q(s)$ 截止频率**从对象带宽的 1/3 起试**。边界：**DOBC 只能补偿低频干扰，对结构谐振等高频扰动无效，不能替代良好的基础控制设计**。\n\n\n### `H393` H∞\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**H∞**：**$\\gamma$ 远大于 1 说明加权函数太苛刻**（作者为此折腾两天）；加权函数一般**低通加权干扰通道、高通加权噪声通道**；**控制器阶数等于广义被控对象阶数**，高了用**平衡截断法降阶**，但**降阶后必须在非线性模型里重新验证**——作者降阶后没仔细测，某特定工况出现高频颤振。\n\n\n### `H394` H∞ vs μ综合的选型\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**H∞ vs μ综合的选型**：包线平滑、主要考虑参数摄动 → H∞ 足够；**包线变化剧烈或多个不确定性源耦合 → 上 μ综合**。作者有个项目在**跨声速区气动特性突变，H∞ 怎么调都压不住振荡，换 μ综合后解决**。加权函数必须反映真实物理约束（舵面偏转角速度、最大偏角）——他因忽略舵机速率限制，仿真完美、上真机振荡。\n\n\n### `H395` LPV 增益调度的实测教训\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**LPV 增益调度的实测教训**：**气动参数摄动超过 30% 时，传统线性插值增益调度的稳定裕度急剧下降**，作者为此摔过一架验证机；**直接用线性插值连接两个鲁棒控制器，过渡区出现高频颤振**，改用 LPV 凸组合才解决。某高空长航时无人机 $C_{L\\alpha}$ 在 **Ma 0.5→0.8 变化了 40%**，在 4 个马赫数点设计鲁棒控制器 + LPV 调度后：**±20% 气动摄动下俯仰角跟踪误差 <1.5°，传统方法同样条件下 >5°**。调度变量**必须选能实时测量的量（动压、马赫数）；用攻角调度要小心攻角传感器故障**。\n\n\n### `H396` 风场\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**风场**：稳态风是常值扰动，积分项能消；**阵风频率 0.1~10 Hz 都有能量，最怕与飞行器模态耦合**（作者在山区测试，山谷风频率刚好与横滚模态耦合，差点吹翻）。Dryden 的 $\\sigma$ 和 $L$ **必须按当地气象与地形调整**，城市峡谷 $L$ 比开阔地小很多；**风场参数要留成可配置项**，别写死在代码里，否则换场地要重新编译。\n\n\n### `H397` 阵风抑制的量化收益\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**阵风抑制的量化收益**：**ESO 方法比传统 PID 姿态偏差减小约 40%**，且不需要知道风场统计特性；观测器带宽取**控制器带宽的 3~5 倍**。前馈方案要求**气动系数误差 <5% 才启用**，误差超过 20% 前馈反而恶化性能。\n\n\n### `H398` NDI vs INDI\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**NDI vs INDI**：**气动数据误差 5% 时，NDI 效果还不如调好的 PID**——\"模型不准时别硬上 NDI\"；INDI 更实用但对传感器噪声敏感，低通截止频率取**控制带宽的 3~5 倍**。作者忠告：\"**别为了炫技而选方法**\"，他为了追求先进强上 NDI，模型参数一变控制品质就崩。\n\n\n### `H399` 全包线验证必须覆盖边界工况\n\n\n> 出处：E-04 《鲁棒控制与抗扰设计：不确定性建模、滑模/ESO/DOBC/H∞-μ/LPV 与风场抑制》\n\n\n**全包线验证必须覆盖边界工况**。作者所有标称工况都通过，唯独在**最大动压 + 最小重心的组合**下出现极限环振荡，后来加抗饱和补偿器才解决。包线网格**低速段和跨声速段要加密，巡航段可稀疏**。\n\n\n### `H400` 激励信号\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**激励信号**：**3211 幅值控制在 ±10° 以内**，太大进入非线性区、辨识结果失真。3211 的 3:2:1:1 比例不是拍脑袋定的——**它让能量在低频到中频段均匀分布，刚好覆盖短周期模态频带**。作者多次用复杂扫频反而把飞行员搞懵，换回 3211 数据干净利落。**扫频速率不能太快**，作者设太快导致**辨识出的阻尼比全是负的**，差点误判飞机不稳定。\n\n\n### `H401` 试飞科目顺序\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**试飞科目顺序**：先做低风险、信息量大的科目，跟飞机\"打个招呼\"。**千万别省掉\"试飞前做一次地面舵面校准\"**——作者数据里舵面偏角一直有 0.5° 零偏，查了两天才发现是电位计没归零。\n\n\n### `H402` 传感器零偏要第一个查\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**传感器零偏要第一个查**。压力传感器温漂导致数据均值偏移，最后辨识出的气动导数偏差很大。**拿到数据第一步先检查零偏**。\n\n\n### `H403` 采样率至少是感兴趣最高频率的 10 倍\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**采样率至少是感兴趣最高频率的 10 倍**（扫频到 5 Hz 就至少 50 Hz）。频域上另有一律：**数据长度至少是感兴趣最低频率周期的 5~10 倍**——作者采样率 100 Hz 只取 2 s，分辨率 0.5 Hz，长周期模态（0.1 Hz）根本分辨不出来，**延长到 20 s 才够**。\n\n\n### `H404` 预处理四步，顺序不能乱：先剔野点 → 再滤波 → 然后时间对齐 → 最后重采样\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**预处理四步，顺序不能乱：先剔野点 → 再滤波 → 然后时间对齐 → 最后重采样**。**重采样前一定要先滤波**，否则高频噪声折叠到低频产生混叠，作者见过直接降采样导致气动导数全错。滤波用 `filtfilt` 而非 `lfilter` 实现**零相位**，否则滤波后的时间偏移会毁掉时间对齐。\n\n\n### `H405` 野点剔除：物理约束法优于 3σ\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**野点剔除：物理约束法优于 3σ**。作者用 3σ 处理一组数据，结果野点太多把标准差都拉大了，反而漏掉真正的异常点。最小二乘类算法**对野点极其敏感**。\n\n\n### `H406` 时间对齐的基准要选\"你关心的物理量\"\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**时间对齐的基准要选\"你关心的物理量\"**。作者把所有数据对齐到 GPS 的 10 Hz，**短周期模态信息全丢了**，改用 IMU 的 100 Hz 才恢复正常。\n\n\n### `H407` EE vs OE 的实测教训\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**EE vs OE 的实测教训**：作者用差分法算角加速度，**辨识出的阻尼比居然是负的**，是测量噪声被差分放大、信噪比崩了。某教练机横航向：**EE 算出的滚转阻尼导数比风洞数据大了近一倍，OE 与风洞吻合**，原因是滚转角速率陀螺噪声太大。**如果 EE 和 OE 差太多，别急着调算法，先看数据**——作者 EE 与风洞差 30%，查出是某段传感器饱和，剔除后两者一致。\n\n\n### `H408` 可辨识性/共线性\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**可辨识性/共线性**：作者辨识纵向导数时遇到 **$\\alpha$ 与 $\\delta_e$ 高度相关，$X^TX$ 接近奇异，参数方差巨大**，根因是试飞时飞行员同时操纵升降舵和油门。**解决办法是重新设计试飞科目，保证激励信号正交**。另一个硬约束：**批处理要求至少 3~5 次不同幅值的扫频或 3211 信号**，一直平飞某些参数根本辨识不出来。\n\n\n### `H409` 闭环数据不能直接用 LS\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**闭环数据不能直接用 LS**。作者在闭环飞行数据上直接套最小二乘，**辨识出的气动导数符号都是反的**——闭环中控制律引入反馈，破坏了 LS 的假设。\n\n\n### `H410` RLS 初值与遗忘因子\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**RLS 初值与遗忘因子**：$P(0)=1000I$、$\\hat\\theta(0)=0$（收敛快）；**有风洞先验则把 $\\hat\\theta(0)$ 设成风洞值、$P(0)$ 设小**。**$\\lambda$ 必须小于 1，等于 1.0 算法会\"失忆\"**（作者忘了加遗忘因子，估计值越来越僵硬，排查两天）。时变系统 **$\\lambda\\approx0.97\\sim0.98$**；实时实现用**分段自适应**：平稳飞行 0.99、机动时降到 0.95（作者试过 0.9，估计值\"跳得像心电图\"）。作者的高效组合：**先用批处理跑离线数据得到初值，再喂给 RLS 做在线微调，\"效果出奇的好\"**。\n\n\n### `H411` 加权 LS 的实测收益\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**加权 LS 的实测收益**：做失速尾旋改出段辨识时，那段空速管误差达 20%，作者**把该段权重降到 0.1、平飞段设为 1，辨识出的阻尼导数比不加权准确 30%**。权重可按**传感器信噪比**设置。\n\n\n### `H412` MLE 工程要点\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**MLE 工程要点**：**取对数**避免数值下溢；**忽略海森矩阵中含二阶导的项（高斯-牛顿近似）**，作者早期算完整海森矩阵经常不收敛；**牛顿法对初值极敏感**，先用 LS 给个差不多的初值再精调。**CRLB 是标尺**：作者估计出的升力系数导数方差**比 CRLB 大近 10 倍**，一开始以为是算法问题，后来查明是**激励信号不充分导致可辨识性差**，加激励后方差就接近 CRLB 了。\n\n\n### `H413` 频域\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**频域**：PSD 用 **Welch 方法**（分段加窗平均降方差），直接 FFT 取模平方方差大得没法用。**相干函数 >0.8 时 H1 估计就够用**；相干低不一定是系统不行，也可能是激励能量不够——作者在某一频点相干掉到 0.3，查出是舵面伺服谐振点导致实际偏转远小于指令。**去趋势、去均值、抗混叠滤波一步都不能少**，作者忘了去趋势导致低频段出现虚假峰值。\n\n\n### `H414` 纵向实战（$C_{m\\delta_e}$）的作者案例\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**纵向实战（$C_{m\\delta_e}$）的作者案例**：翼展 2.4 m、起飞重量 8 kg 电动固定翼，30 s 数据、50 Hz 采样，用 3211 激励 + 输出误差法。**第一次跑出 $C_{m\\delta_e}=-0.62$，风洞值 -0.85**，排查方向：① 模型回代仿真看重合度，**$R^2<0.85$ 要警惕**；② 与风洞偏差**超过 20% 大概率是数据或方法有问题**；③ **至少用 20 s 以上激励数据**（作者用 5 s，参数方差大得离谱）；④ 每次辨识后**画残差**，残差有明显周期性说明漏了某个动态（弹性模态或作动器动态）。**千万别省迎角传感器**——图省事用惯导推算迎角，$C_{m\\delta_e}$ 偏差 15%，根因是侧风影响空速管。另外，**滤波器截止频率别设太低**：有人把 10 Hz 以上全滤了，短周期响应被削平，**辨识出的自然频率偏小 30%**。\n\n\n### `H415` 横航向必须联合辨识\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**横航向必须联合辨识**。作者用 LS 单独辨识方向舵导数，**$C_{n\\delta r}$ 与 $C_{n\\beta}$ 高度相关、两个参数都不可信**，改用 **EKF 把 $\\beta$ 也作为状态量估计**才解决。拟合初值不能不给（用 `curve_fit` 不给初值收敛到局部最优，**估出 $C_{l\\delta a}$ 是负的——副翼反向，显然不合理**）。辨识 $C_{n\\delta r}$ **必须选无风或微风天气**，作者某次结果总是偏低，发现是侧风把方向舵效果掩盖了。**侧滑角精度是横航向辨识的命门**：差 1°，$C_{n\\beta}$ 和 $C_{n\\delta r}$ 可能差 20%；加装五孔探针后侧滑角从 ±2° 提升到 ±0.5°，**$C_{n\\delta r}$ 误差从 6.7% 降到 3% 以内**。激励策略：先单独副翼、方向舵激励，再做**荷兰滚激励**（同时涉及滚转与偏航，能充分激励耦合动力学）。\n\n\n### `H416` 实时辨识的延迟账\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**实时辨识的延迟账**：传感器采集 + 传输 + 计算 + 输出，**加起来可能几十毫秒**。必须**给每个传感器数据打时间戳**（精度至少到微秒），用插值对齐到同一时刻；延迟太大时用状态转移矩阵把 $t-\\Delta t$ 的状态预测到 $t$；给控制器用的一阶外推 $C_L(t)\\approx C_L(t-\\Delta t)+\\dot C_L\\Delta t$。**\"模型不准的时候，宁可不补偿，也不要乱补偿。\"**\n\n\n### `H417` EKF 的雅可比别手算\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**EKF 的雅可比别手算**。作者辨识 $C_L(\\alpha)$ 时手算 $\\partial C_L/\\partial\\alpha$ 出错，整个滤波器直接发散——\"**用符号微分工具自动生成，别手算，真的会算到怀疑人生**\"。\n\n\n### `H418` 非线性/大迎角\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**非线性/大迎角**：**高阶多项式外推能力极差**，作者用 8 阶多项式拟合升力系数，插值区间外\"振荡得跟心电图似的\"；改**分段低阶多项式**（区间边界保证连续，分段点参考风洞曲线转折点，如升力斜率突变处、俯仰力矩\"勺形\"区）。**迟滞效应**（同一迎角、增/减迎角时系数不同）用一个一阶微分方程描述分离点运动，$\\tau$ 取 **0.1~0.3（无量纲时间）**，通过风洞强迫振荡试验辨识。**建模前先做灵敏度分析，只保留对输出影响显著的参数**，否则交叉耦合项会\"打架\"。\n\n\n### `H419` 模型验证三板斧\n\n\n> 出处：E-05 《气动参数辨识：激励设计、数据预处理、时域/频域方法、可辨识性与结果验证》\n\n\n**模型验证三板斧**：① **至少 10 折交叉验证**（飞行数据时序相关性强，折数太少会把相邻点分到不同组，验证结果偏乐观）；② **残差分析要定量**，用 **Ljung-Box 检验，$p<0.05$ 说明残差还有显著相关性，模型需要改进**——作者帮人排查，残差均值几乎为零但滞后 1 步自相关高达 0.6，判断\"模型阶次选低了\"，从二阶改三阶后自相关掉到 0.1 以下；③ **别只盯 RMSE，要看 95% 预测误差包络**：模型 A 的 RMSE 0.8°、模型 B 0.9°，但 A 在俯仰角超过 15° 时误差飙到 3° 以上，B 始终在 1.5° 以内，**最后选 B——因为大机动时更需要可靠预测**。验证数据要分成\"常规机动\"和\"极限机动\"两组分别计算，给模型画一张\"能力边界图\"。\n\n\n### `H420` 融合权重\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**融合权重**：作者在**飞行数据覆盖区域内取 $w=0.7\\sim0.8$，覆盖区域外取 $w=0$（完全信任风洞）**。他的推荐路径：**先用加权平均快速得到初步模型，再用贝叶斯做精细化，数据量足够大才上神经网络**。\n\n\n### `H421` 融合前必须做的一件事：先画同一张图看趋势\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**融合前必须做的一件事：先画同一张图看趋势**。作者遇到过好几次趋势都不一样，最后查明是**风洞用几何攻角、飞行用气动攻角，定义不一致**——\"如果趋势都不一样，那融合就是白费功夫\"。\n\n\n### `H422` 缩比效应必须修正\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**缩比效应必须修正**。作者用 **1:5 缩比模型测出失速攻角 14°，全尺寸飞机 12° 就开始抖**，根因是雷诺数效应。阻力用**等效平板法**修正（先算全尺寸与缩比模型的平板摩擦阻力比，再用这个比例修正总阻力），虽然粗糙但工程够用。\n\n\n### `H423` 神经网络融合的坑\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**神经网络融合的坑**：直接用飞行数据训练网络，**因数据覆盖范围太小，网络在边界处完全发散**；改成**先用风洞数据预训练、再用飞行数据微调**效果好很多。\n\n\n### `H424` 气动模型集成的阶数陷阱\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**气动模型集成的阶数陷阱**：有人为拟合精度硬上 **7 阶多项式，仿真时稍微偏离辨识数据范围模型就发疯**——高阶多项式外推能力极差。接口定义要**跟实际传感器对齐**：攻角实际来自大气数据系统，仿真里也要模拟这个延迟和噪声，**不能直接用真值**。模型计算要在仿真步长（1/5/10 ms）内算完——作者把神经网络模型跑在 CPU 上，**一个步长算 20 ms，仿真直接超时**。\n\n\n### `H425` 模型必须加\"超范围保护\"\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**模型必须加\"超范围保护\"**：辨识数据覆盖的飞行状态有限，HIL 或仿真可能跑到范围外，**超出范围就限幅或报警**。数据库里**留一个\"置信度\"字段**（风洞 0.8、CFD 0.6、飞行数据 0.95），控制律设计时才知道哪些数据要留余量。\n\n\n### `H426` HIL 集成的三类典型故障\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**HIL 集成的三类典型故障**：① **先做开环测试**——作者闭环怎么都飞不稳，查了两天发现接口信号极性反了，**开环五分钟就能发现**；② 模型发散先别改模型，检查是不是接口延迟太大，或**传感器模型加了不该加的噪声**（作者遇到过陀螺噪声设成高斯白噪声，实际陀螺根本没这么大）；③ **时钟不同步导致控制周期错乱**，用同步信号或 **IEEE 1588**。\n\n\n### `H427` HIL 测不出的物理效应\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**HIL 测不出的物理效应**：电机 EMI 耦合到传感器线缆、螺旋桨振动引发的共振。作者的标准流程：**HIL → 系留飞行（离地 30 cm）→ 全自由飞行**。\n\n\n### `H428` 试飞频域评估（扫频）\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**试飞频域评估（扫频）**：**扫频幅值取舵面最大偏度的 5%~10%**，频率 0.1~10 Hz；太小信噪比不够，太大激发非线性。作者在某型无人机上扫频，**一眼看出某个模态的谐振峰比仿真高 6 dB，查出是舵机安装刚度不足**——\"这种问题仿真根本发现不了\"。**数据采集的抗混叠滤波器截止频率要根据扫频范围设置**，作者见过把高频信息全滤掉、导致频响数据\"干净到不真实\"。\n\n\n### `H429` 时域评估\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**时域评估**：阶跃指令看超调量、调节时间、稳态误差，**在平飞/爬升/转弯三个特征点各做 3 次取平均**。\n\n\n### `H430` 数据驱动调参的过拟合陷阱\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**数据驱动调参的过拟合陷阱**：**至少用 3 次不同气象条件下的飞行数据做交叉验证，模型在 3 组数据上的预测误差都在 5% 以内，才敢用它调参**。作者的经典案例：某固定翼无人机高速段滚转振荡，仿真显示裕度足够，**用飞行数据辨识后发现副翼效率比仿真低 30%、滚转阻尼小 40%，重新整定滚转通道 PID 后问题解决**。\n\n\n### `H431` 蒙特卡洛样本量\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**蒙特卡洛样本量**：**N 取 5000 以上比较稳妥**，尾部概率才估得准。作者偷懒只取 500，**置信区间边界飘得厉害，后来老老实实加到 10000**。协方差分析（一阶）更快但**强非线性（如大迎角失速区）会失效**，那种情况老老实实用蒙特卡洛。\n\n\n### `H432` 小样本别用正态假设\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**小样本别用正态假设**：作者**样本量只有 15 个时直接用正态分布算置信区间，区间窄得离谱**，改用 **Bootstrap 后发现真实不确定性比正态假设下大了将近一倍**。\n\n\n### `H433` 不确定性量化的目的是闭环\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**不确定性量化的目的是闭环**：作者画的流程是——**量化不确定性 → 评估控制器鲁棒性 → 不满足就回来更新参数分布、重新辨识**。\"这才是工程上该有的态度。\"\n\n\n### `H434` 自适应/在线学习需要持续激励\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**自适应/在线学习需要持续激励**。作者见过团队仿真里 MRAC 跑得特别好，**一上天参数估计器发散、控制器直接饱和，根因就是激励不足**。飞行试验中**要设计专门的激励输入（小幅度扫频或 PRBS）**。做在线学习**必须加\"异常检测/模型健康度监控\"**——作者的项目里攻角传感器突然漂移，模型跟着学歪、飞控直接震荡，还好有备份方案切回离线模型。\n\n\n### `H435` MRAC 的参考模型要\"现实一点\"\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**MRAC 的参考模型要\"现实一点\"**。有人把参考模型设得完美（响应快、无超调、无稳态误差），自适应机构拼了命也追不上，因为真实系统的物理限制摆在那里。**自适应增益 $\\Gamma$ 从 0.1 起试**，逐步增大到 0.5 或 1.0，每次改完跑仿真验证。**必须加\"回退看门狗\"**——误差突然变大就切回固定参数模式。作者的惨痛教训：**MRAC 仿真效果特别好，一上真机飞机直接翻跟头，原因是自适应律积分饱和**（仿真信号理想，真机有噪声有延迟，积分项一直累积，参数飘到不合理范围）。\n\n\n### `H436` ILC 的前提\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**ILC 的前提**：**每次飞行的轨迹必须高度重复**，否则修正量反而引入误差。作者习惯**先用 GPS 航点导航把轨迹精度控制在 0.5 m 以内，再启动 ILC 迭代**，某垂直起降无人机**第三次飞行时轨迹跟踪误差降到 0.2 m 以内**。\n\n\n### `H437` 跨音速区增益表要加密\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**跨音速区增益表要加密**：作者因增益表划分太粗导致飞机在跨音速区出现极限环振荡，**把 Ma 0.8~1.2 这段加密到 0.05 一个点才解决**。F-16 纵向控制经典做法是按**\"动压 + 迎角\"二维查表**——动压决定舵效，迎角决定稳定性导数，这两个组合基本覆盖 90% 飞行状态。\n\n\n### `H438` MPC 用气动模型的实时性\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**MPC 用气动模型的实时性**：作者在无人机 MPC 上用 20 步预测时域，**机载电脑算不过来，控制周期从 50 ms 拖到 200 ms**；砍到 10 步 + 求解器从内点法换成 **OSQP** 才跑实时。\n\n\n### `H439` 入门路径建议\n\n\n> 出处：E-06 《建模—辨识—控制的闭环迭代：数据融合、模型更新、仿真-试验一致性与蒙特卡洛鲁棒性评估》\n\n\n**入门路径建议**（作者反复强调）：**刚入行先从增益调度入手**（直观、好调试、容易通过适航认证），**等把气动模型和控制器之间的\"手感\"练出来了，再碰自适应和 MPC**。\"别一上来就搞复杂的，容易把自己绕进去。\"\n", "size": 187246}, {"path": "assets/04_parameters.md", "kind": "md", "text": "# 数据资产 04 — 工程参数速查表\n\n> 从 30 张卡【A++ - 经验】段中提炼的**可直接落地的数值**，全部标注出处卡号（可回查 `03_heuristics.md` / `assets.json`）。\n> 用法：初值照抄「推荐值」→ 按「调节方向」微调 → 用「红线」校验是否越界。\n\n---\n\n## 1. 制导律参数\n\n| 参数 | 推荐值 | 调节方向 | 红线 / 失效边界 | 出处 |\n|---|---|---|---|---|\n| 导航比 $N$（TPN） | **3.5**（初选），扫 $2.5\\sim5.0$ | 延迟大 → 调小；机动强 → 调大 | $N\\le2$ 不收敛；$N>10$ 易饱和 | A-01, A-02, B-02 |\n| 导航比 $N$（PPN） | $6\\sim10$ | 同效果需比 TPN 大 2 倍左右 | 直接套 TPN 的 $N$ 脱靶量大数倍 | A-01 |\n| $N$ 随舵机延迟选型 | 0 ms→**3.5~4.0**｜50 ms→3.0~3.5｜100 ms→2.8~3.2｜200 ms→2.5~3.0 | 延迟↑ ⇒ $N$↓ | 不确定延迟时取 $N=3.0$ | A-02 |\n| $N$ 限幅域 | $[3,\\ 10]$ | 初始段 $t_{go}$ 很大时增益可能算成负值 → 强制置 3 | <3 不稳，>10 饱和 | B-02 |\n| APN 补偿系数 | $N/2$（对常值机动零脱靶） | $N$ 取 4~6（建议 **4.5**） | 估计误差 >30% 时 APN 可能不如 PN；>50% 反而更差 | B-03, A-05 |\n| APN 估计延迟上限 | **≤0.2 s** | 越小越好 | >0.2 s 补偿\"帮倒忙\" | B-03 |\n| 变导航比时间常数 | $0.2\\sim0.5$ s | 禁止阶跃切换（指令跳变、弹体抖动） | 自适应律增益 $K$ 过大 → 系统震荡 | A-02 |\n| BPN 偏置 / 切换滞回 | $t_{go}$：进 3~5 s / 退 4~6 s（退比进大 1~2 s）；$\\hat a_T$：进 3~5 g / 退 2~4 g（退比进小 1~2 g） | 必须滞回 | 无滞回 → PN/PG 来回震荡 | A-06 |\n\n## 2. 目标机动建模与估计\n\n| 参数 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| Singer 机动频率 $\\alpha$ | 缓慢（客机）**0.1~0.5**｜中等（战斗机巡航）**0.5~2.0**｜剧烈（导弹规避）**2.0~10.0** 1/s | 模型选择比滤波器更重要：\"先花 70% 精力建模型\" | B-03 |\n| 机动检测置信度 | **99.5%**（一般 95% 或 99%） | 阈值过严 → 滤波器频繁重置、估计反而更差 | B-03 |\n| 估计误差门限 | 误差超 **50%~60%** 时 APNG 劣于 PNG | 必须加置信度门限，低于阈值退化为 PN | A-05 |\n| 卡尔曼调参顺序 | **先 R → 后 Q → 再 $P_0$**；$P_0 \\approx 10R$ | $Q$ 对角元设太小（如 0.01）→ 估计滞后 0.3 s | A-05 |\n| 目标机动模型选型 | 匀速/匀加速 → Singer（一阶马尔可夫）→ 当前统计 → IMM | 模型永远比滤波器重要 | B-03 |\n\n## 3. 最优控制 / LQR\n\n| 参数 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 权重初值（Bryson 规则） | $Q_{ii}=1/x_{max,i}^2$，$R_{jj}=1/u_{max,j}^2$ | 保证状态与控制量级可比，避免数值问题 | B-02 |\n| $Q$ 内部比例 | **$Q_{22} \\approx 10\\,Q_{11}$**（角速率权重 >> 角度权重） | 脱靶量主要由角速率决定；反着设\"弹道抖得像蛇\" | B-02 |\n| 实测可用配置 | $Q=\\mathrm{diag}([1,100])$、$R=10$ → 脱靶 <0.5 m、最大过载 <8 g | 可作为基线 | B-02 |\n| 终端权 $S$ | $S \\approx 10\\sim100\\,R$（先固定 $s\\approx100$） | **$S$ 不是越大越好**：过大使末端控制量剧烈变化（仿真完美、实物抖动） | B-02 |\n| $q/r$ 起始比例 | 从 **10** 开始试 | 先固定 $s$，再调 $q/r$ | B-02 |\n| Riccati 求解 | 有限时域用**瞬态解**（从 $t_f$ 反向积分） | 稳态解（ARE）只保证无限时间最优，初始瞬态可能很差 | B-02 |\n| $P$ 矩阵校验 | 特征值必须全正 | 不正定 → 反馈律直接发散 | B-02 |\n| 在线性算力不足时 | 离线算增益表 + 在线查表插值（或每 0.01 s 重解一次） | 某型导弹实测实时性无问题 | B-02 |\n\n## 4. $t_{go}$（剩余飞行时间）\n\n| 项目 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 限幅 | $[0.1,\\ 10]$ s | 目标大机动时 $t_{go}$ 可从 2 s 跳到 4 s，指令剧烈震荡 | B-02 |\n| 滤波 | 一阶低通，$\\tau \\approx 0.05$ s | **必须加滤波** | B-02 |\n| 机动修正 | $t_{go} = R/V_c + 0.5\\,a_{T,est}\\,t_{go}^2/V_c$，迭代 **2~3 次** | 隐式方程 | B-02 |\n| 定位 | **全系统最容易出问题的地方** | 优先排查项 | B-02 |\n\n## 5. 导引头 / 噪声 / 视场\n\n| 参数 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| $\\dot\\lambda$ 获取 | **禁止直接差分**，须滤波或卡尔曼估计 | 差分使噪声放大数倍、指令\"抖得像筛子\" | A-01 |\n| $\\lambdȧ$ 滤波时间常数 $\\tau_f$ | **~20 ms 为内点最优**（本仿真标定：5 ms→3.45 m，10 ms→0.96 m，**20 ms→0.25 m**，50 ms→0.27 m，100 ms→0.39 m，200 ms→0.34 m） | 太小≈纯差分噪声爆炸；太大引入相位滞后 | 仿真标定（book010/verify_engagement.py B2 组） |\n| 噪声模型选择 | **测角噪声 $\\sigma_\\lambda$ + 滤波微分** | 直接在 $\\dot\\lambda$ 上叠平谱噪声会得出\"N 大反而好\"的错误结论 | 仿真标定 |\n| 测角噪声量级 | $\\sigma_\\lambda \\sim 1$ mrad（示例工况） | $\\sigma_\\lambda$ ≥3 mrad 时 $\\tau_f$=20 ms 会把指令打饱和（>25 g） | 仿真标定 |\n| 视场半角 / 框架角 | 典型视场半角 **30°**；框架角按 $|\\lambda-\\gamma_M|$ 定义，仅统计 $r>150$ m 的制导段 | 误用 $\\arccos(\\hat v\\cdot\\hat r)$ 会算出 175° 的荒谬值 | 仿真标定 |\n\n## 6. 执行机构与延迟\n\n| 项目 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 过载限幅裕度 | 保留 **20%（作者建议 30%）** | 某项目按 80% 可用过载设计，靶试时需求冲到 85% | A-04 |\n| 限幅方式 | 软限幅 $u_{sat}=u_{max}\\tanh(u/u_{max})$ 优于硬限幅；动态限幅最推荐 | — | A-04 |\n| 抗饱和三层次 | ① 指令限幅 → ② 抗饱和制导律（条件积分 / 反计算 $K_{aw}=1/K_i$）→ ③ 动态补偿 | 实测饱和次数 -60%、脱靶 5 m→1.2 m | A-04 |\n| 舵机延迟门槛 | **τ ≤50 ms 基本无碍**；100 ms→脱靶 0.0045 m；150 ms→0.093 m；200 ms→1.364 m；300 ms→7.50 m | 判据 $N\\tau/t_{go}\\to1$ 失稳 | 仿真标定 |\n| 协同通信时延 | ≤ 控制周期的 **1/5**（周期 50 ms → 时延 ≤10 ms） | 时延 10 ms→50 ms，收敛时间 2 s→8 s | B-06 |\n| 建模顺序 | **执行机构延迟必须先进模型再调参** | LQR 仿真完美、上硬件就抖，查出是延迟未建模 | B-02 |\n\n## 7. 仿真、优化与验收\n\n| 项目 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 蒙特卡洛次数 | **≥500~1000 次**，且需覆盖边界工况 | 少于此散布统计不可信 | B-05 |\n| 脱靶量评级 | **<1 m 优秀**｜1~3 m 良好｜3~5 m 及格 | — | B-05 |\n| 鲁棒性 $\\sigma/\\mu$ | **<0.3 优秀**｜0.3~0.5 良好｜>0.5 需改进 | 本仿真实测 P95/均值 = **3.4×** | B-05 / 仿真标定 |\n| 带干扰验收线 | 带干扰脱靶均值 ≤ 理想值 **2 倍**可接受；>3 倍必须回炉 | — | B-05 |\n| 参数优化选型 | 参数多/强非线性→GA；连续参数/中等维度→PSO；仿真昂贵→贝叶斯 | **两阶段法**：GA/PSO 锁定区域 → 贝叶斯精调 | B-05 |\n| PSO 初始化 | **拉丁超立方采样**（优于随机均匀） | — | B-05 |\n| MPC 预测时域 | **10~20 步**；先调 Q 再调 R；硬约束加松弛变量 | 实测：PN 2.3 m/12.5 g（超限）→ MPC 0.8 m/8.0 g、能耗 -15%、耗时 3.2 ms | A-06 |\n| 定点化混合精度 | 大范围量（位置/速度）浮点或 Q32.32；姿态角/制导系数 Q15 | 某无人机 2 ms→0.5 ms、精度损失 <0.1% | B-05 |\n\n## 8. 数值方法 / 工程实现\n\n| 项目 | 推荐值 | 说明 | 出处 |\n|---|---|---|---|\n| 变量缩放 | 全部归一化到 $[0,1]$ 或 $[-1,1]$ | 位置 $10^4$ m 与协态 $10^{-3}$ 不缩放，数值误差淹没真解 | B-04 |\n| 协态初值猜测 | ① 从终端反推 ② 按物理意义给量级 ③ 先简化一维 → 最后用 GA 辅助 | \"从终端反推屡试不爽\" | B-04 |\n| CasADi | 优先 **MX** 变量；**不做缩放**（须先自行归一化）；初值用**线性插值** | 状态量级差异大（1000 vs 0.01）时 IPOPT 收敛极慢 | B-04 |\n| HJI 维度 | 状态 >4 维网格爆炸 → 用**稀疏网格** | 6 维跑一晚无结果 | B-03 |\n| 神经网络近似 | 1~2 隐藏层、每层 8~16 神经元、ReLU；输出层 sigmoid | 边界震荡 → 用物理约束（过载/速率限幅）作激活函数；训练数据须覆盖\"危险区域\" | B-03, A-06 |\n| 模糊规则表规模 | **5×5 足够**（9×9 会
