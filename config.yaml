# =============================================================================
# T4 低风险策略（确定性 APN + 保守调参）
# =============================================================================
t4_low_risk:
  enabled: true
  # 蒸馏知识/经验加速：规划器若选 REUSE_HISTORY，不再强制改成第一轮 MODIFY_LAW。
  # 复现论文 T4 主表时改回 honor_reuse_history: false，first_iter_mode: modify_law。
  honor_reuse_history: true
  first_iter_mode: planner          # modify_law | planner（planner=尊重规划器）
  deterministic_apn: true
  deterministic_apn_kb_only: true   # 仅 KB 种子写入内置 APN；Gate 通过脚本上走 LLM 增量 MODIFY
  ny_limit_g: 20.0
  # 接近第三轮 4/5 平台(w1≈45)；下限防 CLS 把 w1 打穿致 BW<20
  max_w: 44.0
  min_w1: 34.0
  max_n_pn: 4.5
  # Expert 一致性：R1 规则种子 + temperature=0 + CLS 前 fixup
  expert_temperature: 0.0
  expert_rule_first_r1: true
  expert_r1_w1_cap: 40.0
  pre_cls_bw_pm_fixup: true
  pre_cls_w1_drop: 6.0
  post_modify_expert_rounds: 3
  # A: Gate 闭环快扫仅看 PeakNy MC 均值；peak_ny_max 不参与 Gate/验收
  modify_gate_peak_g: 35.0
  modify_gate_hit_min_pct: 80.0
  modify_fail_peak_g: 50.0
  # B: Gate 因 mean 略超 20g 但 ≤ modify_gate_peak 时，同轮切 TUNE 进 Layer3
  gate_near_miss_tune_enabled: true
  modify_fail_hit_rate_min: 80.0
  post_modify_first_tune_strategy: expert
  post_modify_max_episodes: 15
  post_modify_ppo_max_episodes: 0
  post_modify_ppo_peak_max_g: 40.0
  post_modify_ppo_hit_min_pct: 80.0
  force_skip_ppo_after_expert: true
  # Expert 基线 SEP 已进近邻（如 11m）时跳过 PPO，直接 CLS，避免破坏基线
  skip_ppo_expert_sep_max_m: 18.0
  skip_ppo_expert_hit_min_pct: 88.0
  peak_near_miss_g: 8.0
  near_miss_ppo_max_episodes: 60
  modify_gate_nmc: 10
  pe_store_peak_max_g: 25.0
  pe_store_hit_min_pct: 92.0
  borderline_nmc_revalidate: 30
  conservative_autopilot:
    w1: 35.0
    zeta1: 0.65
    tao1: 0.12
    w2: 32.0
    zeta2: 0.65
    tao2: 0.12
    w3: 35.0
    zeta3: 0.65
    N_pn: 3.5

# =============================================================================
# 兼容性保留字段（不影响主流程，可保持默认值）
# =============================================================================
optimizer:
  enabled: false   # 旧版遗传算法优化器开关，已被 MatlabRLOptimizer 取代
  type: rl

rl:
  algorithm: ppo   # PPO 为当前主算法（由 MatlabRLOptimizer 实现）
  learning_rate: 0.0003
  discount_factor: 0.99

# =============================================================================
# 知识库管理 Web 端 (知识库管理 + RAG 管理界面)
# 由 run_web.py 读取；提供检索 / 文档管理 / 经验卡 / 反馈 等管理能力。
# =============================================================================
web:
  enabled: true          # 是否启动 Web 管理端
  host: 0.0.0.0          # 监听地址（本机访问用 127.0.0.1）
  port: 6006             # 访问端口 → http://localhost:6006
  # 向量检索开关：
  #   false → 纯 BM25 模式（当前推荐）。chroma 0.5.x 的 Rust 原生内核在部分
  #        Windows 上 collection.get()/query()/upsert() 会触发原生 access
  #        violation（不可被 Python 捕获，直接拖死进程）。纯 BM25 完全不碰
  #        chromadb，服务稳定；检索/入库/审核/回流/next_action 照常工作。
  #   true → 向量 + BM25 混合检索（Chroma + DashScope text-embedding-v3）。
  #        前提：必须先把 chromadb 降到 0.4.x（预 Rust 内核，用 hnswlib C++，
  #        无此崩溃）。降级命令：pip install chromadb==0.4.24
  #        降级并 `python scripts/test_chroma.py` 通过后再翻为 true 重启即可。
  vector_search: true
  # 端点：/api/stats, /api/docs, /api/search, /api/doc,
  #       /api/reindex, /api/feedback, /api/next_action, /api/experience
