  #     model: deepseek-v4-pro
  #     api_key: sk-3032a69eef4a45f994b6c5b5955e3130（从 https://platform.deepseek.com 获取）
  #
  #   【Qwen3.7-Max】（阿里巴巴最新旗舰，2026-05-20）
  #     provider: custom
  #     base_url: https://llm-a3wc4wrgueg5obd3.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  #     model: qwen3.7-max
  #     api_key: sk-ws-H.ELHEIEM.QAjt.MEQCID4CSLXQKyHvBSYVVFI6qiFq0cflDfGwG-_57PHAXqYMAiBDdfcrkEb_YIYbk3U9ZaBoUGjuDfz8Pwo_FM560oF6Fg（https://bailian.console.aliyun.com/）
  #     注：Qwen3.8-Max 预览版（2026 年 3 月）仅作参考，未纳入实验
  #
  #   【Kimi K3】（月之暗面最新旗舰，2026-07-28）— 当前欠费，暂不启用
